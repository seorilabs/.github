# DEPLOYMENT TEMPLATE. NetworkPolicy is IP/label based; the named egress proxy
# must independently enforce exact HTTPS provider hostnames and TLS identities.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: auth-broker
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-to-cluster-resolver-only
  namespace: auth-broker
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-from-trusted-workers
  namespace: auth-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seori-auth-broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              seorilabs.io/auth-clients: "true"
          podSelector:
            matchLabels:
              seorilabs.io/auth-client: "true"
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factor-services-from-broker
  namespace: auth-broker
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["seori-password-loader", "seori-totp-signer"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seori-auth-broker
      ports:
        - protocol: TCP
          port: 9443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-to-factor-services
  namespace: auth-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seori-auth-broker
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["seori-password-loader", "seori-totp-signer"]
      ports:
        - protocol: TCP
          port: 9443
    - to:
        - namespaceSelector:
            matchLabels:
              seorilabs.io/egress-proxy: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seori-auth-egress-proxy
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factor-services-to-secret-manager-proxy
  namespace: auth-broker
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["seori-password-loader", "seori-totp-signer"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              seorilabs.io/egress-proxy: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seori-auth-egress-proxy
      ports:
        - protocol: TCP
          port: 8443
