# DEPLOYMENT TEMPLATE. This file is fail-closed until all REPLACE_* values,
# immutable image digests, mTLS identities, encrypted PVCs, and egress proxy
# allowlists are verified. CI validates it but never applies it.
apiVersion: v1
kind: Service
metadata:
  name: auth-broker
  namespace: auth-broker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: seori-auth-broker
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
---
apiVersion: v1
kind: Service
metadata:
  name: password-loader
  namespace: auth-broker
spec:
  selector:
    app.kubernetes.io/name: seori-password-loader
  ports:
    - name: mtls
      port: 9443
      targetPort: mtls
---
apiVersion: v1
kind: Service
metadata:
  name: totp-signer
  namespace: auth-broker
spec:
  selector:
    app.kubernetes.io/name: seori-totp-signer
  ports:
    - name: mtls
      port: 9443
      targetPort: mtls
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seori-auth-broker
  namespace: auth-broker
  annotations:
    seorilabs.io/deployable: "false"
    seorilabs.io/deployment-gate: REPLACE_DIGESTS_IDENTITIES_PVC_MTLS_EGRESS
spec:
  serviceName: auth-broker
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seori-auth-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seori-auth-broker
    spec:
      serviceAccountName: auth-broker
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: example.invalid/seori-auth-broker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          command: ["/opt/seori-auth/bin/seori-auth-native", "launch", "--", "/opt/seori-auth/bin/auth-broker"]
          args:
            - serve
            - --require-native-attestation
            - --require-journal-integrity
            - --vault-directory=/var/lib/seori-auth/vault
            - --runtime-directory=/run/seori-auth/browser
          ports:
            - name: mtls
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /var/lib/seori-auth
            - name: runtime
              mountPath: /run/seori-auth
            - name: workload-token
              mountPath: /var/run/seori-auth/identity
              readOnly: true
      volumes:
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: workload-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: REPLACE_SECRET_MANAGER_WIF_AUDIENCE
                  expirationSeconds: 600
                  path: token
        - name: state
          persistentVolumeClaim:
            claimName: REPLACE_ENCRYPTED_AUTH_BROKER_PVC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seori-password-loader
  namespace: auth-broker
  annotations:
    seorilabs.io/deployable: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seori-password-loader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seori-password-loader
    spec:
      serviceAccountName: password-loader
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: password-loader
          image: example.invalid/seori-password-loader@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          imagePullPolicy: IfNotPresent
          command: ["/opt/seori-auth/bin/seori-auth-native", "launch", "--", "/opt/seori-auth/bin/password-loader"]
          args: ["serve", "--listen=:9443", "--mtls-required", "--no-secret-export"]
          ports:
            - name: mtls
              containerPort: 9443
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - name: workload-token
              mountPath: /var/run/seori-auth/identity
              readOnly: true
            - name: runtime
              mountPath: /run/seori-auth
      volumes:
        - name: workload-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: REPLACE_PASSWORD_WIF_AUDIENCE
                  expirationSeconds: 600
                  path: token
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
