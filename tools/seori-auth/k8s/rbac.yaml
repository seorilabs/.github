# NON-DEPLOYABLE REFERENCE. See README deployment gates; do not apply directly.
apiVersion: v1
kind: Namespace
metadata:
  name: seori-auth-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: seori-auth-workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seori-auth-worker
  namespace: seori-auth-workloads
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seori-auth-worker-no-kubernetes-api
  namespace: seori-auth-workloads
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seori-auth-worker-no-kubernetes-api
  namespace: seori-auth-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seori-auth-worker-no-kubernetes-api
subjects:
  - kind: ServiceAccount
    name: seori-auth-worker
    namespace: seori-auth-workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seori-auth-local-pod
  namespace: seori-auth-workloads
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seori-auth-execution-copy-reader
  namespace: seori-auth-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["seori-auth-execution-copy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seori-auth-execution-copy-reader
  namespace: seori-auth-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seori-auth-execution-copy-reader
subjects:
  - kind: ServiceAccount
    name: seori-auth-local-pod
    namespace: seori-auth-workloads
