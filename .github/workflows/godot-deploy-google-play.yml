# Seorilabs org 재사용 워크플로우: Godot 게임 Google Play (서명 AAB + 업로드)
# 호출: uses: seorilabs/.github/.github/workflows/godot-deploy-google-play.yml@<FULL_COMMIT_SHA>
# 러너: seorilabs-x64-android 고정(x64 필수). godot --export-release → 서명 AAB → WIF 업로드.
# 버전 정본: GitHub 릴리즈 태그 vX.Y.Z 하나뿐이다(contracts/release-version-authority.yaml).
# export_presets.cfg와 play-store config JSON은 authority가 아니라 주입 대상이고, AAB manifest
# readback이 태그 파생값과 다르면 업로드 전에 fail-closed한다.
# 표준 repo contract(tools/): 선택적 install/build/readiness 스크립트.
# 업로드는 exact central SHA의 scripts/release/upload-google-play-aab.py만 사용한다.
name: Godot Deploy Google Play (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
      package_name:
        description: "Backoffice BuildTarget의 Google Play package ID. 검증된 AAB identity와 같아야 한다."
        required: false
        default: ""
        type: string
      track:
        required: false
        default: "internal"
        type: string
      release_status:
        required: false
        default: "draft"
        type: string
      upload:
        required: false
        default: true
        type: boolean
      godot_version:
        required: false
        default: "4.6.3"
        type: string
      godot_status:
        required: false
        default: "stable"
        type: string
      project_dir:
        required: false
        default: "."
        type: string
      aab_name:
        description: "AAB 파일명(확장자 제외). 비우면 repo 이름."
        required: false
        default: ""
        type: string
      android_export_preset:
        description: "Godot Android export preset 이름. 버전 주입과 export 대상이 같아야 한다."
        required: false
        default: "Android"
        type: string
      scripts_dir:
        required: false
        default: "tools"
        type: string
      prepare_project_script:
        description: "Godot import 전에 실행할 repo-local 준비 스크립트"
        required: false
        default: ""
        type: string
      post_export_validation_script:
        description: "AAB export 직후·업로드 전에 실행할 repo-local 검증 스크립트"
        required: false
        default: ""
        type: string
      timeout_minutes:
        required: false
        default: 30
        type: number
    secrets:
      FIREBASE_ANDROID_API_KEY:
        required: false
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:
        required: false
      GODOT_ANALYTICS_CONFIG_JSON_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  build-aab:
    name: Godot signed Android App Bundle
    # 마켓 자격증명을 쓰는 job은 caller가 러너를 고를 수 없다. x64 ARC로 고정한다.
    runs-on: seorilabs-x64-android
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: google-play

    env:
      GODOT_VERSION: ${{ inputs.godot_version }}
      GODOT_STATUS: ${{ inputs.godot_status }}
      PROJECT_DIR: ${{ inputs.project_dir }}
      ANDROID_EXPORT_PRESET: ${{ inputs.android_export_preset }}
      SCRIPTS_DIR: ${{ inputs.scripts_dir }}
      PREPARE_PROJECT_SCRIPT: ${{ inputs.prepare_project_script }}
      POST_EXPORT_VALIDATION_SCRIPT: ${{ inputs.post_export_validation_script }}
      SHOULD_UPLOAD: ${{ inputs.upload }}
      ADMOB_REQUIRE_PRODUCTION: "1"
      ADMOB_TARGET_PLATFORM: Android
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      ADMOB_ANDROID_FOAM_BOMB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_ANDROID_FOAM_BOMB_REWARDED_AD_UNIT_ID }}
      ADMOB_ANDROID_LEVEL_REWARD_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_ANDROID_LEVEL_REWARD_REWARDED_AD_UNIT_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_GCM_SENDER_ID: ${{ vars.FIREBASE_GCM_SENDER_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false

      # 버전 authority 구현은 org 정본에만 둔다. caller 저장소 스크립트를 신뢰하지 않기 위해
      # called workflow identity를 확인하고 그 exact commit SHA로 정본을 받아 실행한다.
      - name: Validate called reusable workflow identity
        id: authority
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          EXPECTED_WORKFLOW_PATH: seorilabs/.github/.github/workflows/godot-deploy-google-play.yml
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const expected = process.env.EXPECTED_WORKFLOW_PATH + "@" + identity.workflow_sha;
            if (identity.workflow_repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(identity.workflow_sha ?? "") || identity.workflow_ref !== expected) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + identity.workflow_repository, "sha=" + identity.workflow_sha, "ref=" + identity.workflow_ref].join("\n") + "\n");
          '

      - name: Checkout exact release version authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.authority.outputs.repository }}
          ref: ${{ steps.authority.outputs.sha }}
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Resolve exact release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          # 태그 선택은 실행 이벤트에 묶인다. refs/tags 실행은 그 태그가 곧 정본이고,
          # 최신 태그 폴백은 운영자가 시작한 workflow_dispatch에서만 허용한다.
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_REF: ${{ github.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag --list > "$RUNNER_TEMP/git-tags.txt"
          tag="$(node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --tag-list-file "$RUNNER_TEMP/git-tags.txt" --print-tag)"
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          git -c advice.detachedHead=false checkout "refs/tags/$tag"
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          [ "$tag_commit" = "$head_commit" ] || {
            echo "checkout HEAD가 exact tag commit과 다름: tag=$tag_commit HEAD=$head_commit" >&2
            exit 1
          }
          # refs/tags 이벤트는 그 이벤트가 가리키는 commit만 build한다.
          case "$RELEASE_EVENT_REF" in
            refs/tags/*)
              [ "$tag" = "${RELEASE_EVENT_REF#refs/tags/}" ] || {
                echo "tag 이벤트 ref와 해석된 태그가 다름: $RELEASE_EVENT_REF != $tag" >&2
                exit 1
              }
              [ "$tag_commit" = "$RELEASE_EVENT_SHA" ] || {
                echo "tag 이벤트 commit과 태그 commit이 다름: $RELEASE_EVENT_SHA != $tag_commit" >&2
                exit 1
              }
              ;;
          esac
          { echo "tag=$tag"; echo "sha=$tag_commit"; } >> "$GITHUB_OUTPUT"

      - name: Bind release version to the tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ steps.tag.outputs.sha }}
          JOB_WORKFLOW_REPOSITORY: ${{ steps.authority.outputs.repository }}
          JOB_WORKFLOW_REF: ${{ steps.authority.outputs.ref }}
          JOB_WORKFLOW_SHA: ${{ steps.authority.outputs.sha }}
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_REF: ${{ github.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-tag-message.txt"
            export RELEASE_TAG_MESSAGE_FILE="$RUNNER_TEMP/release-tag-message.txt"
          fi
          RELEASE_HEAD_SHA="$(git rev-parse 'HEAD^{commit}')" \
          RELEASE_LOCAL_TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" \
            node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --github-output

      - name: Resolve AAB name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          name="${{ inputs.aab_name }}"
          [ -n "$name" ] || name="${{ github.event.repository.name }}"
          echo "aab_path=build/android/${name}.aab" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$ROOT" ] || { echo "ANDROID_HOME required." >&2; exit 1; }
          SM="$ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(find "$ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort | tail -n1)"
          [ -x "$SM" ] || { echo "sdkmanager not found." >&2; exit 1; }
          dirname "$SM" >> "$GITHUB_PATH"
          set +o pipefail; yes | "$SM" --licenses >/dev/null; st="${PIPESTATUS[1]}"; set -o pipefail
          [ "$st" -eq 0 ] || exit "$st"
          "$SM" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.1.0" "cmdline-tools;latest"

      - name: Validate and restore upload keystore
        id: keystore
        shell: bash
        env:
          GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" ] || { echo "GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 required." >&2; exit 1; }
          [ -n "$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD" ] || { echo "GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD required." >&2; exit 1; }
          dir="$RUNNER_TEMP/godot-gp-signing"; mkdir -p "$dir"
          path="$dir/upload-key.jks"
          printf '%s' "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # export_presets.cfg는 version authority가 아니라 주입 대상이다. 태그 파생값을 덮어쓰고
      # 실제 반영 여부는 export 이후 AAB manifest readback으로 확인한다.
      - name: Apply release version to the Godot Android export preset
        shell: bash
        env:
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          node .seorilabs-release-authority/scripts/release/apply-godot-export-version.mjs \
            --platform Android \
            --preset "$ANDROID_EXPORT_PRESET" \
            --presets "$PROJECT_DIR/export_presets.cfg"

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$SCRIPTS_DIR/install_godot_ci_dependencies.sh" ] && bash "$SCRIPTS_DIR/install_godot_ci_dependencies.sh" || true
          [ -f scripts/install_godot_ci_dependencies.sh ] && bash scripts/install_godot_ci_dependencies.sh || true
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q godot.zip
          # 셀프호스티드 러너 컨테이너에는 sudo 도 root 권한도 없다. godot-checks.yml 과
          # 같은 방식으로 RUNNER_TEMP 아래 설치하고 GITHUB_PATH 로 후속 step 에 노출한다.
          install_dir="$RUNNER_TEMP/godot-bin"
          mkdir -p "$install_dir"
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" "$install_dir/godot"
          chmod +x "$install_dir/godot"
          echo "$install_dir" >> "$GITHUB_PATH"
          curl -L -o export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -q export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          "$install_dir/godot" --version

      # GA4 Measurement Protocol 설정(<project>/analytics.config.json)을 secret 에서 복원.
      # 미설정 repo 는 경고만 남기고 통과(애널리틱스 비활성 빌드) — 기존 동작 보존.
      - name: Restore GA4 analytics config
        shell: bash
        env:
          GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GODOT_ANALYTICS_CONFIG_JSON_BASE64:-}" ]; then
            echo "::warning::GODOT_ANALYTICS_CONFIG_JSON_BASE64 미설정 — GA4 전송 비활성 빌드."
            exit 0
          fi
          if [ -z "${PROJECT_DIR:-}" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::PROJECT_DIR('${PROJECT_DIR:-}')가 유효한 디렉터리가 아닙니다."
            exit 1
          fi
          dest="$PROJECT_DIR/analytics.config.json"
          tmp="$(mktemp)"
          # 임시파일에 디코드 후 성공 시에만 mv(atomic). GNU=--decode, BSD/macOS=-D.
          # 실패를 묵음 처리하지 않는다(손상 secret 이 조용히 잘못된 config 로 export 되는 것 방지).
          if printf '%s' "$GODOT_ANALYTICS_CONFIG_JSON_BASE64" | base64 --decode > "$tmp" 2>/dev/null; then
            :
          elif printf '%s' "$GODOT_ANALYTICS_CONFIG_JSON_BASE64" | base64 -D > "$tmp" 2>/dev/null; then
            :
          else
            rm -f "$tmp"
            echo "::error::GODOT_ANALYTICS_CONFIG_JSON_BASE64 base64 디코드 실패 — secret 값 확인 필요."
            exit 1
          fi
          if [ ! -s "$tmp" ] || [ "$(head -c1 "$tmp")" != "{" ]; then
            rm -f "$tmp"
            echo "::error::복원된 analytics.config.json 이 비었거나 JSON 형태가 아닙니다."
            exit 1
          fi
          mv "$tmp" "$dest"
          echo "analytics.config.json 복원 완료 → $dest"

      - name: Run caller project preparation
        if: ${{ inputs.prepare_project_script != '' }}
        shell: bash
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          [ -f "$PREPARE_PROJECT_SCRIPT" ] || {
            echo "project preparation script not found: $PREPARE_PROJECT_SCRIPT" >&2
            exit 1
          }
          bash "$PREPARE_PROJECT_SCRIPT"

      - name: Import Godot project
        run: godot --headless --path "$PROJECT_DIR" --import --quit-after 1

      - name: Validate AdMob variables
        if: ${{ vars.ADMOB_APP_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$ADMOB_APP_ID" != "ca-app-pub-3940256099942544~3347511713" ] || { echo "ADMOB_APP_ID는 테스트 ID 사용 금지." >&2; exit 1; }
          [ "${ADMOB_INTERSTITIAL_AD_UNIT_ID:-}" != "ca-app-pub-3940256099942544/1033173712" ] || { echo "ADMOB_INTERSTITIAL_AD_UNIT_ID는 테스트 ID 사용 금지." >&2; exit 1; }

      - name: Install Android build template
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$SCRIPTS_DIR/install_android_build_template.sh" ] && bash "$SCRIPTS_DIR/install_android_build_template.sh" || echo "no install_android_build_template.sh; skipping"

      - name: Build AdMob plugin
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$SCRIPTS_DIR/build_admob_plugin.sh" ] && bash "$SCRIPTS_DIR/build_admob_plugin.sh" || echo "no build_admob_plugin.sh; skipping"

      - name: Export signed Android AAB
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.keystore.outputs.path }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
          AAB_PATH: ${{ steps.meta.outputs.aab_path }}
        run: |
          set -euo pipefail
          alias="$(keytool -list -v -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass "$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD" | awk -F': ' '/^Alias name: /{print $2; exit}')"
          [ -n "$alias" ] || { echo "upload key alias 탐지 실패." >&2; exit 1; }
          key_password="$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD"
          if [ -n "${GOOGLE_PLAY_UPLOAD_KEY_ALIAS:-}" ] && [ "$alias" = "$GOOGLE_PLAY_UPLOAD_KEY_ALIAS" ] && [ -n "${GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:-}" ]; then
            key_password="$GOOGLE_PLAY_UPLOAD_KEY_PASSWORD"
          fi
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$alias"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD"
          export GODOT_ANDROID_KEYSTORE_RELEASE_KEY_PASSWORD="$key_password"
          mkdir -p "$(dirname "$AAB_PATH")"
          godot --headless --path "$PROJECT_DIR" --export-release "$ANDROID_EXPORT_PRESET" "$AAB_PATH"

      # Godot이 preset 값을 무시하거나 오래된 build template이 남아 있으면 여기서 fail-closed한다.
      - name: Verify AAB version against the release tag
        id: provenance
        shell: bash
        env:
          AAB_PATH: ${{ steps.meta.outputs.aab_path }}
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          # AAB의 base/manifest/AndroidManifest.xml은 aapt.pb.XmlNode 바이너리다.
          # aapt2 dump는 AAB를 인식하지 못하므로 zip에서 직접 꺼내 org 정본 parser로 읽는다.
          unzip -p "$AAB_PATH" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/aab-manifest.pb"
          [ -s "$RUNNER_TEMP/aab-manifest.pb" ] || { echo "AAB에서 AndroidManifest.xml을 꺼내지 못함." >&2; exit 1; }
          node .seorilabs-release-authority/scripts/release/verify-release-artifact.mjs \
            --kind android-app-bundle \
            --artifact "$AAB_PATH" \
            --metadata "$RUNNER_TEMP/aab-manifest.pb" \
            --receipt "$RUNNER_TEMP/release-artifact-receipt.txt" \
            --github-output

      # 업로드 스텝은 검증한 그 파일만 올려야 한다. caller 스크립트가 glob으로 다른 .aab를
      # 고르지 못하도록, workspace에 검증된 AAB 하나만 있는지와 digest가 그대로인지 확인한다.
      - name: Bind the verified AAB as the only upload candidate
        if: ${{ inputs.upload }}
        shell: bash
        env:
          VERIFIED_AAB_PATH: ${{ steps.provenance.outputs.artifact_path }}
          VERIFIED_AAB_DIGEST: ${{ steps.provenance.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [ -f "$VERIFIED_AAB_PATH" ] || { echo "검증된 AAB 경로가 없다: $VERIFIED_AAB_PATH" >&2; exit 1; }
          observed="$(sha256sum "$VERIFIED_AAB_PATH" | cut -d ' ' -f 1)"
          [ "$observed" = "$VERIFIED_AAB_DIGEST" ] || {
            echo "업로드 직전 AAB digest가 검증값과 다르다: $observed != $VERIFIED_AAB_DIGEST" >&2
            exit 1
          }
          # 검증된 파일 옆에 다른 .aab가 있으면 업로드 도구가 그쪽을 고를 수 있다.
          bundles="$(find "$(dirname "$VERIFIED_AAB_PATH")" -maxdepth 1 -type f -name '*.aab' | wc -l | tr -d ' ')"
          [ "$bundles" = 1 ] || {
            echo "검증된 AAB 디렉터리에 .aab가 정확히 하나여야 한다: $bundles" >&2
            exit 1
          }

      - name: Run caller post-export validation
        if: ${{ inputs.post_export_validation_script != '' }}
        shell: bash
        env:
          AAB_PATH: ${{ steps.meta.outputs.aab_path }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.android_version_code }}
        run: |
          set -euo pipefail
          [ -f "$POST_EXPORT_VALIDATION_SCRIPT" ] || {
            echo "post-export validation script not found: $POST_EXPORT_VALIDATION_SCRIPT" >&2
            exit 1
          }
          bash "$POST_EXPORT_VALIDATION_SCRIPT"

      - name: Validate Google Play readiness
        if: ${{ hashFiles(format('{0}/check_google_play_readiness.py', inputs.scripts_dir)) != '' }}
        run: python3 "$SCRIPTS_DIR/check_google_play_readiness.py"

      - name: Upload AAB artifact
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-google-play-aab-${{ steps.release.outputs.version_name }}-${{ steps.release.outputs.android_version_code }}
          path: ${{ steps.meta.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 3

      - name: Validate Google Play WIF config
        if: ${{ inputs.upload }}
        shell: bash
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          [ -n "$GOOGLE_WORKLOAD_IDENTITY_PROVIDER" ] || { echo "GOOGLE_WORKLOAD_IDENTITY_PROVIDER var required." >&2; exit 1; }
          [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL" ] || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL var required." >&2; exit 1; }

      - name: Authenticate to Google Cloud
        if: ${{ inputs.upload }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Install Google Play API client
        if: ${{ inputs.upload }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-api-python-client google-auth google-auth-httplib2 httplib2

      # Backoffice 가 Release 에 첨부한 정형 출시노트(release-notes.json)를 받아 Play 트랙에 반영.
      # 에셋이 없으면 found=false → 업로드 스크립트가 config 기본값으로 폴백(기존 동작 유지).
      - name: Resolve store release notes
        id: notes
        if: ${{ inputs.upload }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 출시노트도 해석된 exact 릴리즈 태그에서만 가져온다(호출 ref 폴백 없음).
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          out="$RUNNER_TEMP/release-notes.json"
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern release-notes.json --output "$out" --clobber 2>/dev/null \
            && [ "$(jq -r '(.notes // {}) | length' "$out")" -gt 0 ]; then
            {
              echo "found=true"
              echo "path=$out"
            } >> "$GITHUB_OUTPUT"
            echo "release-notes.json 로드: $(jq -r '.notes | keys_unsorted | join(", ")' "$out")"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "release-notes.json 없음/비어있음 → config 기본값 사용" >&2
          fi

      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        shell: bash
        env:
          # 언어별 노트(전체 언어)는 env 파일 경로로 전달. 스크립트가 등록 언어와 교집합만 반영.
          # env 로 넘겨야 --release-notes-json 미지원(구버전) 스크립트도 깨지지 않고 무시한다.
          RELEASE_NOTES_JSON: ${{ steps.notes.outputs.found == 'true' && steps.notes.outputs.path || '' }}
          # 업로드 대상은 검증된 exact 경로 하나다. 스크립트가 자체 탐색으로 다른 파일을 고르지 않는다.
          VERIFIED_AAB_PATH: ${{ steps.provenance.outputs.artifact_path }}
          SEORI_EXPECTED_AAB_SHA256: ${{ steps.provenance.outputs.artifact_digest }}
          VERIFIED_PACKAGE_NAME: ${{ steps.provenance.outputs.package_name }}
          EXPECTED_PACKAGE_NAME: ${{ inputs.package_name }}
          # uploader는 태그 파생 versionCode를 필수로 요구한다. 트랙 최신값을 쓰지 않게 한다.
          SEORI_EXPECTED_ANDROID_VERSION_CODE: ${{ steps.release.outputs.android_version_code }}
          RELEASE_NAME: ${{ github.event.repository.name }} ${{ steps.release.outputs.version_name }} (${{ steps.release.outputs.android_version_code }})
          RELEASE_STATUS: ${{ inputs.release_status }}
          RELEASE_TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          # post-export 검증과 readiness 검사 이후에도 파일이 바뀌지 않았는지 업로드 직전에 다시 본다.
          [ -f "$VERIFIED_AAB_PATH" ] || { echo "검증된 AAB 경로가 없다: $VERIFIED_AAB_PATH" >&2; exit 1; }
          observed="$(sha256sum "$VERIFIED_AAB_PATH" | cut -d ' ' -f 1)"
          [ "$observed" = "$SEORI_EXPECTED_AAB_SHA256" ] || {
            echo "업로드 직전 AAB digest가 검증값과 다르다: $observed != $SEORI_EXPECTED_AAB_SHA256" >&2
            exit 1
          }
          [[ "$SEORI_EXPECTED_ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "태그 파생 versionCode가 없다: ${SEORI_EXPECTED_ANDROID_VERSION_CODE:-missing}" >&2
            exit 1
          }
          [ -n "$EXPECTED_PACKAGE_NAME" ] || {
            echo "Backoffice package_name binding이 없다." >&2
            exit 1
          }
          [ "$VERIFIED_PACKAGE_NAME" = "$EXPECTED_PACKAGE_NAME" ] || {
            echo "AAB package identity가 Backoffice binding과 다르다." >&2
            exit 1
          }
          args=(
            --package-name "$VERIFIED_PACKAGE_NAME"
            --aab-path "$VERIFIED_AAB_PATH"
            --expected-aab-sha256 "$SEORI_EXPECTED_AAB_SHA256"
            --expected-version-code "$SEORI_EXPECTED_ANDROID_VERSION_CODE"
            --track "$RELEASE_TRACK"
            --release-status "$RELEASE_STATUS"
            --release-name "$RELEASE_NAME"
          )
          [ -n "$RELEASE_NOTES_JSON" ] && args+=(--release-notes-json "$RELEASE_NOTES_JSON")
          python3 .seorilabs-release-authority/scripts/release/upload-google-play-aab.py "${args[@]}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Godot Deploy Google Play"; echo ""
            echo "- tag: ${{ steps.tag.outputs.tag }} @ ${{ steps.tag.outputs.sha }}"
            echo "- version: ${{ steps.release.outputs.version_name }} (${{ steps.release.outputs.android_version_code }})"
            echo "- config revision: ${{ steps.release.outputs.config_revision }}"
            echo "- artifact: ${{ steps.provenance.outputs.artifact_path }} sha256:${{ steps.provenance.outputs.artifact_digest }}"
            echo "- track: ${{ inputs.track }} / status: ${{ inputs.release_status }} / uploaded: ${{ inputs.upload }}"
          } >> "$GITHUB_STEP_SUMMARY"
