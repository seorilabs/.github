# Fleet cleanup wave의 caller다. 같은 commit의 local reusable executor를 호출해
# workflow_sha와 job_workflow_sha가 정확히 같은 값으로 묶이게 한다. capability는 Backoffice
# admin이 미리 ISSUE한 공개 ID이며 이 workflow는 그것을 만들지 않는다.
name: Fleet Cleanup Reconciler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: PLAN_ONLY는 실행 경계를 호출하지 않는다.
        required: true
        default: PLAN_ONLY
        type: choice
        options:
          - PLAN_ONLY
          - PREPARE_AND_EXECUTE
      capability_id:
        description: Backoffice admin이 사전 ISSUE한 공개 capability ID. EXECUTE에만 필요하다.
        required: false
        default: ""
        type: string
      approval_scope_digest:
        description: 해당 capability의 공개 approval scope sha256 digest
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # 한 capability는 한 번만 EXECUTE한다. 진행 중인 실행을 취소하지 않는다.
  group: fleet-cleanup-reconciler-${{ github.repository_id }}-${{ inputs.capability_id }}
  cancel-in-progress: false

jobs:
  execute:
    name: Fleet Cleanup Reconciler
    uses: ./.github/workflows/fleet-cleanup-executor-v1.yml
    permissions:
      contents: read
      id-token: write
    with:
      mode: ${{ inputs.mode }}
      capability_id: ${{ inputs.capability_id }}
      approval_scope_digest: ${{ inputs.approval_scope_digest }}
