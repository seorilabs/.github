# Seorilabs org 재사용 워크플로우: GitHub Actions 스토리지 정리
# 호출: uses: seorilabs/.github/.github/workflows/cleanup-actions-storage.yml@<FULL_COMMIT_SHA>
# 아티팩트/캐시를 정리해 Actions 스토리지 쿼터를 비운다. 각 repo는 얇은 caller에서
# workflow_dispatch(또는 cron)로 이 워크플로우를 호출한다.
name: Cleanup Actions Storage (reusable)

on:
  workflow_call:
    inputs:
      delete_artifacts:
        description: "Workflow artifacts 삭제"
        required: false
        default: true
        type: boolean
      delete_caches:
        description: "Actions caches 삭제"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "삭제하지 않고 대상/용량만 출력"
        required: false
        default: false
        type: boolean
      runs_on:
        description: "실행 러너. seorilabs-rpi-arm64 또는 ubuntu-latest만 허용한다."
        required: false
        default: "seorilabs-rpi-arm64"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete artifacts and caches
    runs-on: ${{ (inputs.runs_on == 'ubuntu-latest' && 'ubuntu-latest') || 'seorilabs-rpi-arm64' }}
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DELETE_ARTIFACTS: ${{ inputs.delete_artifacts }}
      DELETE_CACHES: ${{ inputs.delete_caches }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      # 권한 있는 job의 러너는 caller 입력을 그대로 믿지 않는다. 승인된 라벨만 허용하고,
      # 그 밖의 값은 요청 자체를 실패시킨다(runs-on은 이미 승인 목록으로 축약돼 있다).
      - name: Reject unapproved runner routing
        shell: bash
        env:
          REQUESTED_RUNNER: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          case "$REQUESTED_RUNNER" in
            "seorilabs-rpi-arm64" | "ubuntu-latest") ;;
            *) echo "승인되지 않은 러너 라벨: $REQUESTED_RUNNER" >&2; exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false

      # 삭제 권한이 있는 job이 실행할 코드는 exact SHA로 받는다. called workflow identity로
      # 중앙 저장소와 SHA를 확인하고, 그 SHA만 체크아웃한다.
      - name: Validate called reusable workflow identity
        id: authority
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          EXPECTED_WORKFLOW_PATH: seorilabs/.github/.github/workflows/cleanup-actions-storage.yml
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const expected = process.env.EXPECTED_WORKFLOW_PATH + "@" + identity.workflow_sha;
            if (identity.workflow_repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(identity.workflow_sha ?? "") || identity.workflow_ref !== expected) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + identity.workflow_repository, "sha=" + identity.workflow_sha].join("\n") + "\n");
          '

      - name: Checkout exact cleanup scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.authority.outputs.repository }}
          ref: ${{ steps.authority.outputs.sha }}
          path: .seorilabs-actions-storage
          persist-credentials: false

      - name: Delete workflow artifacts
        if: env.DELETE_ARTIFACTS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # gh CLI는 ARC 러너 이미지에 없다. 목록·삭제 모두 REST로 한다.
          node .seorilabs-actions-storage/scripts/cleanup-actions-storage.mjs --kind artifacts

      - name: Delete Actions caches
        if: env.DELETE_CACHES == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .seorilabs-actions-storage/scripts/cleanup-actions-storage.mjs --kind caches
