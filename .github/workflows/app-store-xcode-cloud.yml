# App Store(iOS) 배포의 조직 표준 경로.
#
# Apple archive·upload은 Xcode Cloud에서만 실행한다. GitHub Actions macOS 러너로 archive하지
# 않는다(서명 경계와 Actions 분량). 이 워크플로는 태그를 Xcode Cloud 빌드 실행으로 넘기는
# 일만 한다. 빌드 자체는 Xcode Cloud가 저장소에서 직접 가져가 수행한다.
#
# 앱 저장소는 이 파일을 부르는 얇은 caller 하나만 둔다. 트리거 스크립트를 저장소마다
# 복제하지 않는다.
name: App Store (Xcode Cloud)

on:
  workflow_call:
    inputs:
      release_tag:
        description: "빌드할 stable SemVer 태그(vX.Y.Z). 비우면 현재 ref 이름을 쓴다."
        type: string
        required: false
        default: ""
      bundle_id:
        description: "iOS bundle id. 비우면 저장소의 app_config_path에서 읽는다."
        type: string
        required: false
        default: ""
      app_config_path:
        description: "bundle id를 담은 저장소 설정 파일 경로."
        type: string
        required: false
        default: "app-store/app-store.config.json"
      xcode_cloud_workflow:
        description: "Xcode Cloud workflow 이름. 비우면 활성 workflow 중 첫 번째."
        type: string
        required: false
        default: ""
      environment:
        description: "GitHub 배포 환경 이름."
        type: string
        required: false
        default: "app-store"
      start:
        description: "false면 제품·workflow·태그 해석까지만 하고 빌드를 시작하지 않는다."
        type: boolean
        required: false
        default: true
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64:
        required: true
    outputs:
      build_run_id:
        description: "Xcode Cloud ciBuildRun id"
        value: ${{ jobs.trigger.outputs.build_run_id }}
      build_number:
        description: "Xcode Cloud 빌드 번호"
        value: ${{ jobs.trigger.outputs.build_number }}

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger Xcode Cloud
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    outputs:
      build_run_id: ${{ steps.dispatch.outputs.xcode_cloud_build_run_id }}
      build_number: ${{ steps.dispatch.outputs.xcode_cloud_build_number }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          check-latest: false

      - name: Resolve called workflow identity
        id: workflow-identity
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const repository = identity.workflow_repository;
            const sha = identity.workflow_sha;
            const ref = identity.workflow_ref;
            const expectedRef = "seorilabs/.github/.github/workflows/app-store-xcode-cloud.yml@" + sha;
            if (repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(sha ?? "") || ref !== expectedRef) {
              process.stderr.write("중앙 reusable workflow identity를 검증할 수 없습니다.\n");
              process.exit(1);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + repository, "sha=" + sha].join("\n") + "\n");
          '

      # 트리거 스크립트는 이 워크플로와 같은 커밋에서 가져온다. caller가 pin한 ref가
      # 곧 스크립트 판본이라 둘이 어긋날 수 없다.
      - name: Checkout org scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.workflow-identity.outputs.repository }}
          ref: ${{ steps.workflow-identity.outputs.sha }}
          path: .org
          persist-credentials: false

      # 앱 신원은 저장소의 설정 파일 한 곳에만 둔다. 워크플로에 bundle id를 다시 박으면
      # 같은 값이 두 곳이 되고, 한쪽만 바뀌었을 때 어느 쪽이 맞는지 알 수 없게 된다.
      - name: Checkout app config
        if: ${{ inputs.bundle_id == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .app
          fetch-depth: 1
          sparse-checkout: ${{ inputs.app_config_path }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve bundle id
        id: identity
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          CONFIG_PATH: ${{ inputs.app_config_path }}
        run: |
          set -euo pipefail
          if [ -n "$BUNDLE_ID" ]; then
            echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          resolved="$(node .org/scripts/read-app-bundle-id.mjs ".app/$CONFIG_PATH")"
          echo "bundle_id=$resolved" >> "$GITHUB_OUTPUT"

      - name: Trigger Xcode Cloud build
        id: dispatch
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          BUNDLE_ID: ${{ steps.identity.outputs.bundle_id }}
          XCODE_CLOUD_WORKFLOW: ${{ inputs.xcode_cloud_workflow }}
          START: ${{ inputs.start }}
        run: |
          set -euo pipefail
          args=(--tag "$RELEASE_TAG" --bundle-id "$BUNDLE_ID" --start "$START")
          if [ -n "$XCODE_CLOUD_WORKFLOW" ]; then
            args+=(--workflow-name "$XCODE_CLOUD_WORKFLOW")
          fi
          node .org/scripts/trigger-xcode-cloud.mjs "${args[@]}"

      - name: Summary
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          BUILD_NUMBER: ${{ steps.dispatch.outputs.xcode_cloud_build_number }}
          BUILD_RUN_ID: ${{ steps.dispatch.outputs.xcode_cloud_build_run_id }}
        run: |
          {
            echo "### Xcode Cloud"
            echo ""
            echo "- tag: ${RELEASE_TAG}"
            echo "- build: ${BUILD_NUMBER:-pending}"
            echo "- run id: ${BUILD_RUN_ID:-(시작 안 함)}"
          } >> "$GITHUB_STEP_SUMMARY"
