# Seorilabs org reusable workflow: signed RN Android AAB artifact only.
# No Google Play environment, WIF permission, API authentication, or market upload.
name: RN Build Android (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        description: "빌드할 릴리스 태그. 비우면 최신 vX.Y.Z."
        required: false
        default: ""
        type: string
      package_manager:
        description: "npm | pnpm"
        required: false
        default: "npm"
        type: string
      pnpm_version:
        required: false
        default: "11.3.0"
        type: string
      node_version:
        required: false
        default: "24"
        type: string
      java_version:
        description: "Android Gradle 빌드 JDK major"
        required: false
        default: "17"
        type: string
      android_dir:
        description: "Android Gradle 프로젝트 경로. 비우면 자동 탐지."
        required: false
        default: ""
        type: string
      react_native_architectures:
        description: "쉼표로 구분한 React Native Android ABI 목록. 비우면 프로젝트 기본값."
        required: false
        default: ""
        type: string
      signing_properties_file:
        description: "Android 프로젝트 기준 signing properties 파일명."
        required: false
        default: "key.properties"
        type: string
      firebase_restore_script:
        required: false
        default: "scripts/restore-mobile-firebase-config.mjs"
        type: string
      prepare_script:
        description: "Gradle 빌드 전에 실행할 Node 준비 스크립트."
        required: false
        default: ""
        type: string
      timeout_minutes:
        required: false
        default: 35
        type: number
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: true
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: true
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build-aab:
    name: Signed Android App Bundle artifact
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    env:
      PM: ${{ inputs.package_manager }}
      REACT_NATIVE_ARCHITECTURES: ${{ inputs.react_native_architectures }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          check-latest: false

      - name: Enable pnpm
        if: inputs.package_manager == 'pnpm'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@${{ inputs.pnpm_version }} --activate

      # 버전 authority 구현은 org 정본에만 둔다. caller 저장소 스크립트를 신뢰하지 않기 위해
      # called workflow identity를 확인하고 그 exact commit SHA로 정본을 받아 실행한다.
      - name: Validate called reusable workflow identity
        id: authority
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          EXPECTED_WORKFLOW_PATH: seorilabs/.github/.github/workflows/rn-build-android.yml
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const expected = process.env.EXPECTED_WORKFLOW_PATH + "@" + identity.workflow_sha;
            if (identity.workflow_repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(identity.workflow_sha ?? "") || identity.workflow_ref !== expected) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + identity.workflow_repository, "sha=" + identity.workflow_sha, "ref=" + identity.workflow_ref].join("\n") + "\n");
          '

      - name: Checkout exact release version authority
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.authority.outputs.repository }}
          ref: ${{ steps.authority.outputs.sha }}
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Resolve exact release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git tag --list > "$RUNNER_TEMP/git-tags.txt"
          tag="$(node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --tag-list-file "$RUNNER_TEMP/git-tags.txt" --print-tag)"
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          git -c advice.detachedHead=false checkout "refs/tags/$tag"
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          [ "$tag_commit" = "$head_commit" ] || {
            echo "checkout HEAD가 exact tag commit과 다름: tag=$tag_commit HEAD=$head_commit" >&2
            exit 1
          }
          { echo "tag=$tag"; echo "sha=$tag_commit"; } >> "$GITHUB_OUTPUT"

      - name: Bind release version to the tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ steps.tag.outputs.sha }}
          JOB_WORKFLOW_REPOSITORY: ${{ steps.authority.outputs.repository }}
          JOB_WORKFLOW_REF: ${{ steps.authority.outputs.ref }}
          JOB_WORKFLOW_SHA: ${{ steps.authority.outputs.sha }}
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-tag-message.txt"
            export RELEASE_TAG_MESSAGE_FILE="$RUNNER_TEMP/release-tag-message.txt"
          fi
          RELEASE_HEAD_SHA="$(git rev-parse 'HEAD^{commit}')" \
          RELEASE_LOCAL_TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" \
            node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --github-output

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
            [ -f apps/mobile/package-lock.json ] && npm ci --prefix apps/mobile || true
          fi

      - name: Prepare native project
        if: inputs.prepare_script != ''
        shell: bash
        env:
          PREPARE_SCRIPT: ${{ inputs.prepare_script }}
          RELEASE_VERSION: ${{ steps.release.outputs.version_name }}
        run: node "$PREPARE_SCRIPT" --android

      - name: Restore Android Firebase config
        shell: bash
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_RESTORE_SCRIPT: ${{ inputs.firebase_restore_script }}
        run: |
          set -euo pipefail
          if [ -f "$FIREBASE_RESTORE_SCRIPT" ]; then
            node "$FIREBASE_RESTORE_SCRIPT" --android --require
          elif [ -n "${FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            mkdir -p apps/mobile/android/app
            printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/mobile/android/app/google-services.json
          else
            echo "No Firebase restore script and no FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64." >&2
            exit 1
          fi

      - name: Resolve Android project
        id: android
        shell: bash
        env:
          ANDROID_DIR_INPUT: ${{ inputs.android_dir }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_DIR_INPUT" ]; then
            android_dir="$ANDROID_DIR_INPUT"
          elif [ -x apps/mobile/android/gradlew ]; then
            android_dir="apps/mobile/android"
          elif [ -x android/gradlew ]; then
            android_dir="android"
          else
            echo "Android Gradle project를 찾지 못함." >&2
            exit 1
          fi
          aab_path="$android_dir/app/build/outputs/bundle/release/app-release.aab"
          { echo "android_dir=$android_dir"; echo "aab_path=$aab_path"; } >> "$GITHUB_OUTPUT"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sm" ] || { echo "sdkmanager not found at $sm" >&2; exit 1; }
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes 2>/dev/null | "$sm" --licenses >/dev/null
          status="${PIPESTATUS[1]}"
          set -o pipefail
          [ "$status" -eq 0 ] || exit "$status"
          "$sm" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Restore upload keystore
        shell: bash
        env:
          GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
          ANDROID_DIR: ${{ steps.android.outputs.android_dir }}
          SIGNING_PROPERTIES_FILE: ${{ inputs.signing_properties_file }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/android-build-signing"
          keystore_path="$signing_dir/upload-key.jks"
          key_alias="${GOOGLE_PLAY_UPLOAD_KEY_ALIAS:-upload}"
          key_password="${GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:-$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD}"
          mkdir -p "$signing_dir"
          printf '%s' "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          properties_path="$ANDROID_DIR/$SIGNING_PROPERTIES_FILE"
          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$key_alias"
            printf 'keyPassword=%s\n' "$key_password"
          } > "$properties_path"
          chmod 600 "$properties_path"

      - name: Build signed Android AAB
        working-directory: ${{ steps.android.outputs.android_dir }}
        env:
          APP_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.release.outputs.android_version_code }}
        run: |
          set -euo pipefail
          gradle_args=(
            --no-daemon
            "-PversionNameOverride=$APP_VERSION_NAME"
            "-PversionCodeOverride=$APP_VERSION_CODE"
          )
          if [ -n "$REACT_NATIVE_ARCHITECTURES" ]; then
            gradle_args+=("-PreactNativeArchitectures=$REACT_NATIVE_ARCHITECTURES")
          fi
          ./gradlew :app:bundleRelease "${gradle_args[@]}"

      # Gradle이 override를 무시하거나 프로젝트 값이 남아 있으면 여기서 fail-closed한다.
      - name: Verify AAB version against the release tag
        id: provenance
        shell: bash
        env:
          AAB_PATH: ${{ steps.android.outputs.aab_path }}
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          # AAB의 base/manifest/AndroidManifest.xml은 aapt.pb.XmlNode 바이너리다.
          # aapt2 dump는 AAB를 인식하지 못하므로 zip에서 직접 꺼내 org 정본 parser로 읽는다.
          unzip -p "$AAB_PATH" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/aab-manifest.pb"
          [ -s "$RUNNER_TEMP/aab-manifest.pb" ] || { echo "AAB에서 AndroidManifest.xml을 꺼내지 못함." >&2; exit 1; }
          node .seorilabs-release-authority/scripts/release/verify-release-artifact.mjs \
            --kind android-app-bundle \
            --artifact "$AAB_PATH" \
            --metadata "$RUNNER_TEMP/aab-manifest.pb" \
            --github-output

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ steps.tag.outputs.tag }}-${{ steps.release.outputs.android_version_code }}
          path: ${{ steps.android.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 3

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Build Android candidate"; echo ""
            echo "- tag: ${{ steps.tag.outputs.tag }} @ ${{ steps.tag.outputs.sha }}"
            echo "- version: ${{ steps.release.outputs.version_name }} (${{ steps.release.outputs.android_version_code }})"
            echo "- artifact: signed AAB ${{ steps.provenance.outputs.artifact_digest }}"
            echo "- React Native architectures: ${REACT_NATIVE_ARCHITECTURES:-project default}"
            echo "- market upload: false"
          } >> "$GITHUB_STEP_SUMMARY"
