# Seorilabs org 재사용 워크플로우: Godot 게임 AIT(.ait) 빌드 + AppsInToss 배포
# 호출: uses: seorilabs/.github/.github/workflows/godot-deploy-ait.yml@<FULL_COMMIT_SHA>
# 러너: seorilabs-rpi-arm64 (ARC). Godot Web export → wrapper build → ait deploy.
# 인증: org secret APPS_IN_TOSS_API_KEY.
# 버전 정본: GitHub 릴리즈 태그 vX.Y.Z 하나뿐이다(contracts/release-version-authority.yaml).
# project.godot/wrapper package.json은 authority가 아니다. .ait 컨테이너는 version 필드를 갖지
# 않으므로 배포 식별자는 태그 파생 canonical memo와 artifact digest로 고정한다.
name: Godot Deploy AIT (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그 vX.Y.Z. 비우면 저장소의 최신 stable 태그."
        required: false
        default: ""
        type: string
      memo:
        description: "canonical memo 뒤에 붙일 운영 메모(선택)"
        required: false
        default: ""
        type: string
      godot_version:
        required: false
        default: "4.6.3"
        type: string
      godot_status:
        required: false
        default: "stable"
        type: string
      project_dir:
        description: "Godot 프로젝트 경로"
        required: false
        default: "."
        type: string
      wrapper_dir:
        description: "AIT 웹 래퍼 디렉터리"
        required: false
        default: "ait/apps-in-toss-web"
        type: string
      web_output_dir:
        description: "Godot web export 출력 경로"
        required: false
        default: "build/web"
        type: string
      smoke_command:
        description: "export 전 실행할 smoke 명령(여러 줄, 선택)"
        required: false
        default: ""
        type: string
      node_version:
        required: false
        default: "24"
        type: string
      timeout_minutes:
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  deploy:
    name: Godot web export and AIT deploy
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: apps-in-toss

    env:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      GODOT_VERSION: ${{ inputs.godot_version }}
      GODOT_STATUS: ${{ inputs.godot_status }}
      PROJECT_DIR: ${{ inputs.project_dir }}
      WRAPPER_DIR: ${{ inputs.wrapper_dir }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.FIREBASE_API_KEY || '' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN || '' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || '' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || '' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_GCM_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID || '' }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || vars.FIREBASE_APP_ID || '' }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || '' }}
      VITE_TOSS_INTERSTITIAL_AD_GROUP_ID: ${{ secrets.VITE_TOSS_INTERSTITIAL_AD_GROUP_ID || secrets.VITE_TOSS_FULLSCREEN_AD_GROUP_ID || '' }}
      VITE_TOSS_REWARDED_AD_GROUP_ID: ${{ secrets.VITE_TOSS_REWARDED_AD_GROUP_ID || '' }}
      VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID: ${{ secrets.VITE_TOSS_LEVEL_REWARD_AD_GROUP_ID || '' }}
      VITE_GA4_MP_API_SECRET: ${{ secrets.VITE_GA4_MP_API_SECRET || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate AppsInToss secret
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$APPS_IN_TOSS_API_KEY" ] || { echo "APPS_IN_TOSS_API_KEY secret is required." >&2; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.wrapper_dir }}/package-lock.json

      # 버전 authority 구현은 org 정본에만 둔다. caller 저장소 스크립트를 신뢰하지 않기 위해
      # called workflow identity를 확인하고 그 exact commit SHA로 정본을 받아 실행한다.
      - name: Validate called reusable workflow identity
        id: authority
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          EXPECTED_WORKFLOW_PATH: seorilabs/.github/.github/workflows/godot-deploy-ait.yml
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const expected = process.env.EXPECTED_WORKFLOW_PATH + "@" + identity.workflow_sha;
            if (identity.workflow_repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(identity.workflow_sha ?? "") || identity.workflow_ref !== expected) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + identity.workflow_repository, "sha=" + identity.workflow_sha, "ref=" + identity.workflow_ref].join("\n") + "\n");
          '

      - name: Checkout exact release version authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.authority.outputs.repository }}
          ref: ${{ steps.authority.outputs.sha }}
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Resolve exact release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git tag --list > "$RUNNER_TEMP/git-tags.txt"
          tag="$(node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --tag-list-file "$RUNNER_TEMP/git-tags.txt" --print-tag)"
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          git -c advice.detachedHead=false checkout "refs/tags/$tag"
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          [ "$tag_commit" = "$head_commit" ] || {
            echo "checkout HEAD가 exact tag commit과 다름: tag=$tag_commit HEAD=$head_commit" >&2
            exit 1
          }
          { echo "tag=$tag"; echo "sha=$tag_commit"; } >> "$GITHUB_OUTPUT"

      - name: Bind release version to the tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ steps.tag.outputs.sha }}
          JOB_WORKFLOW_REPOSITORY: ${{ steps.authority.outputs.repository }}
          JOB_WORKFLOW_REF: ${{ steps.authority.outputs.ref }}
          JOB_WORKFLOW_SHA: ${{ steps.authority.outputs.sha }}
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-tag-message.txt"
            export RELEASE_TAG_MESSAGE_FILE="$RUNNER_TEMP/release-tag-message.txt"
          fi
          RELEASE_HEAD_SHA="$(git rev-parse 'HEAD^{commit}')" \
          RELEASE_LOCAL_TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" \
            node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --github-output

      - name: Ensure fontconfig runtime
        shell: bash
        run: |
          set -euo pipefail
          if ldconfig -p 2>/dev/null | grep -q "libfontconfig.so.1"; then exit 0; fi
          command -v apt-get >/dev/null 2>&1 || { echo "apt-get unavailable; continuing" >&2; exit 0; }
          sudo_cmd=""; command -v sudo >/dev/null 2>&1 && sudo_cmd="sudo"
          ${sudo_cmd} apt-get update && ${sudo_cmd} apt-get install -y libfontconfig1 fontconfig

      - name: Cache Godot editor and templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cache/godot/${{ inputs.godot_version }}-${{ inputs.godot_status }}/${{ runner.arch }}
            ~/.local/share/godot/export_templates/${{ inputs.godot_version }}.${{ inputs.godot_status }}
          key: godot-web-${{ runner.os }}-${{ runner.arch }}-${{ inputs.godot_version }}-${{ inputs.godot_status }}

      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH:-}" in
            X64) arch="x86_64" ;;
            ARM64) arch="arm64" ;;
            ARM) arch="arm32" ;;
            *) echo "Unsupported arch: ${RUNNER_ARCH:-unknown}" >&2; exit 1 ;;
          esac
          bin="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.${arch}"
          install_dir="$GITHUB_WORKSPACE/.cache/godot/${GODOT_VERSION}-${GODOT_STATUS}/${RUNNER_ARCH:-unknown}"
          mkdir -p "$install_dir"
          if [ ! -x "$install_dir/godot" ]; then
            curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${bin}.zip"
            unzip -q godot.zip
            mv "$bin" "$install_dir/godot"
            chmod +x "$install_dir/godot"
          fi
          echo "$install_dir" >> "$GITHUB_PATH"

          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          if [ ! -f "$tdir/web_release.zip" ] && [ ! -f "$tdir/web_dlink_nothreads_release.zip" ]; then
            curl -L -o export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
            unzip -q export_templates.tpz
            mkdir -p "$tdir"
            mv templates/* "$tdir/"
          fi
          "$install_dir/godot" --version

      # GA4 Measurement Protocol 설정(<project>/analytics.config.json)을 secret 에서 복원.
      # 미설정 repo 는 경고만 남기고 통과(애널리틱스 비활성 빌드) — 기존 동작 보존.
      - name: Restore GA4 analytics config
        shell: bash
        env:
          GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GODOT_ANALYTICS_CONFIG_JSON_BASE64:-}" ]; then
            echo "::warning::GODOT_ANALYTICS_CONFIG_JSON_BASE64 미설정 — GA4 전송 비활성 빌드."
            exit 0
          fi
          if [ -z "${PROJECT_DIR:-}" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::PROJECT_DIR('${PROJECT_DIR:-}')가 유효한 디렉터리가 아닙니다."
            exit 1
          fi
          dest="$PROJECT_DIR/analytics.config.json"
          tmp="$(mktemp)"
          # 임시파일에 디코드 후 성공 시에만 mv(atomic). GNU=--decode, BSD/macOS=-D.
          # 실패를 묵음 처리하지 않는다(손상 secret 이 조용히 잘못된 config 로 export 되는 것 방지).
          if printf '%s' "$GODOT_ANALYTICS_CONFIG_JSON_BASE64" | base64 --decode > "$tmp" 2>/dev/null; then
            :
          elif printf '%s' "$GODOT_ANALYTICS_CONFIG_JSON_BASE64" | base64 -D > "$tmp" 2>/dev/null; then
            :
          else
            rm -f "$tmp"
            echo "::error::GODOT_ANALYTICS_CONFIG_JSON_BASE64 base64 디코드 실패 — secret 값 확인 필요."
            exit 1
          fi
          if [ ! -s "$tmp" ] || [ "$(head -c1 "$tmp")" != "{" ]; then
            rm -f "$tmp"
            echo "::error::복원된 analytics.config.json 이 비었거나 JSON 형태가 아닙니다."
            exit 1
          fi
          mv "$tmp" "$dest"
          echo "analytics.config.json 복원 완료 → $dest"

      - name: Import Godot project
        shell: bash
        run: godot --headless --path "$PROJECT_DIR" --import --quit-after 1

      # smoke: godot-checks와 동일한 custom/default 분리(eval 미사용).
      - name: Run smoke tests (custom)
        if: inputs.smoke_command != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.smoke_command }}

      - name: Run smoke tests (default)
        if: inputs.smoke_command == ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/run_godot_smokes.sh ]; then
            bash scripts/run_godot_smokes.sh
          else
            echo "smoke_command 미지정 + scripts/run_godot_smokes.sh 없음 → smoke 생략"
          fi

      - name: Export Godot Web
        shell: bash
        env:
          GODOT_WEB_OUTPUT_DIR: ${{ inputs.web_output_dir }}
        run: |
          set -euo pipefail
          if [ -f scripts/export_godot_web.sh ]; then
            bash scripts/export_godot_web.sh
          else
            echo "scripts/export_godot_web.sh not found in caller repo." >&2
            echo "Add the standard Godot web export script." >&2
            exit 1
          fi

      - name: Install wrapper dependencies
        working-directory: ${{ inputs.wrapper_dir }}
        run: npm ci

      - name: Lint wrapper
        working-directory: ${{ inputs.wrapper_dir }}
        run: npm run lint

      - name: Build AIT package
        working-directory: ${{ inputs.wrapper_dir }}
        env:
          SEORI_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SEORI_RELEASE_VERSION: ${{ steps.release.outputs.version_name }}
          SEORI_RELEASE_VERSION_CODE: ${{ steps.release.outputs.android_version_code }}
          SEORI_RELEASE_SOURCE_SHA: ${{ steps.tag.outputs.sha }}
        run: npm run build

      - name: Resolve built .ait artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2206
          matches=( "$WRAPPER_DIR"/*.ait )
          [ "${#matches[@]}" -eq 1 ] && [ -f "${matches[0]}" ] || {
            echo ".ait 아티팩트가 정확히 하나여야 함: $WRAPPER_DIR -> ${matches[*]:-none}" >&2
            exit 1
          }
          echo "path=${matches[0]}" >> "$GITHUB_OUTPUT"

      # .ait은 version 필드를 갖지 않는다. 컨테이너 형식과 digest를 읽고 배포 memo를 태그에서
      # 파생한 canonical 값으로 고정해, 배포 기록이 정확히 이 태그·커밋·아티팩트를 가리키게 한다.
      - name: Verify .ait artifact against the release tag
        id: provenance
        shell: bash
        env:
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
          RELEASE_MEMO_NOTE: ${{ inputs.memo }}
        run: |
          set -euo pipefail
          node .seorilabs-release-authority/scripts/release/verify-release-artifact.mjs \
            --kind ait \
            --artifact "${{ steps.artifact.outputs.path }}" \
            --receipt "$RUNNER_TEMP/release-artifact-receipt.txt" \
            --github-output

      # 배포 스텝은 검증한 그 .ait만 올려야 한다. AppsInToss CLI가 디렉터리에서 다른 번들을
      # 고르지 못하도록, workspace에 검증된 .ait 하나만 있는지와 digest가 그대로인지 확인한다.
      - name: Bind the verified .ait as the only upload candidate
        shell: bash
        env:
          VERIFIED_AIT_PATH: ${{ steps.provenance.outputs.artifact_path }}
          VERIFIED_AIT_DIGEST: ${{ steps.provenance.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [ -f "$VERIFIED_AIT_PATH" ] || { echo "검증된 .ait 경로가 없다: $VERIFIED_AIT_PATH" >&2; exit 1; }
          observed="$(sha256sum "$VERIFIED_AIT_PATH" | cut -d ' ' -f 1)"
          [ "$observed" = "$VERIFIED_AIT_DIGEST" ] || {
            echo "배포 직전 .ait digest가 검증값과 다르다: $observed != $VERIFIED_AIT_DIGEST" >&2
            exit 1
          }
          # 검증된 파일 옆에 다른 .ait가 있으면 AppsInToss CLI가 그쪽을 고를 수 있다.
          bundles="$(find "$(dirname "$VERIFIED_AIT_PATH")" -maxdepth 1 -type f -name '*.ait' | wc -l | tr -d ' ')"
          [ "$bundles" = 1 ] || {
            echo "검증된 .ait 디렉터리에 .ait가 정확히 하나여야 한다: $bundles" >&2
            exit 1
          }

      - name: Upload .ait artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ait-${{ github.event.repository.name }}-${{ steps.tag.outputs.tag }}-${{ steps.release.outputs.android_version_code }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 3

      - name: Deploy to AppsInToss
        working-directory: ${{ inputs.wrapper_dir }}
        shell: bash
        env:
          DEPLOY_MEMO: ${{ steps.provenance.outputs.release_memo }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_MEMO" ] || { echo "canonical release memo가 비었다." >&2; exit 1; }
          npm run deploy -- --api-key "$APPS_IN_TOSS_API_KEY" --memo "$DEPLOY_MEMO"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Godot Deploy AIT"; echo ""
            echo "- tag: ${{ steps.tag.outputs.tag }} @ ${{ steps.tag.outputs.sha }}"
            echo "- version: ${{ steps.release.outputs.version_name }} (${{ steps.release.outputs.android_version_code }})"
            echo "- artifact: ${{ steps.provenance.outputs.ait_format }} ${{ steps.provenance.outputs.artifact_path }} sha256:${{ steps.provenance.outputs.artifact_digest }}"
            echo "- memo: ${{ steps.provenance.outputs.release_memo }}"
            echo "- runner: seorilabs-rpi-arm64"
          } >> "$GITHUB_STEP_SUMMARY"
