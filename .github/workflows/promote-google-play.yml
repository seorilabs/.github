# Seorilabs org 재사용 워크플로우: Google Play 트랙 승격(재빌드 없이)
# 호출: uses: seorilabs/.github/.github/workflows/promote-google-play.yml@main
# 러너: private repo는 seorilabs-x64, public repo는 ubuntu-latest (WIF keyless, gradle 빌드 없음).
#       org runner group이 public repo를 막으므로 public에서 ARC를 쓰면 job이 큐에 영원히 남는다.
#       태그에서 파생한 exact versionCode 를
#       to_track 으로 복사 + 언어별 노트 반영 + commit(=심사 제출). AAB 재업로드 없음.
# 버전 정본: GitHub 릴리즈 태그 vX.Y.Z 하나뿐이다(contracts/release-version-authority.yaml).
# 트랙의 "최신 versionCode"를 그대로 승격하지 않는다. 승격 대상은 태그가 정한 build 하나뿐이다.
# 표준 contract:
#   - <script> --promote --promote-from-track <t> --promote-to-track <t>
#       --promote-version-code <n> --release-status <s> --release-name <tag>
#       [--package-name <pkg>] [--rollout <f>]  (노트는 RELEASE_NOTES_JSON env)
# upload_script 를 비우면 중앙 scripts/release/upload-google-play-aab.py 를 쓴다. 그때는
# package_name 을 반드시 준다 — 중앙 스크립트는 저장소 설정 파일을 읽지 않는다.
name: Promote Google Play (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        description: "승격할 릴리즈 태그 vX.Y.Z. 비우면 workflow_dispatch에서만 최신 stable 태그."
        required: false
        default: ""
        type: string
      from_track:
        description: "승격 원본 트랙"
        required: false
        default: "internal"
        type: string
      to_track:
        description: "승격 대상 트랙"
        required: false
        default: "production"
        type: string
      release_status:
        description: "완전 출시=completed. rollout 지정 시 스크립트가 inProgress 로 전환"
        required: false
        default: "completed"
        type: string
      rollout:
        description: "단계적 출시 비율(0,1]. 비우면 완전 출시."
        required: false
        default: ""
        type: string
      upload_script:
        description: "promote 를 지원하는 스크립트 경로. 비우면 중앙 스크립트를 쓴다."
        required: false
        default: ""
        type: string
      package_name:
        description: >-
          Android package name. 중앙 스크립트는 저장소 설정 파일을 읽지 않으므로 호출부가 준다.
          repo-local 레거시 스크립트를 쓰는 caller 는 비워 둔다.
        required: false
        default: ""
        type: string
      closed_test_group_email:
        description: "서리랩스 공통 폐쇄 테스트 Google Group 주소. 지정하면 승격 전에 기존 그룹을 보존하며 추가한다."
        required: false
        default: ""
        type: string
      timeout_minutes:
        required: false
        default: 15
        type: number

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    name: Promote to ${{ inputs.to_track }}
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'seorilabs-x64' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: google-play

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false

      # 승격 대상 versionCode는 org 정본 authority가 태그에서 파생한다. caller 저장소 스크립트나
      # 트랙의 "최신" 값을 읽지 않기 위해 중앙 저장소 main에서 정본을 받는다.
      - name: Checkout release version authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seorilabs/.github
          ref: main
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Resolve exact release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          # 태그 선택은 실행 이벤트에 묶인다. refs/tags 실행은 그 태그가 곧 정본이고,
          # 최신 태그 폴백은 운영자가 시작한 workflow_dispatch에서만 허용한다.
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_REF: ${{ github.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # hot path는 원장 tip의 JSON 한 개와 대상 태그 ref 하나만 읽는다. 전체 태그를 나열하지 않는다.
          LEDGER_BRANCH=release-version-ledger
          LEDGER_JSON="$RUNNER_TEMP/release-version-ledger.json"
          : > "$LEDGER_JSON"
          if git ls-remote --exit-code --heads origin "$LEDGER_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 --force origin "+refs/heads/$LEDGER_BRANCH:refs/remotes/origin/$LEDGER_BRANCH" >/dev/null
            git show "refs/remotes/origin/$LEDGER_BRANCH:release-version-ledger.json" > "$LEDGER_JSON"
          fi
          tag="$(node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --ledger-file "$LEDGER_JSON" --print-tag)"
          git fetch --no-tags --depth=1 --force origin "+refs/tags/$tag:refs/tags/$tag" >/dev/null
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          git -c advice.detachedHead=false checkout "refs/tags/$tag"
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          [ "$tag_commit" = "$head_commit" ] || {
            echo "checkout HEAD가 exact tag commit과 다름: tag=$tag_commit HEAD=$head_commit" >&2
            exit 1
          }
          case "$RELEASE_EVENT_REF" in
            refs/tags/*)
              [ "$tag" = "${RELEASE_EVENT_REF#refs/tags/}" ] || {
                echo "tag 이벤트 ref와 해석된 태그가 다름: $RELEASE_EVENT_REF != $tag" >&2
                exit 1
              }
              [ "$tag_commit" = "$RELEASE_EVENT_SHA" ] || {
                echo "tag 이벤트 commit과 태그 commit이 다름: $RELEASE_EVENT_SHA != $tag_commit" >&2
                exit 1
              }
              ;;
          esac
          { echo "tag=$tag"; echo "sha=$tag_commit"; } >> "$GITHUB_OUTPUT"

      # 승격 대상은 이 태그가 정한 versionCode 하나다. 트랙의 최신 build를 승격하지 않는다.
      - name: Bind release version to the tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ steps.tag.outputs.sha }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_REF: ${{ github.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-tag-message.txt"
            export RELEASE_TAG_MESSAGE_FILE="$RUNNER_TEMP/release-tag-message.txt"
          fi
          RELEASE_HEAD_SHA="$(git rev-parse 'HEAD^{commit}')" \
          RELEASE_LOCAL_TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" \
            node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs \
              --ledger-file "$RUNNER_TEMP/release-version-ledger.json" --github-output

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Install Google Play API client
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -m ensurepip --version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes python3-venv
          fi
          venv="$RUNNER_TEMP/google-play-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check \
            google-api-python-client google-auth google-auth-httplib2 httplib2
          echo "$venv/bin" >> "$GITHUB_PATH"

      # 태그 Release 에 첨부된 정형 출시노트(release-notes.json)를 승격 릴리즈에 반영.
      - name: Resolve store release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_NOTES_OUTPUT: ${{ runner.temp }}/release-notes.json
        run: |
          set -euo pipefail
          # gh CLI는 ARC 러너 이미지에 없다. 중앙 해석기가 REST로 받고, 실패 사유를
          # 버리지 않는다. 자산이 붙어 있는데 읽지 못하면 그 자리에서 멈춘다.
          node .seorilabs-release-authority/scripts/release/resolve-release-notes.mjs --github-output

      - name: Configure closed-test group
        if: inputs.closed_test_group_email != ''
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          TARGET_TRACK: ${{ inputs.to_track }}
          GROUP_EMAIL: ${{ inputs.closed_test_group_email }}
        run: |
          set -euo pipefail
          python3 .seorilabs-release-authority/scripts/release/manage-google-play-testers.py \
            --package-name "$PACKAGE_NAME" --track "$TARGET_TRACK" \
            --group-email "$GROUP_EMAIL" --apply

      - name: Promote track
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          # 언어별 노트(전체 언어)는 env 파일 경로로 전달. 스크립트가 등록 언어와 교집합만 반영.
          RELEASE_NOTES_JSON: ${{ steps.notes.outputs.found == 'true' && steps.notes.outputs.path || '' }}
          # 승격 대상 build는 태그 파생 versionCode 하나뿐이다. 트랙 최신값을 쓰지 않는다.
          PROMOTE_VERSION_CODE: ${{ steps.release.outputs.android_version_code }}
          SEORI_EXPECTED_ANDROID_VERSION_CODE: ${{ steps.release.outputs.android_version_code }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          UPLOAD_SCRIPT: ${{ inputs.upload_script || '.seorilabs-release-authority/scripts/release/upload-google-play-aab.py' }}
        run: |
          set -euo pipefail
          [[ "$PROMOTE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "태그 파생 versionCode가 없다: ${PROMOTE_VERSION_CODE:-missing}" >&2
            exit 1
          }
          # 같은 트랙이면 옮길 곳이 없다. 이미 올라간 build 의 상태만 바꾼다.
          # draft 로 올라가 테스터에게 닿지 않는 build 를 되살리는 경로이고,
          # versionCode 는 재사용할 수 없어 다시 업로드로는 풀 수 없다.
          if [ "${{ inputs.from_track }}" = "${{ inputs.to_track }}" ]; then
            args=(
              --set-track-status
              --track "${{ inputs.to_track }}"
              --version-code "$PROMOTE_VERSION_CODE"
              --release-status "${{ inputs.release_status }}"
              --release-name "$TAG"
            )
          else
            args=(
              --promote
              --promote-from-track "${{ inputs.from_track }}"
              --promote-to-track "${{ inputs.to_track }}"
              --promote-version-code "$PROMOTE_VERSION_CODE"
              --release-status "${{ inputs.release_status }}"
              --release-name "$TAG"
            )
          fi
          if [ -n "${{ inputs.rollout }}" ]; then
            args+=(--rollout "${{ inputs.rollout }}")
          fi
          # 중앙 스크립트는 저장소 설정 파일을 읽지 않아 package name 을 인자로 받는다.
          # repo-local 레거시 스크립트는 그 인자를 모르므로 비었을 때만 생략한다.
          if [ -n "$PACKAGE_NAME" ]; then
            args+=(--package-name "$PACKAGE_NAME")
          fi
          python3 "$UPLOAD_SCRIPT" "${args[@]}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Promote Google Play"; echo ""
            echo "- tag: ${{ steps.tag.outputs.tag }} @ ${{ steps.tag.outputs.sha }}"
            echo "- promoted versionCode: ${{ steps.release.outputs.android_version_code }}"
            if [ "${{ inputs.from_track }}" = "${{ inputs.to_track }}" ]; then
              echo "- ${{ inputs.to_track }} 상태 변경 / status: ${{ inputs.release_status }}"
            else
              echo "- ${{ inputs.from_track }} → ${{ inputs.to_track }} / status: ${{ inputs.release_status }}"
            fi
            echo "- rollout: ${{ inputs.rollout || '(full)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
