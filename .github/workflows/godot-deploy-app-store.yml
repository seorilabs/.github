# Seorilabs org 재사용 워크플로우: Godot 게임 App Store (Xcode archive + 업로드)
# 호출: uses: seorilabs/.github/.github/workflows/godot-deploy-app-store.yml@<FULL_COMMIT_SHA>
# 레거시 이관 경로: 신규 App Store 표준은 Xcode Cloud이며 이 workflow는 기존 caller 이관 전까지만 유지한다.
# 로직 출처: seorilabs/lizard-tycoon iOS 릴리즈(Godot iOS export → xcodebuild archive → exportArchive).
#   composite action(import-codesign-certs)·altool 대신 rn-deploy-app-store.yml 와 동일한 self-contained
#   security keychain + ASC API key exportArchive 방식으로 포팅(org 재사용 워크플로우 style 통일).
# 서명: Apple Distribution 인증서 + App Store provisioning profile(manual).
# 버전 정본: GitHub 릴리즈 태그 vX.Y.Z 하나뿐이다(contracts/release-version-authority.yaml).
# export_presets.cfg와 Godot 생성 Xcode 프로젝트는 authority가 아니라 주입 대상이며, archive
# Info.plist readback이 태그 파생값과 다르면 업로드 전에 fail-closed한다.
# 표준 contract(caller): scripts/ensure_godot.sh --with-export-templates, scripts/export_godot_ios.sh
name: Godot Deploy App Store (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        description: "업로드할 릴리즈 태그. 비우면 최신 vX.Y.Z."
        required: false
        default: ""
        type: string
      upload:
        description: "archive 후 App Store Connect 업로드(false면 xcarchive 아티팩트만)"
        required: false
        default: true
        type: boolean
      ios_scheme:
        description: "Xcode scheme(Godot 프로젝트/앱 표시 이름)"
        required: true
        type: string
      ios_bundle_id:
        description: "iOS bundle id(profile 검증 + export options)"
        required: true
        type: string
      ios_export_preset:
        description: "Godot iOS export preset 이름"
        required: false
        default: "iOS"
        type: string
      ios_output:
        description: "Godot iOS export 출력 경로 prefix. 프로젝트는 <ios_output>.xcodeproj"
        required: false
        default: "build/ios/app"
        type: string
      ios_app_name:
        description: ".app 산출물 이름(비우면 scheme). 요약/read-back 용도(비강제)."
        required: false
        default: ""
        type: string
      godot_version:
        required: false
        default: "4.6.3"
        type: string
      godot_status:
        required: false
        default: "stable"
        type: string
      project_dir:
        description: "Godot 프로젝트 경로"
        required: false
        default: "."
        type: string
      ensure_godot_script:
        description: "Godot + export templates 설치 스크립트(있으면 사용, 없으면 tpz 폴백)"
        required: false
        default: "scripts/ensure_godot.sh"
        type: string
      export_ios_script:
        description: "Xcode 프로젝트 생성 스크립트(있으면 사용, 없으면 godot --export-release 폴백)"
        required: false
        default: "scripts/export_godot_ios.sh"
        type: string
      prepare_project_script:
        description: "Godot import 전에 실행할 repo-local 준비 스크립트"
        required: false
        default: ""
        type: string
      post_archive_validation_script:
        description: "archive 직후·업로드 전에 실행할 repo-local 검증 스크립트. ARCHIVE_PATH 등을 env로 전달"
        required: false
        default: ""
        type: string
      node_version:
        required: false
        default: "24"
        type: string
      timeout_minutes:
        required: false
        default: 70
        type: number
    secrets:
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64:
        required: false
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: false
      APPLE_PROVISIONING_PROFILE_BASE64:
        required: false
      APPLE_KEYCHAIN_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64:
        required: false
      GODOT_ANALYTICS_CONFIG_JSON_BASE64:
        required: false

permissions:
  contents: read

jobs:
  archive-upload:
    name: Godot iOS archive and App Store upload
    runs-on: macos-26
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: app-store

    env:
      SHOULD_UPLOAD: ${{ inputs.upload }}
      GODOT_VERSION: ${{ inputs.godot_version }}
      GODOT_STATUS: ${{ inputs.godot_status }}
      PROJECT_DIR: ${{ inputs.project_dir }}
      IOS_SCHEME: ${{ inputs.ios_scheme }}
      IOS_BUNDLE_ID: ${{ inputs.ios_bundle_id }}
      IOS_EXPORT_PRESET: ${{ inputs.ios_export_preset }}
      IOS_OUTPUT: ${{ inputs.ios_output }}
      IOS_APP_NAME: ${{ inputs.ios_app_name || inputs.ios_scheme }}
      ENSURE_GODOT_SCRIPT: ${{ inputs.ensure_godot_script }}
      EXPORT_IOS_SCRIPT: ${{ inputs.export_ios_script }}
      PREPARE_PROJECT_SCRIPT: ${{ inputs.prepare_project_script }}
      POST_ARCHIVE_VALIDATION_SCRIPT: ${{ inputs.post_archive_validation_script }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
      ADMOB_REQUIRE_PRODUCTION: "1"
      ADMOB_TARGET_PLATFORM: iOS
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_AD_UNIT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          check-latest: false

      # 버전 authority 구현은 org 정본에만 둔다. caller 저장소 스크립트를 신뢰하지 않기 위해
      # called workflow identity를 확인하고 그 exact commit SHA로 정본을 받아 실행한다.
      - name: Validate called reusable workflow identity
        id: authority
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          EXPECTED_WORKFLOW_PATH: seorilabs/.github/.github/workflows/godot-deploy-app-store.yml
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const expected = process.env.EXPECTED_WORKFLOW_PATH + "@" + identity.workflow_sha;
            if (identity.workflow_repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(identity.workflow_sha ?? "") || identity.workflow_ref !== expected) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + identity.workflow_repository, "sha=" + identity.workflow_sha, "ref=" + identity.workflow_ref].join("\n") + "\n");
          '

      - name: Checkout exact release version authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.authority.outputs.repository }}
          ref: ${{ steps.authority.outputs.sha }}
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Resolve exact release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git tag --list > "$RUNNER_TEMP/git-tags.txt"
          tag="$(node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --tag-list-file "$RUNNER_TEMP/git-tags.txt" --print-tag)"
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          git -c advice.detachedHead=false checkout "refs/tags/$tag"
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          [ "$tag_commit" = "$head_commit" ] || {
            echo "checkout HEAD가 exact tag commit과 다름: tag=$tag_commit HEAD=$head_commit" >&2
            exit 1
          }
          { echo "tag=$tag"; echo "sha=$tag_commit"; } >> "$GITHUB_OUTPUT"

      - name: Bind release version to the tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ steps.tag.outputs.sha }}
          JOB_WORKFLOW_REPOSITORY: ${{ steps.authority.outputs.repository }}
          JOB_WORKFLOW_REF: ${{ steps.authority.outputs.ref }}
          JOB_WORKFLOW_SHA: ${{ steps.authority.outputs.sha }}
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-tag-message.txt"
            export RELEASE_TAG_MESSAGE_FILE="$RUNNER_TEMP/release-tag-message.txt"
          fi
          RELEASE_HEAD_SHA="$(git rev-parse 'HEAD^{commit}')" \
          RELEASE_LOCAL_TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" \
            node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs --github-output

      - name: Verify Xcode SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: $sdk"
          [ "${sdk%%.*}" -ge 26 ] || { echo "App Store는 iOS 26 SDK 이상 필요. 현재: $sdk" >&2; exit 1; }

      - name: Install Godot (macOS)
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fsSL "${base}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_macos.universal.zip" -o /tmp/godot.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godotapp
          mkdir -p "${HOME}/.local/bin"
          ln -sf /tmp/godotapp/Godot.app/Contents/MacOS/Godot "${HOME}/.local/bin/godot"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Ensure Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          if [ -f "$ENSURE_GODOT_SCRIPT" ]; then
            echo "Using caller template script: $ENSURE_GODOT_SCRIPT"
            bash "$ENSURE_GODOT_SCRIPT" --with-export-templates
          else
            tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
            if [ -z "$(find "$tdir" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              echo "No $ENSURE_GODOT_SCRIPT; downloading export templates tpz"
              curl -fsSL -o /tmp/export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
              unzip -q -o /tmp/export_templates.tpz -d /tmp/godot-templates
              mkdir -p "$tdir"
              mv /tmp/godot-templates/templates/* "$tdir/"
            fi
          fi

      # GA4 Measurement Protocol 설정(<project>/analytics.config.json)을 secret 에서 복원.
      # 미설정 repo 는 경고만 남기고 통과(애널리틱스 비활성 빌드) — 기존 동작 보존.
      - name: Restore GA4 analytics config
        shell: bash
        env:
          GODOT_ANALYTICS_CONFIG_JSON_BASE64: ${{ secrets.GODOT_ANALYTICS_CONFIG_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GODOT_ANALYTICS_CONFIG_JSON_BASE64:-}" ]; then
            echo "::warning::GODOT_ANALYTICS_CONFIG_JSON_BASE64 미설정 — GA4 전송 비활성 빌드."
            exit 0
          fi
          if [ -z "${PROJECT_DIR:-}" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::PROJECT_DIR('${PROJECT_DIR:-}')가 유효한 디렉터리가 아닙니다."
            exit 1
          fi
          dest="$PROJECT_DIR/analytics.config.json"
          tmp="$(mktemp)"
          # 임시파일에 디코드 후 성공 시에만 mv(atomic). GNU=--decode, BSD/macOS=-D.
          # 실패를 묵음 처리하지 않는다(손상 secret 이 조용히 잘못된 config 로 export 되는 것 방지).
          if printf '%s' "$GODOT_ANALYTICS_CONFIG_JSON_BASE64" | base64 --decode > "$tmp" 2>/dev/null; then
            :
          elif printf '%s' "$GODOT_ANALYTICS_CONFIG_JSON_BASE64" | base64 -D > "$tmp" 2>/dev/null; then
            :
          else
            rm -f "$tmp"
            echo "::error::GODOT_ANALYTICS_CONFIG_JSON_BASE64 base64 디코드 실패 — secret 값 확인 필요."
            exit 1
          fi
          if [ ! -s "$tmp" ] || [ "$(head -c1 "$tmp")" != "{" ]; then
            rm -f "$tmp"
            echo "::error::복원된 analytics.config.json 이 비었거나 JSON 형태가 아닙니다."
            exit 1
          fi
          mv "$tmp" "$dest"
          echo "analytics.config.json 복원 완료 → $dest"

      - name: Run caller project preparation
        if: ${{ inputs.prepare_project_script != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$PREPARE_PROJECT_SCRIPT" ] || {
            echo "project preparation script not found: $PREPARE_PROJECT_SCRIPT" >&2
            exit 1
          }
          bash "$PREPARE_PROJECT_SCRIPT"

      - name: Import Godot project
        shell: bash
        run: godot --headless --path "$PROJECT_DIR" --import --quit-after 1

      - name: Validate signing and upload secrets
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for v in APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_KEYCHAIN_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v:-}" ] || { echo "$v is required." >&2; exit 1; }
          done
          if [ "$SHOULD_UPLOAD" = "true" ]; then
            for v in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
              [ -n "${!v:-}" ] || { echo "$v is required when upload=true." >&2; exit 1; }
            done
          fi

      - name: Restore Apple signing assets
        id: signing
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          decode_base64() {
            if ! printf '%s' "$1" | base64 --decode > "$2" 2>/dev/null; then printf '%s' "$1" | base64 -D > "$2"; fi
          }
          signing_dir="$RUNNER_TEMP/app-store-signing"
          keychain_path="$signing_dir/app-store.keychain-db"
          certificate_path="$signing_dir/apple-distribution.p12"
          profile_path="$signing_dir/app-store.mobileprovision"
          mkdir -p "$signing_dir"
          decode_base64 "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" "$certificate_path"
          decode_base64 "$APPLE_PROVISIONING_PROFILE_BASE64" "$profile_path"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          profile_plist="$signing_dir/profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(plutil -extract UUID raw -o - "$profile_plist")"
          profile_name="$(plutil -extract Name raw -o - "$profile_plist")"
          profile_team="$(plutil -extract TeamIdentifier.0 raw -o - "$profile_plist")"
          profile_app_id="$(plutil -extract Entitlements.application-identifier raw -o - "$profile_plist")"
          profile_get_task_allow="$(plutil -extract Entitlements.get-task-allow raw -o - "$profile_plist")"

          expected="$APPLE_TEAM_ID.$IOS_BUNDLE_ID"; wildcard="$APPLE_TEAM_ID.*"
          [ "$profile_team" = "$APPLE_TEAM_ID" ] || { echo "profile team != APPLE_TEAM_ID" >&2; exit 1; }
          { [ "$profile_app_id" = "$expected" ] || [ "$profile_app_id" = "$wildcard" ]; } || { echo "profile bundle != $IOS_BUNDLE_ID" >&2; exit 1; }
          [ "$profile_get_task_allow" = "false" ] || { echo "App Store profile은 get-task-allow=false 필요" >&2; exit 1; }

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"
          { echo "keychain_path=$keychain_path"; echo "profile_name=$profile_name"; echo "profile_uuid=$profile_uuid"; } >> "$GITHUB_OUTPUT"
          echo "Signing identities:"; security find-identity -v -p codesigning "$keychain_path"

      # export_presets.cfg는 version authority가 아니라 주입 대상이다. 태그 파생값을 덮어쓰고
      # 실제 반영 여부는 archive Info.plist readback으로 확인한다.
      - name: Apply release version to the Godot iOS export preset
        shell: bash
        env:
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          node .seorilabs-release-authority/scripts/release/apply-godot-export-version.mjs \
            --platform iOS \
            --preset "$IOS_EXPORT_PRESET" \
            --presets "$PROJECT_DIR/export_presets.cfg"

      - name: Generate Xcode project (Godot iOS export)
        id: export
        shell: bash
        env:
          APPLE_MARKETING_VERSION: ${{ steps.release.outputs.apple_marketing_version }}
          APPLE_BUILD_NUMBER: ${{ steps.release.outputs.apple_build_number }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$IOS_OUTPUT")"
          if [ -f "$EXPORT_IOS_SCRIPT" ]; then
            echo "Using caller export script: $EXPORT_IOS_SCRIPT"
            bash "$EXPORT_IOS_SCRIPT"
          else
            echo "No $EXPORT_IOS_SCRIPT; inline godot iOS export (preset: $IOS_EXPORT_PRESET)"
            godot --headless --path "$PROJECT_DIR" --export-release "$IOS_EXPORT_PRESET" "$IOS_OUTPUT.xcodeproj"
          fi
          [ -d "${IOS_OUTPUT}.xcodeproj" ] || { echo "Xcode project not generated at ${IOS_OUTPUT}.xcodeproj" >&2; exit 1; }
          echo "xcodeproj=${IOS_OUTPUT}.xcodeproj" >> "$GITHUB_OUTPUT"

      - name: Archive iOS app
        id: archive
        shell: bash
        env:
          APPLE_MARKETING_VERSION: ${{ steps.release.outputs.apple_marketing_version }}
          APPLE_BUILD_NUMBER: ${{ steps.release.outputs.apple_build_number }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          XCODEPROJ: ${{ steps.export.outputs.xcodeproj }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/${IOS_APP_NAME}-v${APPLE_MARKETING_VERSION}-build${APPLE_BUILD_NUMBER}.xcarchive"
          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            MARKETING_VERSION="$APPLE_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$APPLE_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

          app_path="$(find "$archive_path/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$app_path" ] && [ -f "$app_path/Info.plist" ] || {
            echo "archive에서 .app Info.plist를 찾지 못함: $archive_path" >&2
            exit 1
          }
          plutil -convert json -o "$RUNNER_TEMP/archive-info.json" "$app_path/Info.plist"
          {
            echo "archive_path=$archive_path"
            echo "info_plist_json=$RUNNER_TEMP/archive-info.json"
          } >> "$GITHUB_OUTPUT"

      # Godot 생성 프로젝트가 버전을 하드코딩하거나 xcodebuild override가 무시되면 fail-closed한다.
      - name: Verify archive version against the release tag
        id: provenance
        shell: bash
        env:
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
          INFO_PLIST_JSON: ${{ steps.archive.outputs.info_plist_json }}
        run: |
          set -euo pipefail
          node .seorilabs-release-authority/scripts/release/verify-release-artifact.mjs \
            --kind xcode-archive \
            --metadata "$INFO_PLIST_JSON" \
            --receipt "$RUNNER_TEMP/release-artifact-receipt.txt" \
            --github-output

      - name: Run caller post-archive validation
        if: ${{ inputs.post_archive_validation_script != '' }}
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
          APPLE_MARKETING_VERSION: ${{ steps.release.outputs.apple_marketing_version }}
          APPLE_BUILD_NUMBER: ${{ steps.release.outputs.apple_build_number }}
        run: |
          set -euo pipefail
          [ -f "$POST_ARCHIVE_VALIDATION_SCRIPT" ] || {
            echo "post-archive validation script not found: $POST_ARCHIVE_VALIDATION_SCRIPT" >&2
            exit 1
          }
          bash "$POST_ARCHIVE_VALIDATION_SCRIPT"

      - name: Upload xcarchive artifact
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-app-store-archive-${{ steps.tag.outputs.tag }}-build${{ steps.release.outputs.apple_build_number }}
          path: ${{ steps.archive.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 3

      - name: Prepare App Store Connect API key
        if: ${{ inputs.upload }}
        id: asc
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/asc-api-key"
          path="$dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$dir"
          if ! printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$path" 2>/dev/null; then
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D > "$path"
          fi
          chmod 600 "$path"
          echo "api_key_path=$path" >> "$GITHUB_OUTPUT"

      - name: Export and upload to App Store Connect
        if: ${{ inputs.upload }}
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ steps.asc.outputs.api_key_path }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
        run: |
          set -euo pipefail
          opts="$RUNNER_TEMP/AppStoreExportOptions.plist"
          out="$RUNNER_TEMP/app-store-export"
          cat > "$opts" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${IOS_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$opts"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$opts" \
            -exportPath "$out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Godot Deploy App Store"; echo ""
            echo "- tag: ${{ steps.tag.outputs.tag }}"
            echo "- scheme: ${{ inputs.ios_scheme }} / bundle: ${{ inputs.ios_bundle_id }}"
            echo "- source: ${{ steps.tag.outputs.sha }}"
            echo "- marketing: ${{ steps.release.outputs.apple_marketing_version }} / build: ${{ steps.release.outputs.apple_build_number }}"
            echo "- config revision: ${{ steps.release.outputs.config_revision }}"
            echo "- uploaded: ${{ inputs.upload }} / runner: macos-26"
          } >> "$GITHUB_STEP_SUMMARY"
