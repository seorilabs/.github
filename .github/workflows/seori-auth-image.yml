name: Seori Auth Broker Image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seori-auth-image.yml
      - tools/seori-auth/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: seori-auth-image-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/seorilabs/seori-auth

jobs:
  publish:
    name: ARM64 canary and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR with repository identity
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build native ARM64 canary image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: tools/seori-auth/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-canary
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=seori-auth-arm64
          cache-to: type=gha,mode=max,scope=seori-auth-arm64

      - name: Run non-secret container canary
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges
          "${IMAGE}:${GITHUB_SHA}-canary"

      - name: Publish immutable ARM64 image with provenance
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: tools/seori-auth/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=seori-auth-arm64

      - name: Verify the exact pushed digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid image digest" >&2
            exit 1
          fi
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            "${IMAGE}@${IMAGE_DIGEST}"
          printf 'image=%s@%s\nsource_sha=%s\n' \
            "$IMAGE" "$IMAGE_DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
