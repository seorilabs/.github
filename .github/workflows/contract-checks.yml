name: Contract Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-process-boundary-macos:
    name: P2 process boundary macOS ARM64
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false
          package-manager-cache: false

      - name: Execute native launch, root-owned writer, and child hardening readback
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          node tools/seori-auth/scripts/build-native.mjs
          node_path="$(command -v node)"
          sudo -- "$node_path" tools/seori-auth/scripts/verify-root-owned-writer.mjs
          node scripts/fleet/build-p2-process-hardening-boundary.mjs
          node --test tests/fleet-p2-process-hardening-darwin.test.mjs

  p2-host-boundary-arm64:
    name: P2 host boundary Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false
          package-manager-cache: false

      - name: Execute production boundary, root-owned writer, and isolated syscall harness
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          node tools/seori-auth/scripts/build-native.mjs
          node_path="$(command -v node)"
          sudo -- "$node_path" tools/seori-auth/scripts/verify-root-owned-writer.mjs
          sudo -- "$node_path" scripts/fleet/verify-p2-host-fs-boundary-linux-arm64.mjs

  verify:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm test

      - name: Verify repo-contract package
        run: npm run pack:check

      - name: Install workflow linters
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint

          shellcheck_archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --location --silent --show-error \
            --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${shellcheck_archive}"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check --strict
          tar -xJf "$shellcheck_archive" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" ./shellcheck

      - name: Validate GitHub Actions workflows
        run: ./actionlint -shellcheck ./shellcheck -config-file .github/actionlint.yaml .github/workflows/*.yml
