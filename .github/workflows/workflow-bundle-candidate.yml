name: WorkflowBundle Candidate

on:
  pull_request:
    paths:
      - .github/cloud-build/**
      - .github/workflows/**
      - builders/**
      - contracts/**
      - fixtures/workflow-bundle/**
      - packages/repo-contract/**
      - profiles/**
      - scripts/fleet/**
      - tests/**
  push:
    branches: [main]
    paths:
      - .github/cloud-build/**
      - .github/workflows/**
      - builders/**
      - contracts/**
      - fixtures/workflow-bundle/**
      - packages/repo-contract/**
      - profiles/**
      - scripts/fleet/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-bundle-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-process-boundary-macos:
    name: P2 process boundary macOS ARM64
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false
          package-manager-cache: false

      - name: Execute native launch, root-owned writer, and child hardening readback
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          node tools/seori-auth/scripts/build-native.mjs
          node_path="$(command -v node)"
          sudo -- "$node_path" tools/seori-auth/scripts/verify-root-owned-writer.mjs
          node scripts/fleet/build-p2-process-hardening-boundary.mjs
          node --test tests/fleet-p2-process-hardening-darwin.test.mjs

  p2-host-boundary-arm64:
    name: P2 host boundary Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false
          package-manager-cache: false

      - name: Execute production boundary, root-owned writer, and isolated syscall harness
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          node tools/seori-auth/scripts/build-native.mjs
          node_path="$(command -v node)"
          sudo -- "$node_path" tools/seori-auth/scripts/verify-root-owned-writer.mjs
          sudo -- "$node_path" scripts/fleet/verify-p2-host-fs-boundary-linux-arm64.mjs

  candidate:
    name: WorkflowBundle Candidate
    needs:
      - p2-host-boundary-arm64
      - p2-process-boundary-macos
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.16.0
          check-latest: false
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate contracts and workflows
        run: npm test

      - name: Run non-promotable RN and Godot contract fixture probes
        run: |
          set -euo pipefail
          node scripts/fleet/fixture-canary.mjs react-native "$RUNNER_TEMP/contract-fixtures/react-native.json"
          node scripts/fleet/fixture-canary.mjs godot "$RUNNER_TEMP/contract-fixtures/godot.json"

      - name: Generate immutable candidate
        run: >-
          node packages/repo-contract/src/fleet-cli.mjs bundle
          --source-sha "$GITHUB_SHA"
          --platform-release contracts/platform-releases/v0.6.6/platform-release.json
          --output "$RUNNER_TEMP/workflow-bundle.json"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-bundle-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/workflow-bundle.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload non-promotable contract fixture probes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-bundle-contract-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/contract-fixtures/*.json
          if-no-files-found: error
          retention-days: 3
