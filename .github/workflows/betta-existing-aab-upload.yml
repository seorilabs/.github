name: Betta existing AAB internal upload
on:
  workflow_call:
    inputs:
      recovery_id:
        type: string
        required: true
    secrets:
      BETTA_INTERNAL_BOOTSTRAP_TOKEN:
        required: true
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: betta-existing-aab-com.seorilabs.bettaraising-1
  cancel-in-progress: false
jobs:
  upload-existing:
    if: ${{ github.repository == 'seorilabs/betta-raising' && github.event.repository.private == true && github.event_name == 'push' && github.ref == 'refs/tags/betta-existing-aab-upload-0.1.0' && github.run_id == '43309802883' && github.run_attempt == '2' && inputs.recovery_id == 'betta-0-1-0-existing-aab-upload-only' }}
    name: Upload previously signed Betta AAB
    runs-on: seorilabs-x64
    timeout-minutes: 20
    environment: google-play
    steps:
      - name: Checkout immutable artifact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.1.0
          path: candidate
          persist-credentials: false
      - name: Checkout reviewed authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seorilabs/.github
          ref: main
          path: authority
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          check-latest: false
      - name: Install verifier dependencies
        working-directory: authority
        run: npm ci --omit=dev
      - name: Setup Java for JAR verification
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          check-latest: false
      - name: Install Publisher client
        run: python3 -m pip install google-api-python-client google-auth google-auth-httplib2 httplib2
      - name: Authenticate registered Publisher
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
      - name: Verify and upload exact existing AAB
        working-directory: candidate
        env:
          GH_TOKEN: ${{ secrets.BETTA_INTERNAL_BOOTSTRAP_TOKEN }}
          # 불변 caller의 기존 invocation ID를 이 preflight 복구 한 건에만 연결한다.
          BETTA_EXISTING_AAB_ID: betta-0-1-0-existing-aab-upload-only-preflight-r1
        run: node ../authority/scripts/release/recover-betta-existing-aab.mjs
      - name: Preserve upload-only receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: betta-upload-only-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/betta-upload-only-before-upload.json
            ${{ runner.temp }}/betta-upload-only-result.json
          if-no-files-found: warn
          retention-days: 3
