# WorkflowBundle v5 public AppsInToss upload boundary.
# 공용 credential을 app-owned package script, argv, environment에 넘기지 않는다. 현재는
# broker 내부의 SHA-pinned trusted adapter가 없으므로 secret을 받지 않고 fail-closed한다.
name: AIT Upload v1

on:
  workflow_call: {}

permissions: {}

jobs:
  runtime-gate:
    name: AIT upload runtime gate
    # PR에서는 job 자체를 실행하지 않고, 나머지 오호출은 skipped-success가 아니라
    # exact public stable-tag 문맥 검증 단계에서 fail-closed한다.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Require the exact public stable-tag upload context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_PRIVATE" = false
          [[ "$EVENT_NAME" =~ ^(push|workflow_dispatch)$ ]]
          [[ "$EVENT_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Block upload until the trusted broker adapter is operational
        shell: bash
        run: |
          echo "RUNTIME_NOT_OPERATIONAL" >&2
          exit 1
