# Seorilabs org 재사용 워크플로우: Godot Web export → GitHub Pages 배포
# 호출: uses: seorilabs/.github/.github/workflows/godot-pages.yml@<FULL_COMMIT_SHA>
# 러너: ARC(private) 우선. caller가 public repo면 runs_on='ubuntu-latest' 전달.
name: Godot Pages (reusable)

on:
  workflow_call:
    inputs:
      godot_version:
        required: false
        default: "4.6.3"
        type: string
      godot_status:
        required: false
        default: "stable"
        type: string
      pages_dir:
        description: "Pages 산출물 경로"
        required: false
        default: "build/pages"
        type: string
      runs_on:
        description: "실행 러너. seorilabs-rpi-arm64 또는 ubuntu-latest만 허용한다."
        required: false
        default: "seorilabs-rpi-arm64"
        type: string
      timeout_minutes:
        required: false
        default: 30
        type: number

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Godot Web
    runs-on: ${{ (inputs.runs_on == 'ubuntu-latest' && 'ubuntu-latest') || 'seorilabs-rpi-arm64' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      GODOT_VERSION: ${{ inputs.godot_version }}
      GODOT_STATUS: ${{ inputs.godot_status }}

    steps:
      # 권한 있는 job의 러너는 caller 입력을 그대로 믿지 않는다. 승인된 라벨만 허용하고,
      # 그 밖의 값은 요청 자체를 실패시킨다(runs-on은 이미 승인 목록으로 축약돼 있다).
      - name: Reject unapproved runner routing
        shell: bash
        env:
          REQUESTED_RUNNER: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          case "$REQUESTED_RUNNER" in
            "seorilabs-rpi-arm64" | "ubuntu-latest") ;;
            *) echo "승인되지 않은 러너 라벨: $REQUESTED_RUNNER" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure fontconfig runtime
        shell: bash
        run: |
          set -euo pipefail
          if ldconfig -p 2>/dev/null | grep -q "libfontconfig.so.1"; then exit 0; fi
          command -v apt-get >/dev/null 2>&1 || exit 0
          sudo_cmd=""; command -v sudo >/dev/null 2>&1 && sudo_cmd="sudo"
          ${sudo_cmd} apt-get update && ${sudo_cmd} apt-get install -y libfontconfig1 fontconfig

      - name: Install Godot deps (repo script)
        shell: bash
        run: |
          set -euo pipefail
          [ -f scripts/install_godot_ci_dependencies.sh ] && bash scripts/install_godot_ci_dependencies.sh || true

      - name: Ensure Godot
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/ensure_godot.sh ]; then
            bash scripts/ensure_godot.sh --with-export-templates
            exit 0
          fi
          case "${RUNNER_ARCH:-}" in
            X64) arch="x86_64" ;; ARM64) arch="arm64" ;; ARM) arch="arm32" ;;
            *) echo "Unsupported arch" >&2; exit 1 ;;
          esac
          bin="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.${arch}"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${bin}.zip"
          install_dir="$RUNNER_TEMP/godot-bin"
          unzip -q godot.zip && mkdir -p "$install_dir" && mv "$bin" "$install_dir/godot" && chmod +x "$install_dir/godot"
          echo "$install_dir" >> "$GITHUB_PATH"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          curl -L -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -q tpl.tpz && mkdir -p "$tdir" && mv templates/* "$tdir/"
          "$install_dir/godot" --version

      - name: Export Godot Web
        shell: bash
        run: |
          set -euo pipefail
          [ -f scripts/export_godot_web.sh ] || { echo "scripts/export_godot_web.sh 필요." >&2; exit 1; }
          bash scripts/export_godot_web.sh

      - name: Validate Pages artifact
        shell: bash
        env:
          PAGES_DIR: ${{ inputs.pages_dir }}
        run: |
          set -euo pipefail
          if [ ! -f "$PAGES_DIR/index.html" ]; then
            echo "Pages 산출물에 index.html이 없습니다(빈 사이트 배포 방지): $PAGES_DIR" >&2
            exit 1
          fi
          [ -f "$PAGES_DIR/.nojekyll" ] || touch "$PAGES_DIR/.nojekyll"
          find "$PAGES_DIR" -maxdepth 1 -type f -print | sort

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.pages_dir }}

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ${{ (inputs.runs_on == 'ubuntu-latest' && 'ubuntu-latest') || 'seorilabs-rpi-arm64' }}
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
