# Fleet-approved candidate: fixed commands, fixed toolchain, fixed runner policy.
name: RN Static Checks v2

on:
  workflow_call:
    inputs:
      package_manager:
        description: "탐지된 package manager. npm 또는 pnpm."
        required: false
        default: pnpm
        type: string
      working_directory:
        description: "중앙 discovery가 확정한 저장소 내부 작업 경로."
        required: false
        default: .
        type: string

permissions:
  contents: read
  packages: read

jobs:
  org-contract:
    name: Org Contract
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 25

    steps:
      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout immutable org bundle source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: seorilabs/.github
          ref: ${{ github.workflow_sha }}
          path: .seorilabs-org

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.16.0
          check-latest: false
          registry-url: https://npm.pkg.github.com
          scope: "@seorilabs"

      - name: Validate discovered inputs and canonical commands
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          node .seorilabs-org/scripts/fleet/static-preflight.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --working-directory "$WORKING_DIRECTORY" \
            --package-manager "$PACKAGE_MANAGER" \
            --profile react-native

      - name: Scan tracked source for high-confidence credentials
        shell: bash
        run: node .seorilabs-org/scripts/fleet/secret-scan.mjs "$GITHUB_WORKSPACE"

      - name: Enable pinned pnpm
        if: inputs.package_manager == 'pnpm'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install locked dependencies
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *) echo "지원하지 않는 package manager" >&2; exit 1 ;;
          esac

      - name: Run canonical product tests
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: "$PACKAGE_MANAGER test:core"

      - name: Run canonical architecture checks
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: "$PACKAGE_MANAGER check:architecture"

      - name: Run canonical release checks
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: "$PACKAGE_MANAGER check:release"

      - name: Record non-secret CI provenance
        shell: bash
        run: >-
          node .seorilabs-org/scripts/fleet/write-provenance.mjs
          "$RUNNER_TEMP/org-contract-provenance.json" react-native

      - name: Upload CI provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: org-contract-${{ github.repository_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/org-contract-provenance.json
          if-no-files-found: error
          retention-days: 3
