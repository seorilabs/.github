# WorkflowBundle v5 Godot build-only path. Backoffice binding resolves before app checkout.
name: Godot Android Cloud Build v2

on:
  workflow_call: {}

permissions:
  contents: read
  id-token: write

jobs:
  resolve-binding:
    name: Resolve signed Android binding
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    outputs:
      application_source_sha: ${{ steps.binding.outputs.application_source_sha }}
      build_profile: ${{ steps.binding.outputs.build_profile }}
      package_manager: ${{ steps.binding.outputs.package_manager }}
      execution_root: ${{ steps.binding.outputs.execution_root }}
      dependency_root: ${{ steps.binding.outputs.dependency_root }}
      script_path: ${{ steps.binding.outputs.script_path }}
      artifact_kind: ${{ steps.binding.outputs.artifact_kind }}
      config_revision_id: ${{ steps.binding.outputs.config_revision_id }}
      config_revision: ${{ steps.binding.outputs.config_revision }}
      config_revision_digest: ${{ steps.binding.outputs.config_revision_digest }}
      signed_snapshot_digest: ${{ steps.binding.outputs.signed_snapshot_digest }}
      snapshot_signature_key_id: ${{ steps.binding.outputs.snapshot_signature_key_id }}
      snapshot_signature_policy_revision: ${{ steps.binding.outputs.snapshot_signature_policy_revision }}
      snapshot_signature_digest: ${{ steps.binding.outputs.snapshot_signature_digest }}
      workflow_bundle_source_sha: ${{ steps.binding.outputs.workflow_bundle_source_sha }}
      workflow_bundle_payload_digest: ${{ steps.binding.outputs.workflow_bundle_payload_digest }}
      manifest_digest: ${{ steps.binding.outputs.manifest_digest }}
      binding_mode: ${{ steps.binding.outputs.binding_mode }}
      release_mode: ${{ steps.binding.outputs.release_mode }}
      release_tag: ${{ steps.binding.outputs.release_tag }}
      release_artifact_kind: ${{ steps.binding.outputs.release_artifact_kind }}
      release_version_name: ${{ steps.binding.outputs.release_version_name }}
      release_android_version_code: ${{ steps.binding.outputs.release_android_version_code }}
      release_authority_revision: ${{ steps.binding.outputs.release_authority_revision }}
      release_config_revision: ${{ steps.binding.outputs.release_config_revision }}
      release_binding_digest: ${{ steps.binding.outputs.release_binding_digest }}
      bundle_repository: ${{ steps.bundle-identity.outputs.repository }}
      bundle_sha: ${{ steps.bundle-identity.outputs.sha }}
      bundle_ref: ${{ steps.bundle-identity.outputs.ref }}

    steps:
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false

      - name: Validate called reusable workflow identity
        id: bundle-identity
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const expected = "seorilabs/.github/.github/workflows/godot-build-android-cloud-v2.yml@" + identity.workflow_sha;
            if (identity.workflow_repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(identity.workflow_sha ?? "") || identity.workflow_ref !== expected) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + identity.workflow_repository, "sha=" + identity.workflow_sha, "ref=" + identity.workflow_ref].join("\n") + "\n");
          '

      - name: Checkout exact WorkflowBundle source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.bundle-identity.outputs.repository }}
          ref: ${{ steps.bundle-identity.outputs.sha }}
          path: .seorilabs-workflow-bundle
          persist-credentials: false

      - name: Resolve current signed build-only binding before app checkout
        id: binding
        shell: bash
        env:
          BINDING_TARGET: android
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY_ID: ${{ github.repository_id }}
          FULL_NAME: ${{ github.repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_WORKFLOW_REPOSITORY: ${{ steps.bundle-identity.outputs.repository }}
          JOB_WORKFLOW_SHA: ${{ steps.bundle-identity.outputs.sha }}
          JOB_WORKFLOW_REF: ${{ steps.bundle-identity.outputs.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node .seorilabs-workflow-bundle/scripts/fleet/static-runtime-binding-v5.mjs

  submit-build-only:
    name: Android Build-only
    needs: resolve-binding
    if: ${{ github.event.repository.private }}
    runs-on: seorilabs-rpi-arm64
    environment: internal
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 55

    steps:
      - name: Validate the resolved build binding
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-binding.outputs.application_source_sha }}
          BUILD_PROFILE: ${{ needs.resolve-binding.outputs.build_profile }}
          PACKAGE_MANAGER: ${{ needs.resolve-binding.outputs.package_manager }}
          SCRIPT_PATH: ${{ needs.resolve-binding.outputs.script_path }}
          ARTIFACT_KIND: ${{ needs.resolve-binding.outputs.artifact_kind }}
          BUNDLE_SHA: ${{ needs.resolve-binding.outputs.bundle_sha }}
          BINDING_MODE: ${{ needs.resolve-binding.outputs.binding_mode }}
          RELEASE_MODE: ${{ needs.resolve-binding.outputs.release_mode }}
          RELEASE_TAG: ${{ needs.resolve-binding.outputs.release_tag }}
          RELEASE_ARTIFACT_KIND: ${{ needs.resolve-binding.outputs.release_artifact_kind }}
          RELEASE_VERSION_NAME: ${{ needs.resolve-binding.outputs.release_version_name }}
          RELEASE_VERSION_CODE: ${{ needs.resolve-binding.outputs.release_android_version_code }}
          RELEASE_BINDING_DIGEST: ${{ needs.resolve-binding.outputs.release_binding_digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BUILD_PROFILE" = godot-android
          test "$PACKAGE_MANAGER" = none
          test "$SCRIPT_PATH" = scripts/build-android.sh
          test "$ARTIFACT_KIND" = android-aab
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # release 실행이면 태그 파생값이 모두 채워져 있어야 한다. 비어 있으면 version 정본이
          # 없는 채로 마켓 artifact를 만드는 것이므로 build 전에 fail-closed한다.
          if [ "$RELEASE_MODE" = true ]; then
            test "$BINDING_MODE" = RELEASE
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$RELEASE_ARTIFACT_KIND" = android-app-bundle
            [[ "$RELEASE_VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
            [[ "$RELEASE_BINDING_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          else
            test "$RELEASE_MODE" = false
            test -z "$RELEASE_TAG"
            test -z "$RELEASE_VERSION_NAME"
            test -z "$RELEASE_VERSION_CODE"
          fi

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false

      - name: Checkout exact WorkflowBundle source before application checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve-binding.outputs.bundle_repository }}
          ref: ${{ needs.resolve-binding.outputs.bundle_sha }}
          path: .seorilabs-workflow-bundle
          persist-credentials: false

      - name: Checkout exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-binding.outputs.application_source_sha }}
          path: .seorilabs-application
          persist-credentials: false
          # release 실행에서만 annotated tag receipt를 읽어야 하므로 그때만 전체 이력을 받는다.
          fetch-depth: ${{ needs.resolve-binding.outputs.release_mode == 'true' && '0' || '1' }}
          fetch-tags: ${{ needs.resolve-binding.outputs.release_mode == 'true' }}

      # release 실행은 태그 하나에서 version을 파생한다. resolve-binding이 계산한 digest와
      # 앱 checkout의 annotated tag receipt를 여기서 독립적으로 다시 대조해 fail-closed한다.
      - name: Bind release version to the exact tag
        if: ${{ needs.resolve-binding.outputs.release_mode == 'true' }}
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-binding.outputs.release_tag }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-binding.outputs.application_source_sha }}
          JOB_WORKFLOW_REPOSITORY: ${{ needs.resolve-binding.outputs.bundle_repository }}
          JOB_WORKFLOW_REF: ${{ needs.resolve-binding.outputs.bundle_ref }}
          JOB_WORKFLOW_SHA: ${{ needs.resolve-binding.outputs.bundle_sha }}
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
          EXPECTED_BINDING_DIGEST: ${{ needs.resolve-binding.outputs.release_binding_digest }}
        run: |
          set -euo pipefail
          application_root="$GITHUB_WORKSPACE/.seorilabs-application"
          test "$(git -C "$application_root" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SOURCE_SHA"
          if [ "$(git -C "$application_root" cat-file -t "refs/tags/$RELEASE_TAG")" = tag ]; then
            git -C "$application_root" for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/release-tag-message.txt"
            export RELEASE_TAG_MESSAGE_FILE="$RUNNER_TEMP/release-tag-message.txt"
          fi
          RELEASE_HEAD_SHA="$(git -C "$application_root" rev-parse 'HEAD^{commit}')" \
          RELEASE_LOCAL_TAG_SHA="$(git -C "$application_root" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" \
            node .seorilabs-workflow-bundle/scripts/release/resolve-release-version.mjs --github-output
          observed="$(grep '^binding_digest=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d = -f 2)"
          [ "$observed" = "$EXPECTED_BINDING_DIGEST" ] || {
            echo "release binding digest가 resolve-binding 값과 다르다: $observed != $EXPECTED_BINDING_DIGEST" >&2
            exit 1
          }

      - name: Verify exact source and safe build paths
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-binding.outputs.application_source_sha }}
          EXECUTION_ROOT: ${{ needs.resolve-binding.outputs.execution_root }}
          DEPENDENCY_ROOT: ${{ needs.resolve-binding.outputs.dependency_root }}
          SCRIPT_PATH: ${{ needs.resolve-binding.outputs.script_path }}
        run: |
          set -euo pipefail
          application_root="$GITHUB_WORKSPACE/.seorilabs-application"
          test "$(git -C "$application_root" rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module - "$application_root" "$EXECUTION_ROOT" "$DEPENDENCY_ROOT" "$SCRIPT_PATH" <<'NODE'
          import { resolveSafeDirectory, resolveSafeFile } from "./.seorilabs-workflow-bundle/scripts/fleet/v5-paths.mjs";
          const [root, executionRoot, dependencyRoot, scriptPath] = process.argv.slice(2);
          await resolveSafeDirectory(root, executionRoot);
          await resolveSafeDirectory(root, dependencyRoot);
          await resolveSafeFile(root, scriptPath);
          NODE
          test -f "$application_root/$EXECUTION_ROOT/build.env"
          node .seorilabs-workflow-bundle/scripts/fleet/secret-scan.mjs "$application_root"

      - name: Validate internal WIF public bindings
        shell: bash
        env:
          PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SUBMITTER: ${{ vars.SEORI_CLOUD_BUILD_SUBMITTER_SERVICE_ACCOUNT }}
          EXECUTOR: ${{ vars.SEORI_CLOUD_BUILD_EXECUTOR_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          expected_provider=projects/321365398093/locations/global/workloadIdentityPools/fleet-p3/providers/github-cloud-build
          expected_submitter=seori-cloud-build-submitter@seorilabs-ci.iam.gserviceaccount.com
          expected_executor=seori-cloud-build-executor@seorilabs-ci.iam.gserviceaccount.com
          missing=""
          if [ "$PROVIDER" != "$expected_provider" ]; then
            missing="$missing GOOGLE_WORKLOAD_IDENTITY_PROVIDER"
          fi
          if [ "$SUBMITTER" != "$expected_submitter" ]; then
            missing="$missing SEORI_CLOUD_BUILD_SUBMITTER_SERVICE_ACCOUNT"
          fi
          if [ "$EXECUTOR" != "$expected_executor" ]; then
            missing="$missing SEORI_CLOUD_BUILD_EXECUTOR_SERVICE_ACCOUNT"
          fi
          if [ -n "$missing" ]; then
            echo "오류 [FLEET_CLOUD_BUILD_WIF_BINDING_UNVERIFIED]" >&2
            echo "계약과 다른 공개 변수:$missing" >&2
            echo "게이트: HUMAN_APPROVAL_REQUIRED" >&2
            echo "작업: FLEET_P3_CLOUD_BUILD_WIF_ACTIVATION" >&2
            echo "필요 권한: organization_owner" >&2
            exit 1
          fi

      - name: Authenticate keylessly for Cloud Build
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SEORI_CLOUD_BUILD_SUBMITTER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup pinned gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 582.0.0
          project_id: seorilabs-ci

      - name: Submit exact source to x64 Cloud Build
        id: build
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-binding.outputs.application_source_sha }}
          WORKING_DIRECTORY: ${{ needs.resolve-binding.outputs.execution_root }}
          CLOUD_BUILD_SERVICE_ACCOUNT: ${{ vars.SEORI_CLOUD_BUILD_EXECUTOR_SERVICE_ACCOUNT }}
          # 태그 실행이 아니면 빈 값이다. 마켓 artifact version 정본은 오직 이 태그 파생값이다.
          RELEASE_TAG: ${{ needs.resolve-binding.outputs.release_tag }}
          RELEASE_VERSION_NAME: ${{ needs.resolve-binding.outputs.release_version_name }}
          RELEASE_VERSION_CODE: ${{ needs.resolve-binding.outputs.release_android_version_code }}
          CONFIG_PATH: ${{ github.workspace }}/.seorilabs-workflow-bundle/.github/cloud-build/godot-android-build-only-v2.yaml
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          artifact_uri="gs://seorilabs-ci-build-artifacts/${GITHUB_REPOSITORY_OWNER}/${repository_name}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          application_root="$GITHUB_WORKSPACE/.seorilabs-application"
          ignore_file="$RUNNER_TEMP/seorilabs-cloud-build.ignore"
          printf '%s\n' '.git' '.git/**' 'gha-creds-*.json' 'node_modules' '**/node_modules/**' > "$ignore_file"
          build_id="$(gcloud builds submit "$application_root" --project=seorilabs-ci --region=asia-northeast3 --config="$CONFIG_PATH" --ignore-file="$ignore_file" --service-account="projects/seorilabs-ci/serviceAccounts/${CLOUD_BUILD_SERVICE_ACCOUNT}" --gcs-source-staging-dir="gs://seorilabs-ci_cloudbuild/workflow-bundle/${GITHUB_REPOSITORY_ID}/${SOURCE_SHA}" --substitutions="_SEORI_SOURCE_SHA=${SOURCE_SHA},_SEORI_WORKING_DIRECTORY=${WORKING_DIRECTORY},_SEORI_ARTIFACT_URI=${artifact_uri},_SEORI_RELEASE_TAG=${RELEASE_TAG},_SEORI_RELEASE_VERSION_NAME=${RELEASE_VERSION_NAME},_SEORI_RELEASE_VERSION_CODE=${RELEASE_VERSION_CODE}" --format='value(id)')"
          [[ "$build_id" =~ ^[0-9a-f-]{36}$ ]]
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "artifact_uri=$artifact_uri" >> "$GITHUB_OUTPUT"

      - name: Fetch the single build-only AAB
        shell: bash
        env:
          ARTIFACT_URI: ${{ steps.build.outputs.artifact_uri }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-aab"
          gcloud storage cp "$ARTIFACT_URI/app-release.aab" "$RUNNER_TEMP/android-aab/app-release.aab"
          test -s "$RUNNER_TEMP/android-aab/app-release.aab"
          test "$(find "$RUNNER_TEMP/android-aab" -type f -name '*.aab' | wc -l | tr -d ' ')" = 1

      # 앱 build script가 태그 파생값을 무시하거나 오래된 build template이 남아 있으면 여기서
      # fail-closed한다. AAB manifest는 aapt.pb.XmlNode이므로 org 정본 parser로 직접 읽는다.
      - name: Verify the built AAB against the release tag
        if: ${{ needs.resolve-binding.outputs.release_mode == 'true' }}
        id: provenance
        shell: bash
        env:
          RELEASE_BINDING_PATH: ${{ runner.temp }}/release-binding.json
        run: |
          set -euo pipefail
          unzip -p "$RUNNER_TEMP/android-aab/app-release.aab" base/manifest/AndroidManifest.xml \
            > "$RUNNER_TEMP/aab-manifest.pb"
          [ -s "$RUNNER_TEMP/aab-manifest.pb" ] || { echo "AAB에서 AndroidManifest.xml을 꺼내지 못함." >&2; exit 1; }
          node .seorilabs-workflow-bundle/scripts/release/verify-release-artifact.mjs \
            --kind android-app-bundle \
            --artifact "$RUNNER_TEMP/android-aab/app-release.aab" \
            --metadata "$RUNNER_TEMP/aab-manifest.pb" \
            --receipt "$RUNNER_TEMP/android-aab/release-artifact-receipt.txt" \
            --github-output

      - name: Write checksum-bound build evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-binding.outputs.application_source_sha }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          BUNDLE_SHA: ${{ needs.resolve-binding.outputs.bundle_sha }}
          BUNDLE_REF: ${{ needs.resolve-binding.outputs.bundle_ref }}
          BUNDLE_DIGEST: ${{ needs.resolve-binding.outputs.workflow_bundle_payload_digest }}
          MANIFEST_DIGEST: ${{ needs.resolve-binding.outputs.manifest_digest }}
          CONFIG_REVISION_ID: ${{ needs.resolve-binding.outputs.config_revision_id }}
          CONFIG_REVISION: ${{ needs.resolve-binding.outputs.config_revision }}
          CONFIG_REVISION_DIGEST: ${{ needs.resolve-binding.outputs.config_revision_digest }}
          SIGNED_SNAPSHOT_DIGEST: ${{ needs.resolve-binding.outputs.signed_snapshot_digest }}
          SNAPSHOT_SIGNATURE_KEY_ID: ${{ needs.resolve-binding.outputs.snapshot_signature_key_id }}
          SNAPSHOT_SIGNATURE_POLICY_REVISION: ${{ needs.resolve-binding.outputs.snapshot_signature_policy_revision }}
          SNAPSHOT_SIGNATURE_DIGEST: ${{ needs.resolve-binding.outputs.snapshot_signature_digest }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CONFIG_PATH: ${{ github.workspace }}/.seorilabs-workflow-bundle/.github/cloud-build/godot-android-build-only-v2.yaml
          RELEASE_TAG: ${{ needs.resolve-binding.outputs.release_tag }}
          RELEASE_VERSION_NAME: ${{ needs.resolve-binding.outputs.release_version_name }}
          RELEASE_VERSION_CODE: ${{ needs.resolve-binding.outputs.release_android_version_code }}
          RELEASE_AUTHORITY_REVISION: ${{ needs.resolve-binding.outputs.release_authority_revision }}
          RELEASE_CONFIG_REVISION: ${{ needs.resolve-binding.outputs.release_config_revision }}
          RELEASE_BINDING_DIGEST: ${{ needs.resolve-binding.outputs.release_binding_digest }}
          BINDING_MODE: ${{ needs.resolve-binding.outputs.binding_mode }}
          BUILDER_IMAGE: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/godot-android-builder@sha256:b2a9d7a849f1193f42a40864d8487401abb6dc54472fe010b31b2e84e7be2940
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum "$RUNNER_TEMP/android-aab/app-release.aab" | cut -d ' ' -f 1)"
          config_sha256="$(sha256sum "$CONFIG_PATH" | cut -d ' ' -f 1)"
          export ARTIFACT_SHA256="sha256:$artifact_sha256"
          export CONFIG_SHA256="sha256:$config_sha256"
          node --input-type=module - <<'NODE'
          import { writeFileSync } from "node:fs";
          const evidence = {
            schemaVersion: 2, target: "build", buildProfile: "godot-android",
            repositoryId: Number(process.env.GITHUB_REPOSITORY_ID), fullName: process.env.GITHUB_REPOSITORY,
            sourceSha: process.env.SOURCE_SHA, bindingSourceSha: process.env.SOURCE_SHA,
            callerWorkflowRef: process.env.CALLER_WORKFLOW_REF, manifestDigest: process.env.MANIFEST_DIGEST,
            bundlePayloadDigest: process.env.BUNDLE_DIGEST, workflowExecutionSha: process.env.BUNDLE_SHA,
            workflowRef: process.env.BUNDLE_REF, runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), configRevisionId: process.env.CONFIG_REVISION_ID,
            configRevision: Number(process.env.CONFIG_REVISION), configRevisionDigest: process.env.CONFIG_REVISION_DIGEST,
            signedSnapshotDigest: process.env.SIGNED_SNAPSHOT_DIGEST,
            snapshotSignatureKeyId: process.env.SNAPSHOT_SIGNATURE_KEY_ID,
            snapshotSignaturePolicyRevision: process.env.SNAPSHOT_SIGNATURE_POLICY_REVISION,
            snapshotSignatureDigest: process.env.SNAPSHOT_SIGNATURE_DIGEST, cloudBuildId: process.env.BUILD_ID,
            builderImage: process.env.BUILDER_IMAGE, cloudBuildConfigSha256: process.env.CONFIG_SHA256,
            artifactSha256: process.env.ARTIFACT_SHA256, marketUpload: false,
            bindingMode: process.env.BINDING_MODE,
            releaseTag: process.env.RELEASE_TAG || null,
            releaseVersionName: process.env.RELEASE_VERSION_NAME || null,
            releaseAndroidVersionCode: process.env.RELEASE_VERSION_CODE
              ? Number(process.env.RELEASE_VERSION_CODE) : null,
            releaseAuthorityRevision: process.env.RELEASE_AUTHORITY_REVISION || null,
            releaseConfigRevision: process.env.RELEASE_CONFIG_REVISION || null,
            releaseBindingDigest: process.env.RELEASE_BINDING_DIGEST || null,
          };
          writeFileSync(process.env.RUNNER_TEMP + "/android-aab/provenance.json", JSON.stringify(evidence, null, 2) + "\n", { mode: 0o644 });
          NODE

      - name: Upload build-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-android-build-only-${{ needs.resolve-binding.outputs.application_source_sha }}
          path: ${{ runner.temp }}/android-aab
          if-no-files-found: error
          retention-days: 3
