# WorkflowBundle v4 shadow path. RPI submits and fetches; x64 Cloud Build builds.
name: RN Android Cloud Build v1

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Backoffice ReleaseCandidate의 exact source SHA"
        required: true
        type: string
      working_directory:
        description: "Backoffice resolved manifest의 작업 경로"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  submit-build-only:
    name: Android Build-only
    if: ${{ github.event.repository.private }}
    runs-on: seorilabs-rpi-arm64
    environment: internal
    timeout-minutes: 55

    steps:
      - name: Validate immutable inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" = "pull_request" ]]; then
            test "$REPOSITORY_ID" = "1250442131" || exit 1
            test "$PR_BASE_REF" = "main" || exit 1
            test "$PR_BASE_SHA" = "$SOURCE_SHA" || exit 1
            test "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" || exit 1
            [[ "$PR_HEAD_REF" =~ ^seori/workflow-bundle-canary/1250442131/[0-9a-f]{12}$ ]] || exit 1
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
            test "$EVENT_REF" = "refs/pull/${PR_NUMBER}/merge" || exit 1
            test "$CALLER_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/android-build-only.yml@refs/pull/${PR_NUMBER}/merge" || exit 1
          else
            test "$EVENT_REF" = "refs/heads/main" || exit 1
            test "$CALLER_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/android-build-only.yml@refs/heads/main" || exit 1
          fi
          [[ "$WORKING_DIRECTORY" =~ ^(\.|[A-Za-z0-9._@-]+(/[A-Za-z0-9._@-]+)*)$ ]]
          if [[ "$WORKING_DIRECTORY" != "." ]]; then
            IFS='/' read -ra path_segments <<< "$WORKING_DIRECTORY"
            for segment in "${path_segments[@]}"; do
              [[ "$segment" != "." && "$segment" != ".." ]]
            done
          fi

      - name: Checkout exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: .seorilabs-application
          persist-credentials: false

      - name: Resolve immutable workflow identity
        id: bundle-identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const repository = identity.workflow_repository;
            const sha = identity.workflow_sha;
            const ref = identity.workflow_ref;
            const expected = "seorilabs/.github/.github/workflows/rn-build-android-cloud-v1.yml@" + sha;
            if (repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(sha ?? "") || ref !== expected) process.exit(1);
            if (process.env.EVENT_NAME === "pull_request" && process.env.PR_HEAD_REF !== "seori/workflow-bundle-canary/1250442131/" + sha.slice(0, 12)) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + repository, "sha=" + sha].join("\n") + "\n");
          '

      - name: Checkout exact bundle source outside application tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.bundle-identity.outputs.repository }}
          ref: ${{ steps.bundle-identity.outputs.sha }}
          path: .seorilabs-workflow-bundle
          persist-credentials: false

      - name: Verify exact source and scan tracked credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          application_root="$GITHUB_WORKSPACE/.seorilabs-application"
          test "$(git -C "$application_root" rev-parse HEAD)" = "$SOURCE_SHA"
          node .seorilabs-workflow-bundle/scripts/fleet/secret-scan.mjs "$application_root"

      - name: Setup pinned Node for private package staging
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          registry-url: https://npm.pkg.github.com
          scope: "@seorilabs"

      - name: Stage exact private Platform SDK without exporting the token
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -c 0
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          application_root="$GITHUB_WORKSPACE/.seorilabs-application"
          store_path="$application_root/.seorilabs-pnpm-store"
          node .seorilabs-workflow-bundle/scripts/fleet/stage-private-pnpm-store.mjs \
            "$application_root" "$store_path"

      - name: Authenticate keylessly for Cloud Build
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SEORI_CLOUD_BUILD_SUBMITTER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup pinned gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 582.0.0
          project_id: seorilabs-ci

      - name: Bind WIF quota project
        shell: bash
        run: gcloud config set billing/quota_project seorilabs-ci

      - name: Submit exact source to x64 Cloud Build
        id: build
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          CLOUD_BUILD_SERVICE_ACCOUNT: ${{ vars.SEORI_CLOUD_BUILD_EXECUTOR_SERVICE_ACCOUNT }}
          CONFIG_PATH: ${{ github.workspace }}/.seorilabs-workflow-bundle/.github/cloud-build/rn-android-build-only.yaml
        run: |
          set -euo pipefail
          [[ "$CLOUD_BUILD_SERVICE_ACCOUNT" =~ ^[A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.iam\.gserviceaccount\.com$ ]]
          repository_name="${GITHUB_REPOSITORY#*/}"
          artifact_uri="gs://seorilabs-ci-build-artifacts/${GITHUB_REPOSITORY_OWNER}/${repository_name}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          application_root="$GITHUB_WORKSPACE/.seorilabs-application"
          ignore_file="$RUNNER_TEMP/seorilabs-cloud-build.ignore"
          printf '%s\n' '.git' '.git/**' 'gha-creds-*.json' 'node_modules' '**/node_modules/**' > "$ignore_file"
          build_id="$(gcloud builds submit "$application_root" \
            --project=seorilabs-ci \
            --region=asia-northeast3 \
            --config="$CONFIG_PATH" \
            --ignore-file="$ignore_file" \
            --service-account="projects/seorilabs-ci/serviceAccounts/${CLOUD_BUILD_SERVICE_ACCOUNT}" \
            --gcs-source-staging-dir="gs://seorilabs-ci_cloudbuild/workflow-bundle/${GITHUB_REPOSITORY_ID}/${SOURCE_SHA}" \
            --substitutions="_SEORI_SOURCE_SHA=${SOURCE_SHA},_SEORI_WORKING_DIRECTORY=${WORKING_DIRECTORY},_SEORI_ARTIFACT_URI=${artifact_uri}" \
            --format='value(id)')"
          [[ "$build_id" =~ ^[0-9a-f-]{36}$ ]]
          {
            echo "build_id=$build_id"
            echo "artifact_uri=$artifact_uri"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the single build-only AAB
        shell: bash
        env:
          ARTIFACT_URI: ${{ steps.build.outputs.artifact_uri }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-aab"
          gcloud storage cp "$ARTIFACT_URI/app-release.aab" "$RUNNER_TEMP/android-aab/app-release.aab"
          test -s "$RUNNER_TEMP/android-aab/app-release.aab"
          test "$(find "$RUNNER_TEMP/android-aab" -type f -name '*.aab' | wc -l | tr -d ' ')" = 1

      - name: Write checksum-bound build provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          BUNDLE_SHA: ${{ steps.bundle-identity.outputs.sha }}
          CONFIG_PATH: ${{ github.workspace }}/.seorilabs-workflow-bundle/.github/cloud-build/rn-android-build-only.yaml
          BUILDER_IMAGE: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder@sha256:ed73c852159547ce3b7e36ef7759a8db25e1b4ac08f1fee4f5eebf7ce2cd2100
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum "$RUNNER_TEMP/android-aab/app-release.aab" | cut -d ' ' -f 1)"
          config_sha256="$(sha256sum "$CONFIG_PATH" | cut -d ' ' -f 1)"
          export ARTIFACT_SHA256="sha256:$artifact_sha256"
          export CONFIG_SHA256="sha256:$config_sha256"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const evidence = {
              schemaVersion: 1,
              profile: "react-native",
              sourceSha: process.env.SOURCE_SHA,
              workflowBundleSourceSha: process.env.BUNDLE_SHA,
              cloudBuildId: process.env.BUILD_ID,
              builderImage: process.env.BUILDER_IMAGE,
              cloudBuildConfigSha256: process.env.CONFIG_SHA256,
              artifactSha256: process.env.ARTIFACT_SHA256,
              marketUpload: false,
            };
            writeFileSync(process.env.RUNNER_TEMP + "/android-aab/provenance.json", JSON.stringify(evidence, null, 2) + "\n", { mode: 0o644 });
          '

      - name: Upload build-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rn-android-build-only-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/android-aab
          if-no-files-found: error
          retention-days: 3
