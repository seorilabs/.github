# Seorilabs org 재사용 워크플로우: 명시적 SemVer 릴리즈 태그 생성과 릴리스 번호 할당
# 호출: uses: seorilabs/.github/.github/workflows/release-tag.yml@<FULL_COMMIT_SHA>
# 원칙: 태그는 사람이 의도적으로 찍는다(merge마다 자동 태깅 금지).
# 태그는 운영자가 고른 exact source commit에만 단다. 빈 마커 커밋을 만들지 않는다.
# Android versionCode는 저장소의 release-version-ledger 브랜치가 lastVersionCode + 1로 할당하고,
# 원장 갱신과 annotated tag 생성은 한 번의 atomic push로 함께 반영되거나 함께 반영되지 않는다.
# 계약: contracts/release-version-authority.yaml, contracts/release-version-ledger.yaml
name: Release Tag (reusable)

on:
  workflow_call:
    inputs:
      target_ref:
        description: "태그를 붙일 ref/SHA (브랜치/태그/커밋). 비우면 main."
        required: false
        default: "main"
        type: string
      tag:
        description: "직접 지정할 SemVer 태그(v1.2.3 또는 1.2.3). 비우면 원장의 마지막 태그 + bump."
        required: false
        default: ""
        type: string
      bump:
        description: "tag 미지정 시 증가 단위 (major/minor/patch)"
        required: false
        default: "patch"
        type: string
      dry_run:
        description: "푸시 없이 계산만"
        required: false
        default: false
        type: boolean
    outputs:
      tag:
        description: "생성/확정된 태그"
        value: ${{ jobs.create.outputs.tag }}
      sha:
        description: "태그가 가리키는 커밋 SHA"
        value: ${{ jobs.create.outputs.sha }}
      created:
        description: "신규 생성 여부 (true/false)"
        value: ${{ jobs.create.outputs.created }}
      android_version_code:
        description: "이 태그에 결속된 Android versionCode"
        value: ${{ jobs.create.outputs.android_version_code }}
      ledger_commit:
        description: "번호를 할당한 원장 커밋 SHA (신규 생성일 때만)"
        value: ${{ jobs.create.outputs.ledger_commit }}

permissions:
  contents: write

# 경합 자원은 target_ref가 아니라 저장소의 원장 하나다. 다만 이건 완화 장치일 뿐이고
# 정확성은 atomic compare-and-swap push가 책임진다(수동 push와 취소된 job은 막지 못한다).
concurrency:
  group: release-version-ledger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create:
    name: Allocate release version and create tag
    # 태그를 push하는 contents:write job은 caller가 러너를 고를 수 없다.
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      created: ${{ steps.tag.outputs.created }}
      android_version_code: ${{ steps.tag.outputs.android_version_code }}
      ledger_commit: ${{ steps.tag.outputs.ledger_commit }}

    env:
      TARGET_REF: ${{ inputs.target_ref || 'main' }}
      TAG_INPUT: ${{ inputs.tag || '' }}
      BUMP: ${{ inputs.bump || 'patch' }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      # hot path는 원장 tip과 대상 태그 ref만 읽는다. 전체 태그를 받아오지 않는다.
      - name: Checkout target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref || 'main' }}
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false

      # 태그 파생값과 receipt는 org 정본 구현 하나만 만든다. caller 저장소 스크립트를 신뢰하지
      # 않기 위해 called workflow identity를 확인하고 그 exact commit SHA로 정본을 받는다.
      - name: Validate called reusable workflow identity
        id: authority
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          EXPECTED_WORKFLOW_PATH: seorilabs/.github/.github/workflows/release-tag.yml
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const expected = process.env.EXPECTED_WORKFLOW_PATH + "@" + identity.workflow_sha;
            if (identity.workflow_repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(identity.workflow_sha ?? "") || identity.workflow_ref !== expected) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + identity.workflow_repository, "sha=" + identity.workflow_sha, "ref=" + identity.workflow_ref].join("\n") + "\n");
          '

      - name: Checkout exact release version authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.authority.outputs.repository }}
          ref: ${{ steps.authority.outputs.sha }}
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Allocate release version and create tag
        id: tag
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_REF: ${{ github.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          JOB_WORKFLOW_REPOSITORY: ${{ steps.authority.outputs.repository }}
          JOB_WORKFLOW_REF: ${{ steps.authority.outputs.ref }}
          JOB_WORKFLOW_SHA: ${{ steps.authority.outputs.sha }}
        run: |
          set -euo pipefail

          LEDGER_BRANCH=release-version-ledger
          LEDGER_FILE=release-version-ledger.json
          LEDGER_TRACKING="refs/remotes/origin/$LEDGER_BRANCH"
          AUTHORITY=.seorilabs-release-authority/scripts/release
          LEDGER_JSON="$RUNNER_TEMP/release-version-ledger.json"

          # 원장 커밋은 작업 트리를 건드리지 않고 plumbing으로 만든다. 저장소 config가 아니라
          # 환경변수로 신원을 준다.
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          if [[ "$TARGET_REF" == -* ]]; then
            echo "target_ref must not start with '-'. Received: $TARGET_REF" >&2; exit 1
          fi
          target_commit="$(git rev-parse --verify "${TARGET_REF}^{commit}")"
          short_sha="$(git rev-parse --short "$target_commit")"

          ledger_tip=""
          read_ledger() {
            if ! git ls-remote --exit-code --heads origin "$LEDGER_BRANCH" >/dev/null 2>&1; then
              echo "ledger-missing: refs/heads/$LEDGER_BRANCH 가 없다." >&2
              echo "init-release-version-ledger.yml 로 먼저 초기화한다. 기준 번호를 추측하지 않는다." >&2
              exit 1
            fi
            git fetch --no-tags --depth=1 --force origin "+refs/heads/$LEDGER_BRANCH:$LEDGER_TRACKING" >/dev/null
            ledger_tip="$(git rev-parse "$LEDGER_TRACKING^{commit}")"
            git show "$ledger_tip:$LEDGER_FILE" > "$LEDGER_JSON"
          }

          read_ledger

          # 태그 이름은 원장의 release.lastTag에서 정한다. 전체 태그 목록을 읽지 않는다.
          tag="$(RELEASE_TAG="$TAG_INPUT" RELEASE_BUMP="$BUMP" \
            node "$AUTHORITY/allocate-release-version.mjs" --ledger-in "$LEDGER_JSON" --print-tag)"

          for attempt in 1 2 3 4 5; do
            # 대상 태그 ref 하나만 조회한다.
            existing_object="$(git ls-remote --refs origin "refs/tags/$tag" | cut -f1)"

            if [ -n "$existing_object" ]; then
              # 이미 있는 태그는 번호를 새로 할당하지 않고 원장도 건드리지 않는다.
              git fetch --no-tags --depth=1 --force origin "+refs/tags/$tag:refs/tags/$tag" >/dev/null
              existing_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
              if [ "$existing_commit" != "$target_commit" ]; then
                echo "tag-reuse-with-different-source: '$tag' 이 다른 commit($existing_commit)을 가리킨다." >&2
                exit 1
              fi
              resolve_args=(--ledger-file "$LEDGER_JSON" --github-output)
              if [ "$(git cat-file -t "refs/tags/$tag")" = tag ]; then
                git for-each-ref --format='%(contents)' "refs/tags/$tag" > "$RUNNER_TEMP/existing-tag-message.txt"
                resolve_args+=(--tag-message-file "$RUNNER_TEMP/existing-tag-message.txt")
              fi
              RELEASE_TAG="$tag" RELEASE_SOURCE_SHA="$target_commit" \
                node "$AUTHORITY/resolve-release-version.mjs" "${resolve_args[@]}" > /dev/null
              echo "Tag '$tag' already points to $target_commit and matches the release binding. Skipping."
              { echo "created=false"; echo "tag=$tag"; echo "sha=$target_commit"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # 신규 할당. 원장의 lastVersionCode + 1이며 상한 전에 fail-closed한다.
            node "$AUTHORITY/allocate-release-version.mjs" \
              --ledger-in "$LEDGER_JSON" \
              --ledger-out "$RUNNER_TEMP/release-version-ledger-next.json" \
              --env-out "$RUNNER_TEMP/release-allocation.env" \
              --tag "$tag" --source-sha "$target_commit" > /dev/null
            # allocate-release-version.mjs만 이 파일을 쓴다. 값은 태그와 정수뿐이다.
            . "$RUNNER_TEMP/release-allocation.env"

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would create $tag at $short_sha (androidVersionCode=$SEORI_ANDROID_VERSION_CODE)"
              { echo "created=false"; echo "tag=$tag"; echo "sha=$target_commit"
                echo "android_version_code=$SEORI_ANDROID_VERSION_CODE"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # receipt에는 방금 할당한 번호가 들어간다. 배포 경로는 이 값을 판독해 쓴다.
            RELEASE_TAG="$tag" RELEASE_SOURCE_SHA="$target_commit" \
              RELEASE_ANDROID_VERSION_CODE="$SEORI_ANDROID_VERSION_CODE" \
              RELEASE_ANDROID_VERSION_CODE_SOURCE="$SEORI_ANDROID_VERSION_CODE_SOURCE" \
              node "$AUTHORITY/resolve-release-version.mjs" \
                --ledger-file "$LEDGER_JSON" \
                --tag-receipt "$RUNNER_TEMP/release-tag-receipt.txt" > /dev/null

            { echo "Release $tag ($short_sha)"; echo; cat "$RUNNER_TEMP/release-tag-receipt.txt"; } \
              > "$RUNNER_TEMP/release-tag-message.txt"
            # 재시도마다 할당 번호가 달라지므로 태그 객체도 다시 만든다. 로컬 ref만 덮어쓴다.
            git tag -f -a "$tag" "$target_commit" -F "$RUNNER_TEMP/release-tag-message.txt"
            tag_object="$(git rev-parse "refs/tags/$tag")"

            blob="$(git hash-object -w "$RUNNER_TEMP/release-version-ledger-next.json")"
            tree="$(printf '100644 blob %s\t%s\n' "$blob" "$LEDGER_FILE" | git mktree)"
            ledger_commit="$(git commit-tree "$tree" -p "$ledger_tip" \
              -m "release-version-ledger: $tag -> $SEORI_ANDROID_VERSION_CODE

          seori-release-ledger: 1
          tag: $tag
          source-sha: $target_commit
          android-version-code: $SEORI_ANDROID_VERSION_CODE
          previous-android-version-code: $SEORI_LEDGER_PREVIOUS_VERSION_CODE")"

            push_log="$RUNNER_TEMP/release-ledger-push-$attempt.txt"
            # 원장 lease는 실제로 읽은 tip에, 태그 lease는 빈 값(= 그 ref가 없어야 함)에 건다.
            # --atomic이라 하나라도 거절되면 아무것도 반영되지 않는다.
            if git push --atomic --porcelain \
                 --force-with-lease="refs/heads/$LEDGER_BRANCH:$ledger_tip" \
                 --force-with-lease="refs/tags/$tag:" \
                 origin \
                 "$ledger_commit:refs/heads/$LEDGER_BRANCH" \
                 "$tag_object:refs/tags/$tag" > "$push_log" 2>&1; then
              # 푸시하려는 태그 객체가 원격과 바이트 동일하면 태그 ref는 [up to date] no-op이 되고
              # lease가 평가되지 않는다. 그 상태로 원장만 전진하면 번호가 이중 증가하므로,
              # 태그가 실제로 새로 만들어졌는지 확인하고 아니면 fail-closed한다.
              if ! awk -F'\t' -v ref="refs/tags/$tag" '$1 == "*" && $2 ~ (":" ref "$")' "$push_log" | grep -q .; then
                cat "$push_log" >&2
                echo "ledger-atomic-push-partial: 원장은 전진했는데 태그가 새로 생성되지 않았다." >&2
                exit 1
              fi
              { echo "created=true"; echo "tag=$tag"; echo "sha=$target_commit"
                echo "android_version_code=$SEORI_ANDROID_VERSION_CODE"
                echo "ledger_commit=$ledger_commit"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # --atomic은 부분 반영을 허용하지 않는다. 그래도 서버 상태를 직접 확인한다.
            remote_ledger="$(git ls-remote origin "refs/heads/$LEDGER_BRANCH" | cut -f1 || true)"
            if [ "$remote_ledger" = "$ledger_commit" ]; then
              cat "$push_log" >&2
              echo "ledger-atomic-push-partial: 원장만 반영됐다. 자동 복구하지 않는다." >&2
              exit 1
            fi

            # 거절 사유를 ref별로 본다. hook 거절 같은 다른 이유를 경합으로 오인하면 안 된다.
            tag_reject="$(awk -F'\t' -v ref="refs/tags/$tag" '$1 == "!" && $2 ~ (":" ref "$") { print $3 }' "$push_log")"
            ledger_reject="$(awk -F'\t' -v ref="refs/heads/$LEDGER_BRANCH" '$1 == "!" && $2 ~ (":" ref "$") { print $3 }' "$push_log")"

            case "$tag_reject" in
              *"stale info"*)
                # 다른 실행이 같은 태그를 먼저 만들었다. 번호를 다시 할당하지 않고 idempotency 판정으로 간다.
                read_ledger
                continue
                ;;
            esac
            case "$ledger_reject" in
              *"stale info"*|*"non-fast-forward"*|*"fetch first"*)
                # 원장 tip이 움직였다. tip과 대상 태그 ref만 다시 읽고 번호를 다시 할당한다.
                sleep "$(( (RANDOM % 3) + 1 ))"
                read_ledger
                continue
                ;;
            esac

            cat "$push_log" >&2
            exit 1
          done

          echo "ledger-allocation-contention: 5회 재시도 후에도 원장 tip을 고정하지 못했다." >&2
          exit 1

      - name: Summary
        shell: bash
        env:
          CREATED: ${{ steps.tag.outputs.created }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
          ANDROID_VERSION_CODE: ${{ steps.tag.outputs.android_version_code }}
          LEDGER_COMMIT: ${{ steps.tag.outputs.ledger_commit }}
        run: |
          { echo "### Release Tag"; echo ""; echo "- created: $CREATED"; echo "- tag: $TAG"; echo "- sha: $SHA"
            echo "- android version code: ${ANDROID_VERSION_CODE:-unchanged}"
            echo "- ledger commit: ${LEDGER_COMMIT:-unchanged}"; } >> "$GITHUB_STEP_SUMMARY"
