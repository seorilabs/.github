# Seorilabs org 재사용 워크플로우: 명시적 SemVer 릴리즈 태그 생성
# 호출: uses: seorilabs/.github/.github/workflows/release-tag.yml@<FULL_COMMIT_SHA>
# 원칙: 태그는 사람이 의도적으로 찍는다(merge마다 자동 태깅 금지).
# 태그는 운영자가 고른 exact source commit에만 단다. 빈 마커 커밋을 만들거나 브랜치를 push하지 않는다.
# 태그 message에는 release binding receipt를 남긴다(contracts/release-version-authority.yaml).
# 백오피스/텔레그램 또는 각 repo의 release-tag.yml caller(workflow_dispatch)에서 호출.
name: Release Tag (reusable)

on:
  workflow_call:
    inputs:
      target_ref:
        description: "태그를 붙일 ref/SHA (브랜치/태그/커밋). 비우면 main."
        required: false
        default: "main"
        type: string
      tag:
        description: "직접 지정할 SemVer 태그(v1.2.3 또는 1.2.3). 비우면 최신 태그 + bump."
        required: false
        default: ""
        type: string
      bump:
        description: "tag 미지정 시 증가 단위 (major/minor/patch)"
        required: false
        default: "patch"
        type: string
      dry_run:
        description: "푸시 없이 계산만"
        required: false
        default: false
        type: boolean
      runs_on:
        description: "실행 러너. seorilabs-rpi-arm64 또는 ubuntu-latest만 허용한다."
        required: false
        default: "seorilabs-rpi-arm64"
        type: string
    outputs:
      tag:
        description: "생성/확정된 태그"
        value: ${{ jobs.create.outputs.tag }}
      sha:
        description: "태그가 가리키는 커밋 SHA"
        value: ${{ jobs.create.outputs.sha }}
      created:
        description: "신규 생성 여부 (true/false)"
        value: ${{ jobs.create.outputs.created }}

permissions:
  contents: write

# 동시 caller(release bot/telegram/manual dispatch)가 같은 ref에 동시 bump 시 race 방지.
concurrency:
  group: release-tag-${{ inputs.target_ref || 'main' }}
  cancel-in-progress: false

jobs:
  create:
    name: Create SemVer release tag
    runs-on: ${{ (inputs.runs_on == 'ubuntu-latest' && 'ubuntu-latest') || 'seorilabs-rpi-arm64' }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      created: ${{ steps.tag.outputs.created }}

    env:
      TARGET_REF: ${{ inputs.target_ref || 'main' }}
      TAG_INPUT: ${{ inputs.tag || '' }}
      BUMP: ${{ inputs.bump || 'patch' }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      # 권한 있는 job의 러너는 caller 입력을 그대로 믿지 않는다. 승인된 라벨만 허용하고,
      # 그 밖의 값은 요청 자체를 실패시킨다(runs-on은 이미 승인 목록으로 축약돼 있다).
      - name: Reject unapproved runner routing
        shell: bash
        env:
          REQUESTED_RUNNER: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          case "$REQUESTED_RUNNER" in
            "seorilabs-rpi-arm64" | "ubuntu-latest") ;;
            *) echo "승인되지 않은 러너 라벨: $REQUESTED_RUNNER" >&2; exit 1 ;;
          esac

      - name: Checkout target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false

      # 태그 파생값과 receipt는 org 정본 구현 하나만 만든다. caller 저장소 스크립트를 신뢰하지
      # 않기 위해 called workflow identity를 확인하고 그 exact commit SHA로 정본을 받는다.
      - name: Validate called reusable workflow identity
        id: authority
        shell: bash
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          EXPECTED_WORKFLOW_PATH: seorilabs/.github/.github/workflows/release-tag.yml
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const identity = JSON.parse(process.env.JOB_CONTEXT_JSON ?? "{}");
            const expected = process.env.EXPECTED_WORKFLOW_PATH + "@" + identity.workflow_sha;
            if (identity.workflow_repository !== "seorilabs/.github" || !/^[0-9a-f]{40}$/.test(identity.workflow_sha ?? "") || identity.workflow_ref !== expected) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, ["repository=" + identity.workflow_repository, "sha=" + identity.workflow_sha, "ref=" + identity.workflow_ref].join("\n") + "\n");
          '

      - name: Checkout exact release version authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.authority.outputs.repository }}
          ref: ${{ steps.authority.outputs.sha }}
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Resolve and create tag
        id: tag
        shell: bash
        env:
          JOB_WORKFLOW_REPOSITORY: ${{ steps.authority.outputs.repository }}
          JOB_WORKFLOW_REF: ${{ steps.authority.outputs.ref }}
          JOB_WORKFLOW_SHA: ${{ steps.authority.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin >/dev/null 2>&1 || true

          if [[ "$TARGET_REF" == -* ]]; then
            echo "target_ref must not start with '-'. Received: $TARGET_REF" >&2; exit 1
          fi

          # 운영자가 고른 exact source commit에만 태그를 단다. 빈 마커 커밋을 만들거나
          # 브랜치를 push하지 않는다 — 태그 대상 commit은 target_ref가 가리키는 그 commit이다.
          target_commit="$(git rev-parse --verify "${TARGET_REF}^{commit}")"
          short_sha="$(git rev-parse --short "$target_commit")"

          normalize_semver() {
            local raw="$1"; local v="${raw#v}"
            if [[ ! "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Tag must be stable SemVer vMAJOR.MINOR.PATCH. Received: $raw" >&2; exit 1
            fi
            echo "v$v"
          }

          if [ -n "$TAG_INPUT" ]; then
            tag="$(normalize_semver "$TAG_INPUT")"
          else
            # 원격 기준 최신 SemVer 태그를 조회(로컬 checkout 누락으로 인한 버전 충돌 방지).
            latest="$(git ls-remote --refs --tags origin 'refs/tags/v*' 2>/dev/null | awk -F/ '{print $NF}' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)"
            if [ -z "$latest" ]; then
              base="0.0.0"
            else
              base="${latest#v}"
            fi
            IFS='.' read -r MA MI PA <<< "$base"
            case "$BUMP" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              patch) PA=$((PA+1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            tag="v${MA}.${MI}.${PA}"
          fi

          tag_ref="refs/tags/$tag"
          if tag_commit="$(git rev-parse -q --verify "$tag_ref^{commit}" 2>/dev/null)"; then
            if [ "$tag_commit" = "$target_commit" ]; then
              echo "Tag '$tag' already points to $target_commit. Skipping."
              { echo "created=false"; echo "tag=$tag"; echo "sha=$target_commit"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag '$tag' already exists for a different commit ($tag_commit)." >&2; exit 1
          fi

          # 태그 message에 release binding receipt를 남긴다. 파생 규칙, 세그먼트 범위 검증,
          # authority 계약 revision은 org 정본 구현이 만들고, 마켓 배포 경로가 같은 구현으로
          # 대조해 같은 태그의 다른 source/계약 재사용을 fail-closed한다.
          receipt_file="$RUNNER_TEMP/release-tag-receipt.txt"
          RELEASE_TAG="$tag" RELEASE_SOURCE_SHA="$target_commit" \
            node .seorilabs-release-authority/scripts/release/resolve-release-version.mjs \
              --tag-receipt "$receipt_file" > /dev/null

          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would create $tag at $short_sha"
            { echo "created=false"; echo "tag=$tag"; echo "sha=$target_commit"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag_message_file="$RUNNER_TEMP/release-tag-message.txt"
          { echo "Release $tag ($short_sha)"; echo; cat "$receipt_file"; } > "$tag_message_file"

          git tag -a "$tag" "$target_commit" -F "$tag_message_file"
          if git push origin "refs/tags/$tag" 2>/tmp/push_err; then
            { echo "created=true"; echo "tag=$tag"; echo "sha=$target_commit"; } >> "$GITHUB_OUTPUT"
          else
            # race: 다른 동시 실행이 같은 태그를 먼저 push했을 수 있음 → 원격 확인 후 idempotent 처리
            ls_out="$(git ls-remote --tags origin "refs/tags/$tag")"
            remote_commit="$(printf '%s\n' "$ls_out" | awk -v t="refs/tags/$tag^{}" '$2==t{print $1}')"
            [ -n "$remote_commit" ] || remote_commit="$(printf '%s\n' "$ls_out" | awk -v t="refs/tags/$tag" '$2==t{print $1}')"
            if [ "$remote_commit" = "$target_commit" ]; then
              echo "Tag '$tag' already on remote at $target_commit (race). Idempotent success."
              { echo "created=false"; echo "tag=$tag"; echo "sha=$target_commit"; } >> "$GITHUB_OUTPUT"
            else
              cat /tmp/push_err >&2
              echo "Failed to push '$tag' (remote points to different commit: ${remote_commit:-unknown})." >&2
              exit 1
            fi
          fi

      - name: Summary
        shell: bash
        env:
          CREATED: ${{ steps.tag.outputs.created }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          { echo "### Release Tag"; echo ""; echo "- created: $CREATED"; echo "- tag: $TAG"; echo "- sha: $SHA"; } >> "$GITHUB_STEP_SUMMARY"
