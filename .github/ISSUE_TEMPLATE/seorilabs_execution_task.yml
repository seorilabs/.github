name: Seorilabs execution task
description: Ticket for scoped Seorilabs work that can be tracked in GitHub Projects.
title: ""
labels:
  - project:seorilabs-exec
body:
  - type: markdown
    attributes:
      value: |
        Use this form for scoped implementation, QA, release-prep, docs, and operations work.
        Planning, implementation design, and release approvals are separate human gates.
        구현 전 docs/design 정본과 정확한 승인 버전을 연결하고, UI 검수는 작성자와 다른 리뷰 에이전트가 담당합니다.
        제목에는 [P1], [BUG], 저장소명, U1/N1 같은 말머리를 붙이지 말고 고객 문제와 해결 후 가치를 적습니다.

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 티켓이 끝났을 때 실제로 달라져야 하는 상태.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 지금 필요한지, 관련 사용자/운영/릴리즈 맥락.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위
      value: |
        포함:
        -

        제외:
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 계획
      value: |
        조건 ID별 TDD 실패·통과 또는 사유·대체 검증:
        UI 검수 1·2·3회 계획·기능·UX·독립 검수자:
        추가 회차의 사전 승인:
        빌드 전·배포 전 E2E — 기존 구현 기능 전체:
        Local:
        CI:
        Runtime/browser/device:
        Store/console/live:
    validations:
      required: true

  - type: textarea
    id: spec_version
    attributes:
      label: Spec / Version Impact
      value: |
        기준 스펙:
        Spec Version:
        Version Impact: none / patch / minor / major
        Migration needed: no / yes
    validations:
      required: true

  - type: textarea
    id: source_of_truth
    attributes:
      label: Source of Truth
      value: |
        Obsidian/Vault:
        Repo docs:
        관련 PR/Issue:
    validations:
      required: true

  - type: textarea
    id: design_approval
    attributes:
      label: 구현 설계와 사람 승인
      value: |
        설계 ID·docs/design 정본:
        승인 문서 커밋·승인자·시각·근거:
        Wiki 목록·관련 티켓·PR:
        문서·운영만의 작업이면 적용 불가 이유:
    validations:
      required: true

  - type: dropdown
    id: planning_approval
    attributes:
      label: Planning approval
      options:
        - Not needed
        - Required
        - Approved
    validations:
      required: true

  - type: dropdown
    id: release_approval
    attributes:
      label: Release approval
      options:
        - Not needed
        - Required
        - Approved
    validations:
      required: true

  - type: textarea
    id: project_fields
    attributes:
      label: Project fields
      value: |
        App/Repo:
        Market:
        Priority:
        Owner:
        Agent:
        Contribution Type:
        Intake State:
        Target:
        Verification: Not run

  - type: textarea
    id: notes
    attributes:
      label: 메모
      description: blocker, 의사결정, follow-up.
