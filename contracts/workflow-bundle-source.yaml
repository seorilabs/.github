schemaVersion: 1
bundleVersion: 4.1.0
repository: seorilabs/.github

quality:
  canonicalScripts:
    - test:core
    - check:architecture
    - check:release
  requiredCanaryGates:
    - static
    - build-only
  secretScan: central-high-confidence-v1
  provenance: source-and-workflow-sha-v1
  canaries:
    react-native:
      repositoryId: 1250442131
      fullName: seorilabs/happy-farm
    godot:
      repositoryId: 1265192029
      fullName: seorilabs/lizard-tycoon

reusableWorkflows:
  react-native:
    path: .github/workflows/rn-static-checks-v2.yml
    requiredCheck: Org Contract / Org Contract
  godot:
    path: .github/workflows/godot-checks-v2.yml
    requiredCheck: Org Contract / Org Contract

buildWorkflows:
  react-native:
    path: .github/workflows/rn-build-android-cloud-v1.yml
    platform: android
    mode: build-only
    runner: seorilabs-rpi-arm64
    executor: cloud-build-x64
    artifact: android-aab
  godot:
    path: .github/workflows/godot-build-android-cloud-v1.yml
    platform: android
    mode: build-only
    runner: seorilabs-rpi-arm64
    executor: cloud-build-x64
    artifact: android-aab

actions:
  checkout:
    ref: v7
    sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
  setup-node:
    ref: v7
    sha: 820762786026740c76f36085b0efc47a31fe5020
  upload-artifact:
    ref: v7
    sha: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
  google-auth:
    ref: v3
    sha: 7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
  setup-gcloud:
    ref: v3
    sha: aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

runners:
  privateGeneral: seorilabs-rpi-arm64
  privateGeneralImage: registry.vzyx.xyz/seorilabs/arc-runner-node24@sha256:4663a0066aa61f05006af285f2d5bcf95855fd9e8256c44c08c9e32ff92ac45e
  publicPullRequest: ubuntu-latest
  androidSubmit: seorilabs-rpi-arm64
  androidSubmitImage: registry.vzyx.xyz/seorilabs/arc-runner-node24@sha256:4663a0066aa61f05006af285f2d5bcf95855fd9e8256c44c08c9e32ff92ac45e

toolchains:
  node: 24.16.0
  pnpm: 11.3.0
  gcloud: 582.0.0
  godot:
    version: 4.7.2
    status: stable
    linuxArm64Sha256: 5dd0d86405cf7e8adf79fb6377b38ba682a2846cb378ffe5364f38c01ad29b9d
    linuxX64Sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

callerPolicies:
  static:
    events:
      - pull_request
      - push-main
      - workflow_dispatch
    permissions:
      contents: read
      packages: read
    namedSecrets: []
    concurrency: org-contract-${{ github.repository_id }}-${{ github.ref }}
  androidBuild:
    events:
      - workflow_dispatch
    sourceBinding: backoffice-resolved-manifest
    managedCallerPath: .github/workflows/android-build-only.yml
    requiredRef: refs/heads/main
    permissions:
      react-native:
        contents: read
        id-token: write
        packages: read
      godot:
        contents: read
        id-token: write
    namedSecrets: []
    concurrency: android-build-${{ github.repository_id }}-<resolved-source-sha>
  iosBuild:
    transport: app-store-connect-api
    githubWorkflow: forbidden
    namedSecrets: []

delivery:
  android:
    submitRunner: seorilabs-rpi-arm64
    executor: cloud-build-x64
    project: seorilabs-ci
    region: asia-northeast3
    artifactBucket: gs://seorilabs-ci-build-artifacts
    sourceBinding: exact-sha
    marketUpload: false
    builderImages:
      react-native: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder@sha256:ed73c852159547ce3b7e36ef7759a8db25e1b4ac08f1fee4f5eebf7ce2cd2100
      godot: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/godot-android-builder@sha256:b2a9d7a849f1193f42a40864d8487401abb6dc54472fe010b31b2e84e7be2940
  ios:
    executor: xcode-cloud
    trigger: app-store-connect-api
    githubMacosAllowed: false
    marketUpload: false
    requiredScripts:
      react-native:
        - apps/mobile/ios/ci_scripts/ci_post_clone.sh
        - apps/mobile/ios/ci_scripts/ci_pre_xcodebuild.sh
      godot:
        - ios/ci_scripts/ci_post_clone.sh
        - ios/ci_scripts/ci_pre_xcodebuild.sh

rollout:
  mode: SHADOW
  ruleset: EVALUATE
  legacyConsumersPreserved: true

platformGate:
  static:
    mode: SHADOW
    ruleset: EVALUATE
    requiredReadbacks:
      - signed-fleet-approved-manifest
      - backoffice-observation
  release:
    mode: FAIL_CLOSED
    receiptContract: platform-release-gate-v1
    maxAgeSeconds: 300
    requiredReadbacks:
      - signed-fleet-approved-manifest
      - backoffice-observation

approval:
  state: CANDIDATE
  requiredCanaries:
    - react-native
    - godot
