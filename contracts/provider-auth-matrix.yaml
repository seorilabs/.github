schemaVersion: 1
id: seorilabs-provider-auth-matrix
strategyPriority:
  - API_WIF
  - BROWSER_SESSION
  - BOT_PASSWORD_TOTP
  - HUMAN_REAUTH
prohibitedInteractiveFactors:
  - PERSONAL_ACCOUNT_PASSWORD_TOTP
  - PASSKEY
  - SMS
  - PUSH
  - TRUSTED_DEVICE
  - CAPTCHA
  - RECOVERY
  - TERMS_OR_ACCOUNT_ACCEPTANCE
providers:
  - id: github
    origins:
      - https://api.github.com
      - https://github.com
    capabilities:
      - id: repository-observation
        actionClass: READ_ONLY
        approval: PREAPPROVED
        strategies:
          - kind: API_WIF
            availability: BLOCKED
            accountKind: SERVICE_IDENTITY
            credentialLogicalIds:
              - shared/github/backoffice-app-private-key
            unattended: false
            allowTotp: false
          - kind: HUMAN_REAUTH
            availability: HUMAN_ONLY
            accountKind: HUMAN
            credentialLogicalIds: []
            unattended: false
            allowTotp: false
      - id: repository-bootstrap-mutation
        actionClass: CONFIG_WRITE
        approval: PER_RUN
        strategies:
          - kind: API_WIF
            availability: BLOCKED
            accountKind: SERVICE_IDENTITY
            credentialLogicalIds:
              - shared/github/backoffice-app-private-key
            unattended: false
            allowTotp: false
          - kind: HUMAN_REAUTH
            availability: HUMAN_ONLY
            accountKind: HUMAN
            credentialLogicalIds: []
            unattended: false
            allowTotp: false
      - id: organization-owner-settings
        actionClass: PROTECTED
        approval: HUMAN_ONLY
        strategies:
          - kind: HUMAN_REAUTH
            availability: HUMAN_ONLY
            accountKind: HUMAN
            credentialLogicalIds: []
            unattended: false
            allowTotp: false
    humanOnlyActions:
      - app-permission-change
      - installation-acceptance
      - package-visibility-change
      - organization-ruleset-change
      - immutable-release-policy-change

