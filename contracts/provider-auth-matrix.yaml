        actionClass: READ_ONLY
        approval: PREAPPROVED
        strategies:
          - kind: API_WIF
            availability: ACTIVE
            accountKind: SERVICE_IDENTITY
            credentialLogicalIds:
              - shared/gcp/provisioner-session
            unattended: true
            allowTotp: false
          - kind: HUMAN_REAUTH
            availability: HUMAN_ONLY
            accountKind: HUMAN
            credentialLogicalIds: []
            unattended: false
            allowTotp: false
      - id: project-blueprint-apply
        actionClass: CONFIG_WRITE
        approval: PER_RUN
        strategies:
          - kind: API_WIF
            availability: BLOCKED
            accountKind: SERVICE_IDENTITY
            credentialLogicalIds:
              - shared/gcp/provisioner-session
            unattended: false
            allowTotp: false
          - kind: HUMAN_REAUTH
            availability: HUMAN_ONLY
            accountKind: HUMAN
            credentialLogicalIds: []
            unattended: false
            allowTotp: false
    humanOnlyActions:
      - billing-account-change
      - service-account-key-change
      - organization-iam-owner-change

