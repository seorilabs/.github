schemaVersion: 2
bundleVersion: 5.0.0
repository: seorilabs/.github

quality:
  jsCanonicalScripts:
    - test:core
    - check:architecture
    - check:release
  godotCanonicalChecks:
    - public-lock-audit-or-no-managed-dependencies
    - headless-import
    - diagnostic-gate
    - test:core
    - check:architecture
    - check:release
  secretScan: central-high-confidence-v1
  provenance: isolated-application-source-runtime-config-snapshot-and-called-workflow-sha-v4

# 승인 범위는 살아있는 소비자가 있는 프로필만 담는다. 필수 증거 목록이 이 값에서
# 파생되므로, 여기에 남은 프로필은 번들이 바뀔 때마다 증거를 다시 요구한다.
# ait-web은 그 프로필을 쓰는 저장소가 모두 폐기돼 범위에서 뺀다. 새 AIT 웹 앱이
# 생기면 그때 다시 넣고 증거를 붙인다.
promotionScope:
  staticProfiles:
    - react-native
    - godot
    - capacitor
  buildProfiles:
    - react-native-android
    - godot-android

staticRuntimeBinding:
  origin: https://backoffice.vzyx.xyz
  endpoint: /api/control-plane/apps/{repositoryId}/resolved-manifest
  authentication: github-oidc
  audience: seorilabs-control-plane
  sourceStrategy: event-sha-with-pr-base-binding
  prPolicy: trusted-github-pr-readback-required
  identity:
    callerWorkflowRef: github.workflow_ref
    calledWorkflowRef: job.workflow_ref
    calledWorkflowSha: job.workflow_sha
    calledWorkflowRepository: job.workflow_repository
  calledWorkflows:
    jsStatic:
      path: .github/workflows/js-static-checks-v1.yml
      profiles:
        - react-native
        - capacitor
        - ait-web
      packageManagers:
        - npm
        - pnpm
    godot:
      path: .github/workflows/godot-checks-v3.yml
      profiles:
        - godot
      packageManagers:
        - null

buildRuntimeBinding:
  origin: https://backoffice.vzyx.xyz
  endpoint: /api/control-plane/apps/{repositoryId}/resolved-manifest
  authentication: github-oidc
  audience: seorilabs-control-plane
  sourceStrategy: exact-main-or-fixed-canary-pr-base-or-exact-release-tag
  candidatePolicy: fixed-repository-workflow-sha-and-plan-identity
  candidateBranchTemplate: seori/workflow-bundle-v5-canary/{repositoryId}/{workflowSha12}/{planIdentity}
  identity:
    callerWorkflowRef: github.workflow_ref
    calledWorkflowRef: job.workflow_ref
    calledWorkflowSha: job.workflow_sha
    calledWorkflowRepository: job.workflow_repository
  calledWorkflows:
    reactNativeAndroid:
      path: .github/workflows/rn-build-android-cloud-v2.yml
      profile: react-native-android
      packageManager: pnpm
    godotAndroid:
      path: .github/workflows/godot-build-android-cloud-v2.yml
      profile: godot-android
      packageManager: null
    aitGranite:
      path: .github/workflows/ait-build-only-v1.yml
      profile: ait-granite
      packageManager: pnpm
    aitWeb:
      path: .github/workflows/ait-build-only-v1.yml
      profile: ait-web
      packageManager: npm

staticProfiles:
  react-native:
    path: .github/workflows/js-static-checks-v1.yml
    runtime: react-native
  godot:
    path: .github/workflows/godot-checks-v3.yml
    runtime: godot
  capacitor:
    path: .github/workflows/js-static-checks-v1.yml
    runtime: capacitor
  ait-web:
    path: .github/workflows/js-static-checks-v1.yml
    runtime: ait-web

buildProfiles:
  react-native-android:
    target: android
    executor: cloud-build-x64
    workflow: .github/workflows/rn-build-android-cloud-v2.yml
    artifactKind: android-aab
    scriptPath: scripts/build-android.sh
    builderImage: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder@sha256:ed73c852159547ce3b7e36ef7759a8db25e1b4ac08f1fee4f5eebf7ce2cd2100
  godot-android:
    target: android
    executor: cloud-build-x64
    workflow: .github/workflows/godot-build-android-cloud-v2.yml
    artifactKind: android-aab
    scriptPath: scripts/build-android.sh
    builderImage: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/godot-android-builder@sha256:b2a9d7a849f1193f42a40864d8487401abb6dc54472fe010b31b2e84e7be2940
  capacitor-android:
    target: android
    executor: cloud-build-x64
    workflow: .github/workflows/capacitor-build-android-cloud-v1.yml
    artifactKind: android-aab
    scriptPath: scripts/build-android.sh
    builderImage: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder@sha256:ed73c852159547ce3b7e36ef7759a8db25e1b4ac08f1fee4f5eebf7ce2cd2100
  capacitor-ios-xcode-cloud:
    target: ios
    executor: xcode-cloud
    workflow: null
    artifactKind: xcode-archive
    scriptPath: ci_scripts/ci_post_clone.sh
  ait-granite:
    target: ait
    executor: github-actions
    workflow: .github/workflows/ait-build-only-v1.yml
    artifactKind: ait
    scriptPath: scripts/build-ait.sh
    repositoryVisibility:
      - private
      - public
    runnerPolicy:
      private: seorilabs-rpi-arm64
      public: ubuntu-latest
    publicExecutionPolicy:
      pullRequest: forbidden
      promotionState: CANDIDATE
      runtimeState: RUNTIME_NOT_OPERATIONAL
      events:
        - push-stable-tag
        - workflow-dispatch-stable-tag
      versionAuthority: release-version-authority-v1
      sourceBinding: exact-peeled-tag-commit
      blockers:
        - BACKOFFICE_PUBLIC_GITHUB_HOSTED_AIT_BINDING_REQUIRED
        - PUBLIC_AIT_GITHUB_CANARY_EVIDENCE_REQUIRED
    marketUpload:
      includedInBuild: false
      workflow: .github/workflows/ait-upload-v1.yml
      promotionState: CANDIDATE
      runtimeState: RUNTIME_NOT_OPERATIONAL
      transport: seori-auth-broker-trusted-adapter
      sameParentRunNeeds: ait-build
      artifactBinding: checksum-provenance-required
      environment: apps-in-toss
      environmentBootstrap: REQUIRED
      approval: environment-protection-required
      namedSecrets: []
  ait-web:
    target: ait
    executor: github-actions
    workflow: .github/workflows/ait-build-only-v1.yml
    artifactKind: ait
    scriptPath: scripts/build-ait.sh
    repositoryVisibility:
      - private
      - public
    runnerPolicy:
      private: seorilabs-rpi-arm64
      public: ubuntu-latest
    publicExecutionPolicy:
      pullRequest: forbidden
      promotionState: CANDIDATE
      runtimeState: RUNTIME_NOT_OPERATIONAL
      events:
        - push-stable-tag
        - workflow-dispatch-stable-tag
      versionAuthority: release-version-authority-v1
      sourceBinding: exact-peeled-tag-commit
      blockers:
        - BACKOFFICE_PUBLIC_GITHUB_HOSTED_AIT_BINDING_REQUIRED
        - PUBLIC_AIT_GITHUB_CANARY_EVIDENCE_REQUIRED
    marketUpload:
      includedInBuild: false
      workflow: .github/workflows/ait-upload-v1.yml
      promotionState: CANDIDATE
      runtimeState: RUNTIME_NOT_OPERATIONAL
      transport: seori-auth-broker-trusted-adapter
      sameParentRunNeeds: ait-build
      artifactBinding: checksum-provenance-required
      environment: apps-in-toss
      environmentBootstrap: REQUIRED
      approval: environment-protection-required
      namedSecrets: []

actions:
  checkout:
    ref: v7.0.1
    sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
  setup-node:
    ref: v7.0.0
    sha: 820762786026740c76f36085b0efc47a31fe5020
  upload-artifact:
    ref: v7.0.1
    sha: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
  download-artifact:
    ref: v8.0.1
    sha: 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
  google-auth:
    ref: v3.0.0
    sha: 7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
  setup-gcloud:
    ref: v3.0.1
    sha: aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

runners:
  privateGeneral: seorilabs-rpi-arm64
  privateGeneralImage: registry.vzyx.xyz/seorilabs/arc-runner-node24@sha256:4663a0066aa61f05006af285f2d5bcf95855fd9e8256c44c08c9e32ff92ac45e
  public: ubuntu-latest
  androidSubmit: seorilabs-rpi-arm64

toolchains:
  node: 24.16.0
  npm: 11.13.0
  pnpm: 11.3.0
  godot: 4.7.2
  gcloud: 582.0.0

callerPolicies:
  static:
    managedCallerPath: .github/workflows/org-contract.yml
    events:
      - pull_request
      - push-main
      - workflow_dispatch
    permissions:
      contents: read
      id-token: write
      packages: read
    namedSecrets: []
  android:
    managedCallerPath: .github/workflows/android-build-only.yml
    events:
      - workflow_dispatch
    permissions:
      contents: read
      id-token: write
      packages: read
    namedSecrets: []
  ait:
    managedCallerPath: .github/workflows/ait-build-only.yml
    events:
      - push-stable-tag
      - workflow-dispatch-stable-tag
    permissions:
      contents: read
      id-token: write
      packages: read
    namedSecrets: []
  ios:
    githubWorkflow: forbidden
    transport: app-store-connect-api
    namedSecrets: []

lifecyclePolicy:
  ACTIVE: ENFORCE
  PAUSED: SHADOW
  DEPRECATED: NO_CALLER

approval:
  state: CANDIDATE
  evidence: []
