schemaVersion: 1
id: org-v1
defaultBranch: main

pullRequest:
  state: ready
  language: ko
  mergeMethod: squash
  linkedTicketRequired: true
  acceptanceCriteriaRequired: true

stages:
  - id: second-opinion
    order: 1
    provider: codex
    mode: advisory
    trigger: mention
    optional: true
    allowedWhen:
      - security-sensitive-change
      - large-change
      - author-request
    threadResolutionRequired: true
  - id: required-checks
    order: 2
    allRequired: true

mergeGate:
  codeReviewThreadsResolved: true
  requiredChecksPassed: true
  humanApproval: conditional
  humanApprovalConditions:
    - repository-ruleset
    - destructive-change
    - production-or-market-action
    - product-decision
