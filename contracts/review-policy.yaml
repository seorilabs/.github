schemaVersion: 1
id: org-v1
defaultBranch: main

pullRequest:
  state: ready
  language: ko
  mergeMethod: squash
  linkedTicketRequired: true
  acceptanceCriteriaRequired: true
  splitReviewAboveChangedLines: 1500

changedLines:
  excludes:
    - docs
    - translations
    - assets
    - generated-files
    - lock-files

requestObligation:
  requiredForApplicableStage: true
  reviewResultCountsAsApproval: false
  resultUnavailableRequiresRecordedReason: true
  skipWhen:
    - docs-only-change
    - translations-only-change
    - assets-only-change
    - generated-file-only-change
    - release-metadata-only-change

reviewFailures:
  diagnoseBeforeRetry: true
  maxRerunsPerRound: 1
  otherError:
    maxRetries: 1
  usageLimit:
    retry: no-automatic-retry
  workingTreeChangedByReviewer:
    retry: once-after-revert
  unavailable:
    recordReasonInPr: true
    proceedWithSelfReview: true
    requestOtherProvider: false
  changePaidUsageBudget: false

reviewRounds:
  maxRoundsPerPr: 2
  findingAcceptance: concrete-failure-scenario-in-scope
  rejectedFindingHandling: drop-without-reply
  verificationRound:
    when: accepted-fix-added-logic
    scope: changes-since-first-review
    includeFirstRoundFindings: true
  afterVerificationRound: no-review-run
  escalateWhen: same-area-defect-after-verification-round

stages:
  - id: local-model-review
    order: 1
    provider: minimax
    tool: mcode
    model: MiniMax-M3.1-Flash
    mode: advisory
    trigger: local-headless
    runner: author-agent
    input: author-generated-diff
    readOnly: true
    optional: false
    countsAsApproval: false
    blocking: false
    resultPostedToPr: false
    beforePullRequestReady: true
    reviewedHead: final-head-after-ci-and-self-check
    headChangedAfterReview: verification-round-on-changes-since-reviewed-head
    allowedWhen:
      - code-change
      - configuration-logic-change
    skipWhen:
      - docs-only-change
      - translations-only-change
      - assets-only-change
      - generated-file-only-change
      - release-metadata-only-change
  - id: required-checks
    order: 2
    allRequired: true

mergeGate:
  codeReviewThreadsResolved: true
  localReviewFindingsHandled: true
  requiredChecksPassed: true
  humanApproval: conditional
  humanApprovalConditions:
    - repository-ruleset
    - destructive-change
    - production-or-market-action
    - product-decision
