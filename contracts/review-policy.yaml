schemaVersion: 1
id: org-v1
defaultBranch: main

pullRequest:
  state: ready
  language: ko
  mergeMethod: squash
  linkedTicketRequired: true
  acceptanceCriteriaRequired: true

stages:
  - id: assisted-review
    order: 1
    provider: copilot
    mode: advisory
    trigger: review-request
    reviewer: "copilot-pull-request-reviewer[bot]"
    optional: true
    countsAsApproval: false
    blocking: false
    allowedWhen:
      - code-change
      - author-request
    skipWhen:
      - docs-only-change
      - generated-file-only-change
      - cross-model-review-eligible
    threadResolutionRequired: true
  - id: cross-model-review
    order: 1
    mode: advisory
    optional: true
    countsAsApproval: false
    blocking: false
    allowedWhen:
      - security-sensitive-change
      - data-format-change
      - large-code-change
    largeCodeChange:
      minChangedLines: 500
      excludes:
        - docs
        - translations
        - assets
        - generated-files
        - lock-files
    reviewers:
      - authors:
          - claude-local
          - claude-cloud
        provider: codex
        trigger: mention
        request: "@codex review"
        securityRequest: "@codex security review"
        reviewer: "chatgpt-codex-connector[bot]"
        threadResolutionRequired: true
      - authors:
          - codex-local
        provider: claude
        trigger: local-headless
        input: author-generated-diff
        readOnly: true
        resultPostedBy: author
    fallback:
      stage: assisted-review
      unavailableAuthors:
        - codex-cloud
      when:
        - reviewer-unavailable
        - usage-limit
      recordReason: true
      securitySensitiveRequiresHumanDecision: true
  - id: required-checks
    order: 2
    allRequired: true

mergeGate:
  codeReviewThreadsResolved: true
  requiredChecksPassed: true
  humanApproval: conditional
  humanApprovalConditions:
    - repository-ruleset
    - destructive-change
    - production-or-market-action
    - product-decision
