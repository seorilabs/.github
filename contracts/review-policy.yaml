schemaVersion: 1
id: org-v1
defaultBranch: main

pullRequest:
  state: ready
  language: ko
  mergeMethod: squash
  linkedTicketRequired: true
  acceptanceCriteriaRequired: true

stages:
  - id: assisted-review
    order: 1
    provider: copilot
    mode: advisory
    trigger: review-request
    reviewer: "copilot-pull-request-reviewer[bot]"
    optional: true
    countsAsApproval: false
    blocking: false
    allowedWhen:
      - code-change
      - author-request
    skipWhen:
      - docs-only-change
      - generated-file-only-change
    threadResolutionRequired: true
  - id: required-checks
    order: 2
    allRequired: true

mergeGate:
  codeReviewThreadsResolved: true
  requiredChecksPassed: true
  humanApproval: conditional
  humanApprovalConditions:
    - repository-ruleset
    - destructive-change
    - production-or-market-action
    - product-decision
