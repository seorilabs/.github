schemaVersion: 1
id: org-v1
defaultBranch: main

pullRequest:
  state: ready
  language: ko
  mergeMethod: squash
  linkedTicketRequired: true
  acceptanceCriteriaRequired: true

stages:
  - id: seori-acceptance-guide
    order: 1
    provider: seori-review
    mode: first-turn
    role: acceptance-criteria-guide
    countsAsCodeReview: false
    countsAsApproval: false
    threadResolutionRequired: true
  - id: code-review
    order: 2
    provider: jansoree
    mode: advisory
    trigger: automatic-first-turn
    summaryCommentRequired: true
    countsAsApproval: false
    blocking: false
    threadResolutionRequired: true
  - id: second-opinion
    order: 3
    provider: codex
    mode: advisory
    trigger: mention
    optional: true
    allowedWhen:
      - security-sensitive-change
      - large-change
      - author-request
    threadResolutionRequired: true
  - id: required-checks
    order: 4
    allRequired: true

mergeGate:
  seoriGuideThreadsResolved: true
  jansoreeSummaryPresent: true
  codeReviewThreadsResolved: true
  requiredChecksPassed: true
  humanApproval: conditional
  humanApprovalConditions:
    - repository-ruleset
    - destructive-change
    - production-or-market-action
    - product-decision
