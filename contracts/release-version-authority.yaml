# GitHub release tag를 모든 지원 마켓 artifact의 display/marketing version 정본으로 고정하고,
# 플랫폼 릴리스 번호의 정본을 저장소별 원장으로 분리하는 기계 판독 계약이다.
# 이 파일은 정본이며 문서와 충돌하면 이 파일이 우선한다.
#
# schemaVersion 3: Android versionCode의 정본을 태그 파생 공식에서 저장소별
# release-version-ledger 브랜치의 순차 할당으로 바꿨다. 같은 태그라도 저장소마다 다른 번호를
# 가질 수 있으므로 본문 해석 규칙 자체가 달라진다. id는 authority의 정체성이라 바꾸지 않고
# schemaVersion만 올린다. schemaVersion 2 이하로 찍힌 tag receipt는
# supersededAuthorityRevisions로 판독만 허용하며, 그 revision이 쓰던 공식으로 값을 다시
# 계산해 exact match할 때만 통과시킨다.
#
# 원장의 운영 규칙(브랜치 형태, CAS 프로토콜, 재시도, 초기화, 보호, 감사)은
# contracts/release-version-ledger.yaml에 있다. 이 파일은 annotated tag receipt에 sha256으로
# 박히므로, 운영 파라미터 조정이 기존 receipt를 무효화하지 않도록 분리했다. 두 파일의 결속은
# binding.configRevision의 calledWorkflowSha가 이미 덮는다.
schemaVersion: 3
id: release-version-authority-v1
ledgerContract: release-version-ledger-v1

authority:
  source: github-release-tag-and-repository-ledger
  tagPattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  # 태그는 exact stable SemVer만 허용한다. prerelease/build metadata는 마켓 artifact를 만들지 않는다.
  prereleaseAllowed: false
  # 태그가 가리키는 commit만 build한다. branch 동명 ref, 이동된 tag, stale local tag는 거부한다.
  buildsExactTagCommit: true
  # 태그 선택은 실행 이벤트에 묶인다. refs/tags 실행은 그 태그가 곧 정본이라 저장소에 더 최신
  # 태그가 있어도 폴백하지 않는다. 최신 태그 폴백은 운영자가 시작한 dispatch에서만 허용하며,
  # 폴백 기준은 전체 태그 나열이 아니라 원장 tip의 release.lastTag 하나다.
  tagSelection:
    eventTagRef: pinned-to-event-ref-and-event-sha
    latestStableFallback: repository-ledger-last-tag
    sources: [event-tag-ref, requested-tag, ledger-last-tag]
    fullTagEnumeration: forbidden-on-hot-path

# 아래 값들은 authority가 아니다. 읽어서 버전을 결정하지 않으며, artifact readback에서
# binding 값과 다르면 fail-closed한다.
forbiddenAuthorities:
  - id: package-json-version
    locations: ["package.json#version", "apps/*/package.json#version"]
  - id: gradle-version
    locations: ["android/app/build.gradle#versionName", "android/app/build.gradle#versionCode"]
  - id: xcode-version
    locations: ["*.xcodeproj#MARKETING_VERSION", "*.xcodeproj#CURRENT_PROJECT_VERSION", "Info.plist#CFBundleShortVersionString"]
  - id: godot-project-version
    locations: ["project.godot#config/version", "export_presets.cfg#version/name", "export_presets.cfg#version/code"]
  - id: granite-config-version
    locations: ["granite.config.ts#version", "apps/ait/package.json#version"]
  - id: market-config-json-version
    locations: ["play-store/google-play.config.json#release.versionName", "play-store/google-play.config.json#release.versionCode", "app-store/app-store.config.json#release.version"]
  - id: repository-local-release-version-resolver
    locations: ["scripts/resolve-release-version.mjs"]
  - id: workflow-caller-version-input
    locations: ["workflow_call.inputs.version_name", "workflow_call.inputs.version_code", "workflow_call.inputs.version_script"]
  - id: non-deterministic-build-counter
    locations: ["github.run_number", "github.run_id", "wall-clock"]
    # Xcode Cloud의 CI_BUILD_NUMBER는 여기 해당하지 않는다. Apple이 workflow별로 발급하고
    # App Store Connect가 build 식별자로 되읽는 값이라 appleBuildNumberExceptions로 분리한다.
    exceptions: [xcode-cloud-ci-build-number]

derivation:
  # v prefix를 제거한 값이 display/marketing version이다. 태그 하나가 유일한 정본이다.
  displayVersion: tag-without-v-prefix
  marketingVersion: tag-without-v-prefix
  releaseName: display-version
  # Android versionCode는 더 이상 태그에서 파생하지 않는다. allocation.android를 따른다.
  androidVersionCode: repository-ledger-allocated
  # Apple build number의 기본 정본(비 Xcode Cloud 경로). 여전히 태그 하나가 정한다.
  appleBuildNumber: encoded-version
  # Android/iOS 런타임이 공유하는 최소지원버전 비교값. 마켓 versionCode가 아니다.
  # 이미 배포된 앱이 이 숫자로 비교하므로 값을 바꾸지 않는다.
  runtimeVersionCode: legacy-android-version-code-formula
  # SemVer를 base-1000 정수로 인코딩하는 공식. 이 파일에서 여기 한 번만 선언한다.
  encodedVersion:
    segmentBase: 1000
    formula: 'major * 1000000 + minor * 1000 + patch'
    bounds:
      majorMax: 1099
      minorMax: 999
      patchMax: 999
      # encodedVersion은 1 이상이어야 한다. v0.0.0은 0이라 어떤 마켓 artifact도 만들 수 없으므로
      # 태그 생성과 배포 양쪽에서 거부한다.
      min: 1
      max: 2100000000

# 릴리스 번호 할당. 공통 태그와 표시 버전은 함께 두고 플랫폼 번호는 분리한다.
allocation:
  marketingVersion:
    authority: release-tag
    rule: tag-without-v-prefix
  android:
    authority: repository-ledger-sequential
    ledgerField: android.lastVersionCode
    newTagRule: last-version-code-plus-one
    step: 1
    # 신규 앱은 baseline 0에서 시작해 첫 할당이 1이다. Google Play의 과도하게 높은 최초
    # versionCode 경고를 만들지 않는다. 기존 앱은 검증된 마지막 번호가 baseline이다.
    newRepositoryBaseline: 0
    firstAllocatedVersionCode: 1
    sharedCounterWithIos: false
    bounds:
      min: 1
      max: 2100000000
    onExhaustion: fail-closed
    failClosed: android-version-code-exhausted
  ios:
    authority: xcode-cloud-ci-build-number
    marketingVersion: release-tag
    ledgerAllocation: false
    observationOnly: true
  # 할당은 태그 생성 경로에서만 일어난다. 배포 경로는 재계산하지 않고 receipt를 판독한다.
  # 원장 tip은 새 태그마다 전진하므로, 옛 태그 재배포가 원장에서 번호를 다시 얻으면 다른 값이 나온다.
  performedBy: release-tag-workflow-only
  deploymentPathRecomputation: forbidden
  deploymentPathSource: tag-receipt-then-legacy-derivation
  # 플랫폼 한쪽의 재빌드나 실패가 다른 플랫폼 번호를 소비하지 않는다.
  platformIsolation: required
  androidVersionCodeSources: [github-ledger, legacy-tag-formula]

# Apple build number 정본의 실행 환경별 예외. 여기 없는 경로는 derivation.appleBuildNumber를 쓴다.
appleBuildNumberExceptions:
  # Xcode Cloud는 build마다 자기 카운터(CI_BUILD_NUMBER)를 발급하고 App Store Connect는 그
  # 번호로 build를 식별한다. 태그 파생 encodedVersion을 CFBundleVersion에 쓰면 v0.1.9가 1009,
  # v0.2.0이 2000처럼 태그마다 값이 튀고, 같은 marketing version을 다시 올릴 때 번호가 되돌아가
  # 업로드가 거부된다. 그래서 이 경로만 build number 정본을 분리한다. 마케팅 버전은 여전히
  # 태그 하나가 정본이다(v0.1.9 -> 0.1.9).
  - id: xcode-cloud-ci-build-number
    appliesTo: xcode-cloud
    marketingVersion: tag-without-v-prefix
    buildNumber: xcode-cloud-run-build-number
    source: CI_BUILD_NUMBER
    required: true
    valueConstraint: positive-integer
    bounds:
      min: 1
      max: 2100000000
    injects:
      CFBundleShortVersionString: marketingVersion
      CFBundleVersion: buildNumber
    # 태그 파생 encodedVersion은 이 경로에서 Apple build number가 아니다. Android/iOS 런타임이
    # 공유하는 최소지원버전 비교값(runtimeVersionCode)으로만 남는다.
    encodedVersionRole: runtime-version-code-only
    failClosed: xcode-cloud-build-number-invalid

# iOS는 태그에서 marketing version만 받고 build number는 Xcode Cloud가 정본이다.
# 원장에는 검증된 관측값만 기록하며, 그 기록이 Android 번호를 소비하지 않는다.
iosObservation:
  buildNumber:
    authority: xcode-cloud-ci-build-number
    source: CI_BUILD_NUMBER
    injects: CFBundleVersion
  marketingVersion:
    authority: release-tag
    injects: CFBundleShortVersionString
  record:
    after: app-store-connect-readback
    writes: [ios.lastObservedBuildNumber, ios.lastObservedTag]
    mayWrite: [ios]
    mayNotWrite: [release, android, provenance]
    unverifiedValue: forbidden
    consumesAndroidNumber: false
    createsTag: false
    failClosed: ios-observation-unverified

# schemaVersion 2 이하에서 Android versionCode의 정본이던 태그 파생 공식.
# schemaVersion 3에서는 authority가 아니다. 이슈 #170 "배포 순서 7"의 전체 이관 readback
# 전까지 제거하지 않는다.
legacyDerivation:
  role: receiptless-tag-redeploy-and-superseded-receipt-verification
  wasAuthorityUntilSchemaVersion: 2
  appliesWhen:
    - tag-already-exists
    - tag-receipt-absent
    - superseded-receipt-recomputation
  forbiddenFor:
    - new-tag-allocation
    - ledger-initialization-value-guessing
    - deployment-when-android-legacy-fallback-sealed
  encodedVersionSource: derivation.encodedVersion.formula
  androidVersionCodeEpoch: 1000000000
  # 역대 계약이 쓰던 두 변형. superseded receipt 검증은 entry가 지정한 변형으로만 재계산한다.
  variants:
    epoch-plus-encoded-version: 'androidVersionCodeEpoch + encodedVersion'
    encoded-version: 'encodedVersion'
  removalGate: all-callers-migrated-and-provider-readback-confirmed
  failClosed: legacy-derivation-not-applicable

# 과거 계약 본문으로 찍힌 tag receipt를 판독만 허용하는 명시 목록.
# 목록에 있어도 값을 신뢰하지 않는다. receipt의 android-version-code와 apple-build-number를
# entry의 공식으로 다시 계산해 exact match할 때만 통과시키므로, 다른 계약으로 몰래 다른 번호를
# 넣는 경로가 막힌다. 실제 살아 있는 receipt가 확인된 revision만 넣고 추측으로 채우지 않는다.
supersededAuthorityRevisions:
  # seorilabs/lord-ledger v1.0.1 (android-version-code 1001000001). 마이그레이션 기준점이다.
  - revision: 3f9bbc92c6fe8422033633dcc1601bc3b8a5c9dc92b25b8c437e2ce1389539ac
    schemaVersion: 2
    androidVersionCodeFormula: epoch-plus-encoded-version
    appleBuildNumberFormula: encoded-version
    acceptedFor: [idempotent-tag-reuse, deployment-binding, audit]
    rewrite: forbidden
    newTagCreation: forbidden
    verification: recompute-with-legacy-derivation-and-exact-field-match
  # seorilabs/lucid-chess v3.0.9 (android-version-code 1003000009).
  - revision: 5daeca364a98da1f7bdcca32d31aeba51caeaf2c1f7fc4abf7365f023962e4db
    schemaVersion: 1
    androidVersionCodeFormula: epoch-plus-encoded-version
    appleBuildNumberFormula: encoded-version
    acceptedFor: [idempotent-tag-reuse, deployment-binding, audit]
    rewrite: forbidden
    newTagCreation: forbidden
    verification: recompute-with-legacy-derivation-and-exact-field-match

supersededAuthorityRevisionPolicy:
  appendOnly: true
  duplicateRevision: forbidden
  unknownRevision: fail-closed
  unknownRevisionFailClosed: tag-reuse-with-different-config
  minimumVerification: recompute-with-legacy-derivation
  evidenceRequired: observed-live-tag-receipt
  # org 정본 구현이 이 파일 본문에서 고정된 줄 모양만 읽어 목록을 만든다. YAML 파서를 쓰지
  # 않는다 — authorityRevision이 본문 sha256이라 파서를 들이면 "파싱 결과"와 "본문 해시"라는
  # 두 정본이 생기고, 릴리스 경로는 npm 설치 없이 실행되어야 한다.
  transport: extracted-from-contract-body-by-line-shape
  lineShape:
    revision: '  - revision: <64자리 sha256>'
    formula: '    androidVersionCodeFormula: <공식 이름>'

binding:
  # 하나의 release binding은 아래 필드로만 식별된다. 재현 불가능한 값은 포함하지 않는다.
  # appleBuildNumber는 derivation의 기본 파생값이다. Xcode Cloud archive의 CFBundleVersion은
  # appleBuildNumberExceptions를 따르므로 이 값과 다를 수 있고, binding은 그 값을 담지 않는다.
  fields:
    - tag
    - sourceSha
    - authorityRevision
    - configRevision
    - versionName
    - androidVersionCode
    - androidVersionCodeSource
    - appleBuildNumber
  authorityRevision:
    # 이 계약 본문의 revision. 워크플로우와 무관하게 같은 값이라 tag receipt에 넣어 검증한다.
    inputs:
      - authorityContractBody
    algorithm: sha256
  configRevision:
    # 같은 tag를 다른 계약/워크플로우 revision으로 다시 build하면 값이 달라진다.
    inputs:
      - calledWorkflowRepository
      - calledWorkflowRef
      - calledWorkflowSha
      - authorityRevision
    algorithm: sha256-canonical-lines
  # release-tag.yml이 annotated tag message에 남기는 불변 receipt.
  # 배포 경로는 receipt에서 androidVersionCode를 판독하고 sourceSha를 현재 실행값과 exact match한다.
  tagReceiptMarker: 'seori-release-binding: 1'
  tagReceiptFields:
    - authority
    - authority-revision
    - tag
    - source-sha
    - version-name
    - android-version-code
    - android-version-code-source
    - apple-build-number

tagCreation:
  # 태그는 운영자가 고른 exact source commit에만 단다.
  target: exact-operator-selected-commit
  markerCommit: forbidden
  branchPush: release-version-ledger-only
  tagMove: forbidden
  annotated: true
  # 이미 있는 태그는 번호를 새로 할당하지 않는다. 파생값과 receipt를 검증한 뒤에만
  # idempotent success로 보고하고 원장을 건드리지 않는다.
  existingTag:
    sameCommit: verify-binding-then-idempotent-success
    allocatesNewVersionCode: false
    mutatesLedger: false
    receiptPresent: exact-match-required
    # GitHub UI로 만든 lightweight/receipt 없는 태그는 태그와 commit 자체가 정본이고
    # Android 번호는 legacyDerivation을 쓴다. 원장이 sealed면 그것도 거부한다.
    receiptAbsent: tag-and-commit-are-authority-with-legacy-derivation
    differentCommit: fail-closed

artifactReadback:
  android-app-bundle:
    # AAB manifest는 aapt.pb.XmlNode protobuf다. aapt2 dump는 AAB를 인식하지 못하므로
    # zip에서 직접 꺼내 org 정본 parser로 읽는다.
    tool: aab-proto-manifest
    manifestPath: base/manifest/AndroidManifest.xml
    fields:
      versionName: android:versionName
      versionCode: android:versionCode
  xcode-archive:
    tool: info-plist
    fields:
      versionName: CFBundleShortVersionString
      versionCode: CFBundleVersion
  ait:
    # 지원 형식(AIT v1 컨테이너, legacy zip 번들) 어느 쪽도 내부 version 필드를 갖지 않는다.
    # 그래서 AppsInToss 배포의 tag 식별자는 canonical memo이고, artifact 동일성은 sha256 digest로
    # 고정한다. memo에는 digest가 들어가므로 같은 태그로 다른 파일을 올리면 대조에서 어긋난다.
    tool: ait-container
    supportedFormats: [ait, zip]
    internalVersionField: none
    # AIT v1 framing. zip payload 길이를 건너뛰고 스캔하면 payload를 열지 못한 채
    # "version 기록 없음"으로 통과하므로, 전체 길이를 exact로 검증한 뒤 파싱한다.
    framing:
      magic: AITBUNDL
      layout: [magic-8, format-version-4, protobuf-length-8, protobuf, zip-length-8, zip-payload, zero-trailer-8]
      exactLengthRequired: true
      zeroTrailerRequired: true
      zipEntrySource: central-directory
    fields:
      digest: sha256
      memo: canonical-release-memo-with-artifact-digest
    memoFields:
      - tag
      - version-name
      - android-version-code
      - source-sha-12
      - artifact-sha256
    # 컨테이너가 내부 version 기록을 갖게 되면 tag 단일 authority 전제가 깨진다.
    # 관측되면 계약 갱신 전까지 배포하지 않는다.
    onInternalVersionFieldObserved: fail-closed

# 빌드된 artifact 하나를 binding에 묶는 receipt. provider upload memo와 같은 digest를 담는다.
artifactReceipt:
  marker: 'seori-release-artifact: 1'
  digestSource:
    android-app-bundle: artifact-file
    ait: artifact-file
    # xcarchive는 디렉터리 번들이라 파일 하나로 digest를 잡을 수 없다. readback한 Info.plist를 쓴다.
    xcode-archive: archive-info-plist
  fields:
    - authority
    - authority-revision
    - tag
    - source-sha
    - config-revision
    - artifact-kind
    - artifact-digest-source
    - artifact-sha256
    - version-name
    - android-version-code
    - android-version-code-source
    - apple-build-number
    - upload-memo

# 업로드 스텝은 검증한 그 파일만 올린다. caller 스크립트가 자체 탐색으로 다른 파일을 고를 수 없다.
uploadBinding:
  passVerifiedArtifactPath: true
  reverifyDigestBeforeUpload: true
  uploaderSource: central-workflow-main
  repositoryLocalUploaderAllowed: false
  packageIdentity:
    source: aab-manifest-package
    mustMatch: backoffice-build-target-package
  # 검증된 파일이 있는 디렉터리에 같은 확장자 후보가 하나만 있어야 한다.
  singleCandidateInArtifactDirectory: true
  # 업로드 도구에 넘기는 exact 인자. 도구가 스스로 파일이나 build를 고르지 않는다.
  arguments:
    android-app-bundle: --aab-path
    ait: --location
    promote: --promote-version-code
  # 업로드 도구가 필수로 요구하는 태그 파생값.
  expectedEnvironment:
    - SEORI_EXPECTED_AAB_SHA256
    - SEORI_EXPECTED_ANDROID_VERSION_CODE

# 트랙 승격은 트랙의 최신 build가 아니라 해당 태그의 binding이 정한 versionCode 하나만 올린다.
trackPromotion:
  versionCodeSource: release-binding-android-version-code
  promotesLatestInTrack: false
  requiredArgument: --promote-version-code

# export_presets.cfg는 authority가 아니라 주입 대상이다. 어떤 preset을 바꿀지는 반드시 명시한다.
godotExportPreset:
  selector: explicit-preset-name-or-index
  ambiguousSelector: fail-closed
  mustMatchExportedPreset: true

# 전체 태그 중복·드리프트 감사는 태그 생성/배포 경로에서 실행하지 않는다.
diagnostics:
  fullTagAudit:
    command: scripts/release/audit-release-tags.mjs
    runsOn: [manual-dispatch, scheduled]
    forbiddenIn: [release-tag, resolve-release-version, deploy, promote]
    checks:
      - duplicate-android-version-code
      - ledger-behind-latest-tag
      - tag-version-code-above-ledger
      - unknown-authority-revision
      - tag-receipt-absent
      - tag-receipt-source-mismatch

failClosed:
