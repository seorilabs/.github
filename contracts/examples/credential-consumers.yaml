schemaVersion: 1
appId: sample-app
consumers:
  - id: google-play-publisher
    logicalCredentialId: shared/gcp/google-play-publisher
    scope: shared
    purpose: google-play-upload
    bindings:
      - target: github-actions
        referenceType: variable
        name: GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL
        environment: google-play
  - id: firebase-android-config
    logicalCredentialId: app/sample-app/firebase/android-config
    scope: app
    purpose: firebase-runtime-config
    bindings:
      - target: github-actions
        referenceType: secret
        name: FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64
        environment: google-play
