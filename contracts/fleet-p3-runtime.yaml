schemaVersion: 2

github:
  apiVersion: "2026-03-10"
  organization: seorilabs
  app:
    reuseExisting: true
    appId: 4124446
    slug: seorilabs-backoffice
    installationId: 142120077
    targetType: Organization
    repositorySelection: all
    permissions:
      metadata: read
      contents: write
      pull_requests: write
      workflows: write
      repository_custom_properties: write
      environments: write
      administration: write
      organization_administration: write
      organization_custom_properties: admin
    events:
      - repository
      - push
    humanGate:
      type: approval
      state: HUMAN_REAUTH_REQUIRED
      operation: GITHUB_APP_PERMISSION_EXPANSION_AND_INSTALLATION_ACCEPTANCE
      requiredRole: organization_owner
      automaticRetry: false
      requiredReadback:
        - app_id
        - slug
        - installation_id
        - repository_selection
        - suspended_at
        - permissions
        - events
  trustedExecution:
    state: blocked_unverified
    adapterMode: github-app-installation-token
    ambientPersonalTokenAllowed: false
    readOnlyAmbientAllowed: true
    appPrivateKeyCredentialId: shared/github/backoffice-app-private-key
    appId: 4124446
    installationId: 142120077
    requiredCapabilities:
      - organization_custom_properties_schema_write
      - repository_custom_properties_values_write
      - organization_rulesets_write
    humanGate:
      type: approval
      state: HUMAN_APPROVAL_REQUIRED
      operation: GITHUB_APP_TRUSTED_EXECUTOR_ACTIVATION
      requiredRole: organization_owner
      automaticRetry: false
      requiredReadback:
        - app_identity_exact
        - webhook_url_exact
        - installation_permissions_accepted
        - private_key_logical_id_active
        - short_lived_installation_token
        - exact_capability_scope
  webhook:
    url: https://backoffice.vzyx.xyz/api/webhooks
    appPrivateKeyCredentialId: shared/github/backoffice-app-private-key
    credentialId: shared/github/backoffice-app-webhook
    signatureHeader: x-hub-signature-256
    eventHeader: x-github-event
    deliveryHeader: x-github-delivery
    algorithm: hmac-sha256
    maxPayloadBytes: 1048576
  credentialRecovery:
    trustedAdapter:
      state: blocked_unverified
      module: scripts/fleet/github-credential-recovery.mjs
      entrypoint: recoverGithubAppCredentials
      credentialStore: security-framework-native-helper
      nativeModule: scripts/fleet/github-keychain-native-store.mjs
      nativeEntrypoint: openGithubKeychainCredentialStore
      helperIdentifier: com.seorilabs.fleet.github-keychain-helper
      binaryProtocol: binary-stdin-v1
      plaintextTransport: process-local-buffer-to-native-helper
      requiredReadback:
        - signed_helper_code_identity
        - unattended_acl_exact
        - keychain_readback_without_prompt
        - item_not_found_exact
        - batch_compensation_verified
    source:
      repository: seorilabs/seorilabs-backoffice
      sourceSha: 8d7162f352454b892ff749ac0d4061c492d7781f
      manifestPath: k8s/backoffice-sealedsecret.yaml
      manifestSha256: 21c61c243e5124c24d2c1a15ea385375ffefff9a5fe8877b10bb750cc4234aaf
      kind: SealedSecret
      name: backoffice-secrets
      namespace: platform
      recoveryCredentialId: shared/k8s/sealed-secrets-recovery
    mappings:
      - encryptedKey: GITHUB_PRIVATE_KEY
        targetCredentialId: shared/github/backoffice-app-private-key
        targetKind: macos-keychain-password
        keychainService: com.seorilabs.github.backoffice-app-private-key
        catalogPath: github/backoffice-app-private-key.keychain-ref
      - encryptedKey: GITHUB_WEBHOOK_SECRET
        targetCredentialId: shared/github/backoffice-app-webhook
        targetKind: macos-keychain-password
        keychainService: com.seorilabs.github.backoffice-app-webhook
        catalogPath: github/backoffice-app-webhook.keychain-ref
    plaintextPolicy:
      offlineOnly: true
      newKeyGenerationAllowed: false
      forbiddenSurfaces: [stdout, argv, environment, logs, files, commits, pull_requests]
    approvalGate:
      type: reauth
      state: HUMAN_REAUTH_REQUIRED
      operation: GITHUB_APP_CREDENTIAL_OFFLINE_RECOVERY
      requiredRole: credential_custodian
      automaticRetry: false
      requiredPreconditions:
        - source_digest_exact
        - encrypted_keys_present
        - recovery_credential_active
        - target_logical_ids_absent
        - pre_recovery_backup_restore_verified
      requiredReadback:
        - logical_ids_active
        - app_identity_exact
        - post_recovery_backup_restore_verified
  customProperties:
    - property_name: fleet-managed
      value_type: single_select
      required: false
      description: Fleet 중앙 관리 대상 여부
      allowed_values: ["true", "false"]
      values_editable_by: org_actors
      require_explicit_values: true
    - property_name: fleet-profile
      value_type: single_select
      required: false
      description: 중앙 WorkflowBundle stack profile
      allowed_values: [react-native, godot]
      values_editable_by: org_actors
      require_explicit_values: true
    - property_name: fleet-ruleset
      value_type: single_select
      required: false
      description: Fleet 보호 정책 전환 상태
      allowed_values: [shadow, active]
      values_editable_by: org_actors
      require_explicit_values: true
    - property_name: fleet-state
      value_type: single_select
      required: false
      description: Fleet repository lifecycle 상태
      allowed_values: [active, archived, needs_input]
      values_editable_by: org_actors
      require_explicit_values: true
  pilotValues:
    - repository: happy-farm
      values:
        fleet-managed: "true"
        fleet-profile: react-native
        fleet-ruleset: shadow
        fleet-state: active
    - repository: lizard-tycoon
      values:
        fleet-managed: "true"
        fleet-profile: godot
        fleet-ruleset: shadow
        fleet-state: active
  ruleset:
    name: Fleet Org Contract shadow
    target: branch
    enforcement: evaluate
    repositories: [happy-farm, lizard-tycoon]
    requiredStatusCheck: Org Contract / Org Contract

cloudBuild:
  projectId: seorilabs-ci
