          generation: cryptographic-random
          encoding: raw
          entropyBytes: 32
        - secretId: seori-auth-browser-vault
          generation: cryptographic-random
          encoding: raw
          entropyBytes: 32
        - secretId: seori-auth-canary-password
          generation: cryptographic-random
          encoding: base64url
          entropyBytes: 32
        - secretId: seori-auth-canary-totp-seed
          generation: cryptographic-random
          encoding: base32-no-padding
          entropyBytes: 20
      humanGate:
        type: approval
        state: HUMAN_APPROVAL_REQUIRED
