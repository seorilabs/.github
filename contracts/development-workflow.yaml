schemaVersion: 2
id: seorilabs-development-workflow-v2
scope: organization-development
plan:
  purpose: enumerate-all-work
  authorizesImplementation: false
design:
  canonicalRoot: docs/design
  humanApprovalRequiredBeforeImplementation: true
  approvalBinds: design-commit-and-scope
  visualFirst: true
  requiredElements:
    - purpose-scope-evidence
    - user-flow-and-states
    - structure-responsibilities-dependencies
    - data-interfaces-failure-handling
    - quality-requirements
    - alternatives-and-decisions
    - acceptance-test-review-plan
    - rollout-operations-rollback
    - approval-and-traceability
  testPlan: docs/design/<id>/test-plan.json
  testPlanSchema: contracts/test-plan.schema.json
  testPlanApproval: same-commit-as-design
  wikiRole: chronological-index-summary-links
  obsidianRole: cross-project-decisions-and-approval
  duplicateDesignBodies: forbidden
  ticketRequiredAfterApproval: true
  reuseSufficientIntakeIssue: true
implementation:
  preferredMethod: test-first
  redMustFailFor: unmet-behavior
  exceptionsRequire: reason-and-replacement-verification
testLevels:
  L1:
    scope: changed-features
    environments: dev-only
    executor: implementer-allowed
  L2:
    scope: changed-features
    environments: android-or-ios-device-with-optional-dev
    executor: different-agent-for-device-runs
  L3:
    scope: changed-and-all-features
    environments: any-planned
    executor: different-agent-or-verified-ci-for-all-runs
  environmentKinds:
    dev:
      - godot-editor
      - godot-headless-e2e
      - unity-editor
      - web-browser
      - native-development
      - service-runtime
    android:
      - android-device
    ios:
      - ios-device
  marketPlatforms:
    apps-in-toss: [android, ios]
    google-play: [android]
    app-store: [ios]
    web: []
    service: []
  mergeDesigns: highest-level-union-features-environments-markets-earliest-until
redesignReview:
  appliesTo: redesign-plan
  minimumLevel: L3
  rounds: 3
  planBeforeEveryRound: true
  everyRound: functional-and-ux
  execution: real-development-runtime
  reviewer: different-agent-from-implementer
  uxSpecialist: when-needed
  extraRounds: prior-human-approval-with-scope-time-cost
  selfRoleSwitchCountsAsIndependent: false
  endlessWithinRoundRetries: forbidden
floors:
  changedFiles: plan-baseline-to-candidate
  featurePaths: run-feature-in-planned-environments
  foundationPaths: device-run-on-target-market-platform
  inventoryVersions:
    v1: foundation-paths-raise-device-floor
    v2: platform-paths-raise-device-floor-e2e-workflow-required
  platformPaths: device-run-on-target-market-platform
  commonPlatformPaths: device-run-of-platform-features-or-core
  newPlatformFeature: device-run-not-overridable
  firstReleasePlatform: device-run-of-platform-features-not-overridable
  regressionPaths: full-regression-in-planned-environments
  unknownDiff: full-regression
  firstRelease: full-regression-not-overridable
  redesign: L3-not-overridable
  overrides: approved-plan-reason-only
  raiseAfterApproval: run-more-without-new-approval
  compareFileLimit: 300
  defaultRegressionPaths:
    - "**/project.godot"
    - "**/export_presets.cfg"
    - "**/addons/**"
    - "**/android/plugins/**"
    - "**/ios/plugins/**"
    - "**/android/build.gradle"
    - "**/android/settings.gradle"
    - "**/android/gradle.properties"
    - "**/android/gradle/**"
    - "**/android/app/build.gradle"
    - "**/AndroidManifest.xml"
    - "**/ios/Podfile"
    - "**/ios/Podfile.lock"
    - "**/*.xcodeproj/**"
    - "**/Info.plist"
    - "**/*.entitlements"
    - "**/app.json"
    - "**/app.config.*"
    - "**/granite.config.*"
    - "**/ProjectSettings/**"
    - "**/Packages/manifest.json"
    - "**/Packages/packages-lock.json"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/bun.lock"
    - "**/bun.lockb"
  defaultPlatformPaths:
    - "**/export_presets.cfg"
    - "**/android/**"
    - "**/ios/**"
    - "**/*.gdextension"
    - "**/*.gdap"
    - "**/AndroidManifest.xml"
    - "**/Info.plist"
    - "**/*.entitlements"
    - "**/*.xcodeproj/**"
runs:
  featureInventory: docs/qa/feature-inventory.json
  candidateBinding: exact-source-sha
  maxAgeHours: 168
  isolatedDataRequired: true
  configurationFingerprint: device-runs-of-verified-market
  skippedOrBlockedPass: forbidden
  evidenceSchema: contracts/development-evidence.schema.json
  releaseAssetPattern: development-evidence.<target>.<phase>.json
  verifier: scripts/release/verify-development-evidence.mjs
  ciExecutor:
    executor: ci
    environments: dev-only
    verification: github-actions-run-same-repository-candidate-sha-success-inventory-e2e-workflow
    freshness: api-updated-at
    countsAsIndependent: true
phases:
  before-build: dev-runs
  before-deploy: dev-runs
  before-release: all-runs-and-release-scope
  webAndServiceBeforeDeploy: all-runs-and-release-scope
  assetFallback:
    - before-release
    - before-deploy
    - before-build
foundationFeatures:
  inventoryFlag: foundation
  impactPaths: paths
  appliesTo: regression-scope
  unaffectedMayCarryForward: true
  rerunAllFlag: foundationRerun
  impactBaseline: actual-passing-run-sha
  impactDetection: changed-files-since-baseline
  unknownImpact: rerun
  carryForwardMaxAgeDays: 30
release:
  authorizedBy: approved-test-plan-release
  defaultUntil: public
  until:
    - test-track
    - review-submitted
    - public
  stopConditions:
    - unfixable-failure-within-approved-scope
    - verifier-required-check-or-ruleset-block
    - planned-environment-unavailable
    - market-rejection-outside-approved-scope
    - redesign-unresolved-after-three-rounds
    - separately-approved-action
  separatelyApprovedActions:
    - payment-products-prices-settlement
    - credential-create-or-rotate
    - data-delete-or-restore
    - security-change-without-cross-review
    - support-contact
legacyEvidence:
  schema: contracts/development-evidence-v1.schema.json
  acceptedUntil: "2026-10-22T00:00:00Z"
  removal: delete-v1-branch-after-acceptedUntil
autonomousImplementation:
  approvedDesignRequired: true
  missingApproval: draft-design-and-continue-next-unattempted
  releaseScope: approved-test-plan-release
internalTestflightBootstrap:
  schema: contracts/internal-testflight-bootstrap.schema.json
  grantSchema: contracts/internal-testflight-bootstrap-grant.schema.json
  optIn: explicit-reviewed-internal-testflight-id
  scope: first-internal-testflight-only
  approvalTrust: immutable-reviewed-central-grant
  originalVerdicts: preserve
  decisionStatus: human_exception
  productE2eStatus: blocked
  maxAgeHours: 168
  candidateLimit: 1
  buildUploadLimit: 1
  cloud12FailureRecovery: single-reviewed-failed12-to13-total-cloud2-upload1
  phases: [before-build, before-deploy]
  nativeQaWaived: false
  publicReleaseRequires: normal-verifier-and-actual-iphone-whole-e2e
  revocation: read-current-central-grant-every-phase
  grantRegistry:
    - contracts/internal-testflight-bootstrap/spiritgate-1.1.0-first-internal.json
